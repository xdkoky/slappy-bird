<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bgG" cx="45%" cy="40%" r="75%">
      <stop offset="0" stop-color="#7fe8ff"/><stop offset=".45" stop-color="#22a8f0"/><stop offset="1" stop-color="#0a3d9a"/>
    </radialGradient>
    <radialGradient id="bodyG" cx="38%" cy="28%" r="80%">
      <stop offset="0" stop-color="#fffbd0"/><stop offset=".25" stop-color="#ffe94a"/><stop offset=".7" stop-color="#ffc20e"/><stop offset="1" stop-color="#e88a00"/>
    </radialGradient>
    <linearGradient id="bellyG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffb43a"/><stop offset="1" stop-color="#e86a00"/>
    </linearGradient>
    <linearGradient id="beakT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff9a4a"/><stop offset="1" stop-color="#f0400e"/>
    </linearGradient>
    <linearGradient id="beakB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f05a1a"/><stop offset="1" stop-color="#b8240a"/>
    </linearGradient>
    <linearGradient id="wingG" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#f3dcae"/>
    </linearGradient>
    <radialGradient id="vig" cx="50%" cy="50%" r="72%">
      <stop offset=".6" stop-color="#000" stop-opacity="0"/><stop offset="1" stop-color="#001040" stop-opacity=".55"/>
    </radialGradient>
    <clipPath id="bodyClip"><ellipse cx="0" cy="0" rx="340" ry="290"/></clipPath>
  </defs>

  <rect width="1024" height="1024" fill="url(#bgG)"/>
  <!-- sunburst -->
  <g transform="translate(460 470)" fill="#ffffff" opacity=".13">
    <path id="ray" d="M0 0 L-70 -900 L70 -900 Z"/>
    <use href="#ray" transform="rotate(30)"/><use href="#ray" transform="rotate(60)"/><use href="#ray" transform="rotate(90)"/>
    <use href="#ray" transform="rotate(120)"/><use href="#ray" transform="rotate(150)"/><use href="#ray" transform="rotate(180)"/>
    <use href="#ray" transform="rotate(210)"/><use href="#ray" transform="rotate(240)"/><use href="#ray" transform="rotate(270)"/>
    <use href="#ray" transform="rotate(300)"/><use href="#ray" transform="rotate(330)"/>
  </g>
  <rect width="1024" height="1024" fill="url(#vig)"/>

  <!-- speed lines -->
  <g stroke="#ffffff" stroke-linecap="round" opacity=".85">
    <line x1="40" y1="300" x2="150" y2="330" stroke-width="22"/>
    <line x1="50" y1="760" x2="160" y2="720" stroke-width="20"/>
  </g>

  <g transform="translate(468 560) rotate(-14) scale(.9)">
    <!-- shadow -->
    <ellipse cx="18" cy="34" rx="350" ry="300" fill="#00184a" opacity=".35"/>
    <!-- head tuft -->
    <g stroke="#3a1a28" stroke-width="26" stroke-linejoin="round" fill="#ffd51e">
      <path d="M-60 -270 Q-120 -420 -20 -470 Q0 -380 30 -285 Z"/>
      <path d="M20 -280 Q40 -440 150 -440 Q100 -350 100 -270 Z"/>
    </g>
    <!-- body -->
    <ellipse cx="0" cy="0" rx="340" ry="290" fill="url(#bodyG)"/>
    <g clip-path="url(#bodyClip)">
      <ellipse cx="40" cy="250" rx="380" ry="170" fill="url(#bellyG)"/>
      <ellipse cx="-120" cy="-170" rx="150" ry="70" fill="#ffffff" opacity=".45" transform="rotate(-18 -120 -170)"/>
    </g>
    <ellipse cx="0" cy="0" rx="340" ry="290" fill="none" stroke="#3a1a28" stroke-width="30"/>

    <!-- rim light + core shadow -->
    <g clip-path="url(#bodyClip)">
      <path d="M-300 120 Q-330 -40 -250 -160" fill="none" stroke="#fff6b0" stroke-width="22" stroke-linecap="round" opacity=".8"/>
    </g>

    <!-- eye -->
    <circle cx="150" cy="-95" r="138" fill="#ffffff" stroke="#3a1a28" stroke-width="26"/>
    <circle cx="205" cy="-80" r="64" fill="#1a0c14"/>
    <circle cx="228" cy="-106" r="21" fill="#ffffff"/>
    <circle cx="180" cy="-50" r="9" fill="#ffffff" opacity=".8"/>
    <!-- angry brow: low over the beak side -->
    <path d="M-30 -350 Q150 -280 320 -150 L300 -95 Q140 -200 -25 -265 Z" fill="#3a1a28" stroke="#3a1a28" stroke-width="12" stroke-linejoin="round"/>

    <!-- beak, open and shouting -->
    <path d="M215 95 L485 105 L470 150 L220 150 Z" fill="#5a0a1a" stroke="#3a1a28" stroke-width="20" stroke-linejoin="round"/>
    <ellipse cx="330" cy="140" rx="70" ry="18" fill="#ff6a8a"/>
    <path d="M185 20 Q380 -40 560 55 Q560 100 500 108 L215 100 Q190 70 185 20 Z" fill="url(#beakT)" stroke="#3a1a28" stroke-width="26" stroke-linejoin="round"/>
    <path d="M250 40 Q390 10 500 55" fill="none" stroke="#ffd0a0" stroke-width="14" stroke-linecap="round" opacity=".85"/>
    <path d="M220 150 L480 152 Q510 175 470 205 Q340 250 225 225 Q205 190 220 150 Z" fill="url(#beakB)" stroke="#3a1a28" stroke-width="26" stroke-linejoin="round"/>

    <!-- wing, raised mid-slap -->
    <g transform="translate(-215 40) rotate(-50)">
      <path d="M0 0 Q-20 -120 40 -230 Q70 -270 100 -235 Q95 -195 90 -170 Q120 -230 155 -205 Q165 -160 140 -120 Q180 -150 200 -115 Q200 -60 150 -10 Q80 50 0 0 Z"
            fill="url(#wingG)" stroke="#3a1a28" stroke-width="26" stroke-linejoin="round"/>
      <path d="M60 -40 Q70 -120 75 -190 M100 -40 Q120 -100 130 -150" fill="none" stroke="#e0c08a" stroke-width="12" stroke-linecap="round"/>
    </g>
    <!-- slap burst -->
    <g transform="translate(-300 -320) rotate(10) scale(.85)">
      <path d="M0 -95 L25 -30 L95 -45 L45 5 L80 70 L10 35 L-30 95 L-35 25 L-100 15 L-40 -20 Z" fill="#fff36a" stroke="#3a1a28" stroke-width="18" stroke-linejoin="round"/>
      <path d="M0 -45 L12 -12 L45 -18 L20 5 L35 35 L5 18 L-12 45 L-15 12 L-45 8 L-18 -10 Z" fill="#ffffff"/>
    </g>
  </g>
</svg>
