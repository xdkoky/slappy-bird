  html, body { margin:0; height:100%; background:#141210; overflow:hidden;

  #bezel { position:relative; padding:22px 22px 46px; border-radius:28px;
    background:linear-gradient(160deg,#4d4943 0%,#2d2a26 55%,#221f1c 100%);

  #screen { display:block; border-radius:16px; background:#000;

    letter-spacing:3px; color:#8f897e; text-shadow:0 1px 0 #000; }
  #led { position:absolute; bottom:17px; right:30px; width:8px; height:8px; border-radius:50%;
    background:#f93; box-shadow:0 0 8px #f93; }
  #led.on { background:#4f4; box-shadow:0 0 8px #4f4; }
  body.fs { background:#000; cursor:none; }
  body.fs #bezel { padding:0; border-radius:0; background:none; box-shadow:none; }
  body.fs #screen { border-radius:0; box-shadow:none; }
  body.fs #label, body.fs #led { display:none; }
  /* iPhone / touch: edge-to-edge (the sky runs up under the status bar), no browser gestures */
  html.touch, html.touch body { background:var(--sky, #4ec0ca);   /* sky colour: iOS tints the status bar area from it */
    touch-action:none; overscroll-behavior:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  /* The canvas starts at the very top (sky under the status bar) and runs past the bottom edge, so
     no page background can ever show above or below the game; the overhang is simply off-screen. */
  html.touch #monitor { position:fixed; left:0; right:0; top:0; bottom:auto; height:calc(100vh + 120px);
    align-items:flex-start; overflow:visible; }
  #statusbar { display:none; }
  #safe { position:fixed; top:0; left:0; width:0; height:0; visibility:hidden; pointer-events:none;

  html.touch #bezel { padding:0; border-radius:0; background:none; box-shadow:none; }
  html.touch #screen { border-radius:0; box-shadow:none; }
  html.touch #label, html.touch #led { display:none; }
  /* The name / room-code window is drawn in the game canvas; this invisible input sits exactly over the
     drawn text field so tapping it opens the phone keyboard. */
  #namebox, #chatbox { display:none; position:fixed; inset:0; z-index:20; pointer-events:none; }
  #namebox input, #chatbox input { position:absolute; pointer-events:auto; box-sizing:border-box; margin:0; padding:0 8px; border:0;
