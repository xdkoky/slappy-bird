<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Slappy Bird">
<meta name="theme-color" content="#4ec0ca">
<link rel="apple-touch-icon" href="icon-180.png?v=6">
<link rel="manifest" href="manifest.webmanifest">
<title>Slappy Bird</title>
<style>
  html, body { margin:0; height:100%; background:#141210; overflow:hidden;
    user-select:none; -webkit-user-select:none; cursor:default; }
  #monitor { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #bezel { position:relative; padding:22px 22px 46px; border-radius:28px;
    background:linear-gradient(160deg,#4d4943 0%,#2d2a26 55%,#221f1c 100%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.14), inset 0 -3px 0 rgba(0,0,0,.45), 0 24px 60px rgba(0,0,0,.65); }
  #screen { display:block; border-radius:16px; background:#000;
    box-shadow: 0 0 0 3px #0c0b0a, 0 0 0 5px #3a3631; }
  #label { position:absolute; bottom:15px; left:28px; font:700 11px/1 Menlo, monospace;
    letter-spacing:3px; color:#8f897e; text-shadow:0 1px 0 #000; }
  #led { position:absolute; bottom:17px; right:30px; width:8px; height:8px; border-radius:50%;
    background:#f93; box-shadow:0 0 8px #f93; }
  #led.on { background:#4f4; box-shadow:0 0 8px #4f4; }
  body.fs { background:#000; cursor:none; }
  body.fs #bezel { padding:0; border-radius:0; background:none; box-shadow:none; }
  body.fs #screen { border-radius:0; box-shadow:none; }
  body.fs #label, body.fs #led { display:none; }
  /* iPhone / touch: edge-to-edge (the sky runs up under the status bar), no browser gestures */
  html.touch, html.touch body { background:#4ec0ca;   /* sky colour: iOS tints the status bar area from it */
    touch-action:none; overscroll-behavior:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  html.touch #monitor { position:fixed; inset:0; height:100vh; height:100dvh; }
  #safe { position:fixed; top:0; left:0; width:0; height:0; visibility:hidden; pointer-events:none;
    padding-top:env(safe-area-inset-top); }
  html.touch #bezel { padding:0; border-radius:0; background:none; box-shadow:none; }
  html.touch #screen { border-radius:0; box-shadow:none; }
  html.touch #label, html.touch #led { display:none; }
</style>
</head>
<body>
<div id="safe"></div>
<div id="monitor">
  <div id="bezel">
    <canvas id="screen"></canvas>
    <div id="label">SLAPTRON 9000</div>
    <div id="led" title="Accelerometer"></div>
  </div>
</div>

<script>
'use strict';
// Touch mode: running in a browser (not the Mac app) on a touchscreen, e.g. as an iPhone Home Screen web app.
const NATIVE = !!(window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.native);
const TOUCH = !NATIVE && (matchMedia('(pointer: coarse)').matches || /[?&]touch\b/.test(location.search));
if (TOUCH) document.documentElement.classList.add('touch');
const ACT = TOUCH ? 'TAP' : 'SLAP';
// ============================================================ persistence
const SAVED = Object.assign({ best: 0, sens: 6, crt: true, muted: false }, window.SAVED || {});
try { if (!window.SAVED) Object.assign(SAVED, JSON.parse(localStorage.getItem('slappy') || '{}')); } catch {}
let best = SAVED.best | 0, sensLevel = SAVED.sens | 0 || 6, crtOn = SAVED.crt !== false, muted = !!SAVED.muted, notesSeen = SAVED.notes | 0;
let bank = SAVED.coins | 0, tokens = SAVED.tokens | 0;   // coins and slot tokens carry over between runs
function save() {
  const d = { best, sens: sensLevel, crt: crtOn, muted, notes: notesSeen, coins: bank, tokens };
  try { window.webkit.messageHandlers.native.postMessage(Object.assign({ type: 'save' }, d)); }
  catch { try { localStorage.setItem('slappy', JSON.stringify(d)); } catch {} }
}
function native(type) { try { window.webkit.messageHandlers.native.postMessage({ type }); } catch {} }
function log(msg) { try { window.webkit.messageHandlers.native.postMessage({ type: 'log', msg: String(msg) }); } catch { console.log(msg); } }
addEventListener('error', e => log(e.message + ' @' + e.lineno));

// ============================================================ audio (synthesized)
let ac, master, verbIn, noiseBuf;
function audioInit() {
  if (ac) { if (ac.state !== 'running') ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)();
  const comp = ac.createDynamicsCompressor();
  comp.threshold.value = -14; comp.ratio.value = 4; comp.attack.value = 0.002; comp.release.value = 0.12;
  master = ac.createGain(); master.gain.value = muted ? 0 : 0.8;
  master.connect(comp); comp.connect(ac.destination);
  // small room reverb from a decaying noise impulse
  const len = ac.sampleRate * 0.7, ir = ac.createBuffer(2, len, ac.sampleRate);
  for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.5); }
  const conv = ac.createConvolver(); conv.buffer = ir;
  verbIn = ac.createGain(); verbIn.gain.value = 0.22; verbIn.connect(conv); conv.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const nd = noiseBuf.getChannelData(0); for (let i = 0; i < nd.length; i++) nd[i] = Math.random() * 2 - 1;
}
function route(node, verb = 0.3) {
  node.connect(master);
  if (verb) { const s = ac.createGain(); s.gain.value = verb; node.connect(s); s.connect(verbIn); }
}
function env(param, t, a, peak, d, end = 0.0001) {
  param.setValueAtTime(0.0001, t);
  param.exponentialRampToValueAtTime(peak, t + a);
  param.exponentialRampToValueAtTime(end, t + a + d);
}
function noise(t, dur) { const n = ac.createBufferSource(); n.buffer = noiseBuf; n.start(t, Math.random() * 0.5); n.stop(t + dur); return n; }
function osc(type, t, dur, f0, f1) {
  const o = ac.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f0, t); if (f1) o.frequency.exponentialRampToValueAtTime(f1, t + dur);
  o.start(t); o.stop(t + dur + 0.05); return o;
}
const SFX = {
  wing() { // airy "fwip" + soft body
    const t = ac.currentTime, n = noise(t, 0.16), bp = ac.createBiquadFilter(), gn = ac.createGain();
    bp.type = 'bandpass'; bp.Q.value = 1.4;
    bp.frequency.setValueAtTime(700, t); bp.frequency.exponentialRampToValueAtTime(2600, t + 0.035); bp.frequency.exponentialRampToValueAtTime(500, t + 0.14);
    env(gn.gain, t, 0.01, 0.9, 0.13); n.connect(bp); bp.connect(gn); route(gn, 0.08);
    const o = osc('sine', t, 0.08, 260, 140), og = ac.createGain(); env(og.gain, t, 0.005, 0.25, 0.07); o.connect(og); route(og, 0);
  },
  point() { // two-tone coin chime with echo
    const t = ac.currentTime;
    [[987.77, 0, 0.12], [1318.51, 0.085, 0.42]].forEach(([f, dt, d]) => {
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6000;
      const gn = ac.createGain(); env(gn.gain, t + dt, 0.003, 0.32, d);
      const a = osc('square', t + dt, d, f), b = osc('triangle', t + dt, d, f * 2);
      const bg = ac.createGain(); bg.gain.value = 0.5;
      a.connect(lp); b.connect(bg); bg.connect(lp); lp.connect(gn); route(gn, 0.35);
    });
  },
  hit() { // crack + deep thud
    const t = ac.currentTime;
    const n = noise(t, 0.06), hp = ac.createBiquadFilter(), ng = ac.createGain();
    hp.type = 'highpass'; hp.frequency.value = 1800; env(ng.gain, t, 0.001, 0.9, 0.05); n.connect(hp); hp.connect(ng); route(ng, 0.2);
    const o = osc('sine', t, 0.22, 190, 42), og = ac.createGain(); env(og.gain, t, 0.002, 1.0, 0.22); o.connect(og); route(og, 0.1);
    const s = osc('square', t, 0.12, 110, 40), lp = ac.createBiquadFilter(), sg = ac.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 700; env(sg.gain, t, 0.002, 0.3, 0.11); s.connect(lp); lp.connect(sg); route(sg, 0);
  },
  die() { // descending whistle-swoosh
    const t = ac.currentTime;
    const o = osc('triangle', t, 0.6, 620, 90), og = ac.createGain(); env(og.gain, t, 0.02, 0.35, 0.58);
    const lfo = osc('sine', t, 0.6, 18), lg = ac.createGain(); lg.gain.value = 14; lfo.connect(lg); lg.connect(o.frequency);
    o.connect(og); route(og, 0.3);
    const n = noise(t, 0.6), lp = ac.createBiquadFilter(), ng = ac.createGain();
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(2500, t); lp.frequency.exponentialRampToValueAtTime(250, t + 0.6);
    env(ng.gain, t, 0.05, 0.25, 0.55); n.connect(lp); lp.connect(ng); route(ng, 0.2);
  },
  swoosh() { // UI transition
    const t = ac.currentTime, n = noise(t, 0.35), bp = ac.createBiquadFilter(), gn = ac.createGain();
    bp.type = 'bandpass'; bp.Q.value = 2;
    bp.frequency.setValueAtTime(350, t); bp.frequency.exponentialRampToValueAtTime(4500, t + 0.3);
    env(gn.gain, t, 0.12, 0.6, 0.2); n.connect(bp); bp.connect(gn); route(gn, 0.25);
  },
  fanfare() { // new best
    const t = ac.currentTime;
    [1046.5, 1318.5, 1568, 2093].forEach((f, i) => {
      const gn = ac.createGain(); env(gn.gain, t + i * 0.07, 0.004, 0.22, i === 3 ? 0.5 : 0.12);
      const a = osc('square', t + i * 0.07, 0.6, f), lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5000;
      a.connect(lp); lp.connect(gn); route(gn, 0.4);
    });
  },
  alarm() { // three-cycle siren
    const t = ac.currentTime;
    for (let i = 0; i < 6; i++) {
      const gn = ac.createGain(), lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2500;
      env(gn.gain, t + i * 0.2, 0.01, 0.22, 0.18);
      osc('square', t + i * 0.2, 0.19, i % 2 ? 660 : 880).connect(lp); lp.connect(gn); route(gn, 0.35);
    }
  },
  charge() { // rising whine while the boss winds up
    const t = ac.currentTime, o = osc('sawtooth', t, 0.42, 180, 1100), bp = ac.createBiquadFilter(), gn = ac.createGain();
    bp.type = 'bandpass'; bp.Q.value = 4; bp.frequency.setValueAtTime(400, t); bp.frequency.exponentialRampToValueAtTime(2400, t + 0.42);
    gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(0.16, t + 0.38); gn.gain.exponentialRampToValueAtTime(0.0001, t + 0.45);
    o.connect(bp); bp.connect(gn); route(gn, 0.2);
  },
  shoot() {
    const t = ac.currentTime, o = osc('square', t, 0.2, 900, 120), lp = ac.createBiquadFilter(), gn = ac.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 3000; env(gn.gain, t, 0.003, 0.25, 0.19);
    o.connect(lp); lp.connect(gn); route(gn, 0.25);
    const n = noise(t, 0.12), ng = ac.createGain(), bp = ac.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 1500;
    env(ng.gain, t, 0.002, 0.3, 0.1); n.connect(bp); bp.connect(ng); route(ng, 0.1);
  },
  pew() { // small pellet
    const t = ac.currentTime, o = osc('square', t, 0.07, 1600, 500), gn = ac.createGain();
    env(gn.gain, t, 0.002, 0.08, 0.06); o.connect(gn); route(gn, 0.1);
  },
  parry(combo) { // bright metallic "TING" that climbs with the combo, plus a whoosh and body thump
    const t = ac.currentTime, f = 1046.5 * Math.pow(2, Math.min(combo - 1, 8) * 2 / 12);
    [[f, 0.5, 0.45], [f * 2.76, 0.18, 0.25], [f * 5.4, 0.08, 0.12]].forEach(([fr, v, d]) => {
      const gn = ac.createGain(); env(gn.gain, t, 0.001, v, d); osc('sine', t, d, fr).connect(gn); route(gn, 0.45);
    });
    const n = noise(t, 0.2), hp = ac.createBiquadFilter(), ng = ac.createGain();
    hp.type = 'highpass'; hp.frequency.setValueAtTime(800, t); hp.frequency.exponentialRampToValueAtTime(5000, t + 0.18);
    env(ng.gain, t, 0.004, 0.5, 0.17); n.connect(hp); hp.connect(ng); route(ng, 0.2);
    const o = osc('sine', t, 0.12, 300, 90), og = ac.createGain(); env(og.gain, t, 0.002, 0.6, 0.11); o.connect(og); route(og, 0);
  },
  bossHit() { // heavy crunch
    const t = ac.currentTime;
    const n = noise(t, 0.35), lp = ac.createBiquadFilter(), ng = ac.createGain();
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(4000, t); lp.frequency.exponentialRampToValueAtTime(300, t + 0.3);
    env(ng.gain, t, 0.001, 0.9, 0.32); n.connect(lp); lp.connect(ng); route(ng, 0.3);
    const o = osc('sine', t, 0.4, 150, 35), og = ac.createGain(); env(og.gain, t, 0.002, 1.0, 0.38); o.connect(og); route(og, 0.1);
    const q = osc('square', t, 0.18, 240, 60), ql = ac.createBiquadFilter(), qg = ac.createGain();
    ql.type = 'lowpass'; ql.frequency.value = 900; env(qg.gain, t, 0.002, 0.35, 0.17); q.connect(ql); ql.connect(qg); route(qg, 0);
  },
  explode(big) {
    const t = ac.currentTime, d = big ? 1.4 : 0.5;
    const n = noise(t, d), lp = ac.createBiquadFilter(), ng = ac.createGain();
    lp.type = 'lowpass'; lp.frequency.setValueAtTime(big ? 5000 : 3000, t); lp.frequency.exponentialRampToValueAtTime(80, t + d);
    env(ng.gain, t, 0.002, big ? 1.0 : 0.55, d); n.connect(lp); lp.connect(ng); route(ng, 0.4);
    const o = osc('sine', t, d, big ? 110 : 90, 28), og = ac.createGain(); env(og.gain, t, 0.002, big ? 1.0 : 0.5, d); o.connect(og); route(og, 0.2);
  },
  hurt() {
    const t = ac.currentTime, o = osc('square', t, 0.3, 700, 160), lp = ac.createBiquadFilter(), gn = ac.createGain();
    const lfo = osc('sine', t, 0.3, 30), lg = ac.createGain(); lg.gain.value = 60; lfo.connect(lg); lg.connect(o.frequency);
    lp.type = 'lowpass'; lp.frequency.value = 2500; env(gn.gain, t, 0.003, 0.35, 0.28); o.connect(lp); lp.connect(gn); route(gn, 0.25);
  },
  victory() {
    const t = ac.currentTime, seq = [[523.25, 0], [659.25, 0.1], [783.99, 0.2], [1046.5, 0.3], [783.99, 0.45], [1046.5, 0.55]];
    seq.forEach(([f, dt], i) => {
      const gn = ac.createGain(), d = i === seq.length - 1 ? 0.9 : 0.14; env(gn.gain, t + dt, 0.005, 0.22, d);
      const a = osc('square', t + dt, d, f), b = osc('triangle', t + dt, d, f / 2), lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4500;
      a.connect(lp); b.connect(lp); lp.connect(gn); route(gn, 0.45);
    });
  },
  blip(up) {
    const t = ac.currentTime, gn = ac.createGain(); env(gn.gain, t, 0.002, 0.18, 0.05);
    const o = osc('square', t, 0.05, up ? 1400 : 1000), lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 4000;
    o.connect(lp); lp.connect(gn); route(gn, 0.1);
  },
  coin(big) { // quick bright "bling", a sparkly triple for big coins
    const t = ac.currentTime, seq = big ? [1568, 2093, 3136] : [1975.5, 2637];
    seq.forEach((f, i) => {
      const gn = ac.createGain(), d = i === seq.length - 1 ? 0.3 : 0.06; env(gn.gain, t + i * 0.05, 0.002, big ? 0.2 : 0.16, d);
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 7000;
      osc('square', t + i * 0.05, d, f).connect(lp); lp.connect(gn); route(gn, 0.3);
    });
  },
  token() { // magical rising sparkle
    const t = ac.currentTime;
    [784, 1046.5, 1318.5, 1568, 2093, 2637].forEach((f, i) => {
      const gn = ac.createGain(), ts = t + i * 0.045, d = i === 5 ? 0.6 : 0.12; env(gn.gain, ts, 0.003, 0.18, d);
      osc('triangle', ts, d, f).connect(gn); route(gn, 0.5);
      const g2 = ac.createGain(); env(g2.gain, ts, 0.002, 0.06, d); osc('square', ts, d, f * 2).connect(g2); route(g2, 0.4);
    });
  },
  lever() { // ratchet clicks + clunk
    const t = ac.currentTime;
    for (let i = 0; i < 6; i++) {
      const n = noise(t + i * 0.03, 0.02), bp = ac.createBiquadFilter(), gn = ac.createGain();
      bp.type = 'bandpass'; bp.frequency.value = 3200; bp.Q.value = 3; env(gn.gain, t + i * 0.03, 0.001, 0.35, 0.018); n.connect(bp); bp.connect(gn); route(gn, 0.05);
    }
    const o = osc('sine', t + 0.2, 0.14, 160, 55), og = ac.createGain(); env(og.gain, t + 0.2, 0.002, 0.7, 0.13); o.connect(og); route(og, 0.1);
  },
  tick() {
    const t = ac.currentTime, gn = ac.createGain(); env(gn.gain, t, 0.001, 0.05, 0.015);
    osc('square', t, 0.02, 2600).connect(gn); route(gn, 0);
  },
  reelStop() { // heavy thunk
    const t = ac.currentTime, o = osc('sine', t, 0.12, 200, 70), og = ac.createGain(); env(og.gain, t, 0.002, 0.7, 0.11); o.connect(og); route(og, 0.1);
    const n = noise(t, 0.04), lp = ac.createBiquadFilter(), ng = ac.createGain();
    lp.type = 'lowpass'; lp.frequency.value = 1800; env(ng.gain, t, 0.001, 0.5, 0.035); n.connect(lp); lp.connect(ng); route(ng, 0.1);
  },
  heartbeat() {
    const t = ac.currentTime;
    [0, 0.17].forEach((dt, i) => { const o = osc('sine', t + dt, 0.16, 75, 38), og = ac.createGain(); env(og.gain, t + dt, 0.004, i ? 0.6 : 0.9, 0.15); o.connect(og); route(og, 0.05); });
  },
  payout(n) { // a cascade of coin dings
    const t = ac.currentTime;
    for (let i = 0; i < Math.min(n, 12); i++) {
      const gn = ac.createGain(); env(gn.gain, t + i * 0.07, 0.002, 0.14, 0.12);
      osc('square', t + i * 0.07, 0.13, i % 2 ? 2637 : 1975.5).connect(gn); route(gn, 0.3);
    }
  },
  jackpot() { // ringing bells, then the victory jingle
    const t = ac.currentTime;
    for (let i = 0; i < 14; i++) {
      const gn = ac.createGain(); env(gn.gain, t + i * 0.055, 0.002, 0.13, 0.08);
      const lp = ac.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 6000;
      osc('square', t + i * 0.055, 0.09, i % 2 ? 2093 : 1568).connect(lp); lp.connect(gn); route(gn, 0.35);
    }
    setTimeout(() => sfx('victory'), 800);
  },
  lose() { // sad trombone
    const t = ac.currentTime;
    [[196, 0, 0.26], [185, 0.3, 0.26], [174.6, 0.6, 0.26], [164.8, 0.9, 0.8]].forEach(([f, dt, d], i) => {
      const o = osc('sawtooth', t + dt, d, f), lp = ac.createBiquadFilter(), gn = ac.createGain();
      lp.type = 'lowpass'; lp.Q.value = 3;
      lp.frequency.setValueAtTime(400, t + dt); lp.frequency.linearRampToValueAtTime(1300, t + dt + 0.08); lp.frequency.linearRampToValueAtTime(600, t + dt + d);
      if (i === 3) { const lfo = osc('sine', t + dt, d, 6), lg = ac.createGain(); lg.gain.value = 5; lfo.connect(lg); lg.connect(o.frequency); }
      env(gn.gain, t + dt, 0.03, 0.22, d); o.connect(lp); lp.connect(gn); route(gn, 0.25);
    });
  },
  choir() { // heavenly "aah": a C major chord of detuned voices through vowel formants, plus chimes and an echo
    const t = ac.currentTime, dur = 3.4;
    const echo = ac.createDelay(1), fb = ac.createGain(); echo.delayTime.value = 0.27; fb.gain.value = 0.38;
    echo.connect(fb); fb.connect(echo); route(echo, 0.6);
    const bus = ac.createGain(), out = ac.createGain();
    out.gain.setValueAtTime(0.0001, t); out.gain.exponentialRampToValueAtTime(0.5, t + 0.7);
    out.gain.setValueAtTime(0.5, t + 2.3); out.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    [[800, 6, 1], [1150, 8, 0.5], [2900, 10, 0.22]].forEach(([f, q, v]) => {
      const bp = ac.createBiquadFilter(), gv = ac.createGain(); bp.type = 'bandpass'; bp.frequency.value = f; bp.Q.value = q; gv.gain.value = v;
      bus.connect(bp); bp.connect(gv); gv.connect(out);
    });
    route(out, 0.8); out.connect(echo);
    const vib = osc('sine', t, dur, 5.2), vg = ac.createGain(); vg.gain.value = 0.006; vib.connect(vg);
    for (const f of [130.81, 261.63, 329.63, 392, 523.25, 659.25, 783.99]) for (const cents of [-7, 7]) {
      const o = ac.createOscillator(), k = Math.pow(2, cents / 1200), pg = ac.createGain();
      o.type = 'sawtooth'; o.frequency.setValueAtTime(f * k * 0.94, t); o.frequency.exponentialRampToValueAtTime(f * k, t + 0.35);
      pg.gain.value = f * k; vg.connect(pg); pg.connect(o.frequency);   // vibrato scaled to pitch
      const vgain = ac.createGain(); vgain.gain.value = 0.09; o.connect(vgain); vgain.connect(bus);
      o.start(t); o.stop(t + dur + 0.05);
    }
    [1046.5, 1318.5, 1568, 2093, 2637, 3136].forEach((f, i) => {   // angelic chime arpeggio
      const ts = t + 0.2 + i * 0.11;

const bg = (() => {
  const W = 144, H = 200, c = document.createElement('canvas'); c.width = W; c.height = H;
  const x = c.getContext('2d');
  const disc = (cx, cy, r, col) => { x.fillStyle = col;
    for (const ox of [-W, 0, W]) for (let j = -r; j <= r; j++) for (let i = -r; i <= r; i++)
      if (i * i + j * j <= r * r + r * 0.6) x.fillRect(cx + i + ox, cy + j, 1, 1); };
  x.fillStyle = '#4ec0ca'; x.fillRect(0, 0, W, H);

  const clouds = []; for (let i = 0; i < W; i += 9) clouds.push([i, 150 + rnd() * 6 | 0, 7 + rnd() * 8 | 0]);
  clouds.forEach(([cx, cy, r]) => disc(cx, cy, r + 1, '#d6f2e4'));
  clouds.forEach(([cx, cy, r]) => disc(cx, cy, r, '#eafcf1'));
  x.fillStyle = '#eafcf1'; x.fillRect(0, 156, W, H - 156);
  // city
  for (let bx = 0; bx < W;) {
    const bw = 8 + rnd() * 8 | 0, bh = 10 + rnd() * 22 | 0, top = 182 - bh;
    x.fillStyle = '#a8dcc4'; x.fillRect(bx, top - 1, bw, bh + 1);

    bx += bw - 1;

  bushes.forEach(([cx, cy, r]) => disc(cx, cy, r + 1, '#4cb85a'));
  bushes.forEach(([cx, cy, r]) => disc(cx, cy, r, '#64e070'));

// ------------------------------------------------------------ difficulty

function difficulty(k) {

    gap: Math.max(112, 140 - Math.max(0, e - 6) * 0.9),
    spacing: Math.max(165, 190 - Math.max(0, e - 20)),
    vary: Math.min(150, 110 + Math.max(0, e - 10) * 2),

}

function pipeShape(p) {
  let h = p.gap / 2, c = p.top + h;
  if (p.kind === 'move') c += p.amp * Math.sin(p.phase + p.t * p.freq);
  if (p.kind === 'chomp') h -= p.amp * (0.5 + 0.5 * Math.sin(p.phase + p.t * p.freq));
  c = clamp(c, 50 + h, GY - 50 - h);

  while (!bossPending && (!last || last.x < LW + 20)) {
    if (spawned >= nextBossAt) { bossPending = true; break; }
    const k = spawned++, d = difficulty(k);
    const x = last ? last.x + d.spacing : BIRD_X + 260;
    let top = 60 + Math.random() * (GY - d.gap - 120);
    if (last) top = clamp(top, last.top - d.vary, last.top + d.vary);
    let r = Math.random(), kind = r < d.chomp ? 'chomp' : r < d.chomp + d.move ? 'move' : 'static';
    if (d.e >= 10 && !shownMove) { kind = 'move'; shownMove = true; setBanner('MOVING PIPES!', 'STAY SHARP'); sfx('swoosh'); }
    else if (d.e >= 25 && !shownChomp) { kind = 'chomp'; shownChomp = true; setBanner('CHOMPERS!', 'MIND THE TEETH'); sfx('swoosh'); }
    const prev = last;
    last = { x, top, gap: d.gap, kind, t: 0, passed: false, intro: x < LW ? -6 * n++ : INTRO,
      amp: kind === 'move' ? d.moveAmp : kind === 'chomp' ? d.chompAmp : 0,
      freq: kind === 'move' ? rand(0.022, 0.04) : rand(0.045, 0.065), phase: rand(0, 6.28) };

  save(); s.spins++;

  s.suspense = s.out[0] === 'heart' && s.out[1] === 'heart';

// Only pink shots can be parried; the rest use the boss's own colour and must be dodged.
function fire(o = {}) {
  const b = boss, m = o.from || bossMouth(), pink = !!o.pink, d = Math.hypot(BIRD_X - m.x, bird.y - m.y);
  const sp = o.sp || Math.max(3.2 + b.lv * 0.35, d / 115), a = (o.a ?? aimAt(m)) + (o.off || 0);
  shots.push({ x: m.x, y: m.y, vx: o.vx ?? Math.cos(a) * sp, vy: o.vy ?? Math.sin(a) * sp, r: o.r || (pink ? 8 : 6),
    pink, col: pink ? 'pink' : b.def.shot, refl: false, wob: o.wob || 0, g: o.g || 0, t: 0 });
  if (o.quiet) return;
  const c = SHOT_COLS[pink ? 'pink' : b.def.shot];
  burst(m.x, m.y, pink ? 8 : 4, [c[1], c[2], '#fff'], 2.5, 14);
  sfx(pink ? 'shoot' : 'pew');
}

// lobbed shot that arcs up and drops through (BIRD_X, bird.y + dy)
function lob(dy, pink) {
  const m = bossMouth(), dx = BIRD_X - m.x, T = clamp(-dx / 3, 45, 90), g = 0.14;
  const ty = clamp(bird.y + dy, 20, GY - 10);
  fire({ pink, quiet: true, vx: dx / T, vy: (ty - m.y - 0.5 * g * T * T) / T, g });
}

// An attack is a list of steps: { t: frames to wait before it, f: what to fire }.
function attack(kind) {
  const b = boss, T = b.tier, pel = 3.4 + T * 0.4 + b.lv * 0.1, st = [];
  const at = (t, f) => st.push({ t, f });
  const gapAng = () => { const m = bossMouth(); return 54 / Math.max(120, Math.hypot(BIRD_X - m.x, bird.y - m.y)); };
  const fan = (offs, pinkMid) => { const s = gapAng(); for (const c of offs) fire({ off: c * s, sp: pel + 0.4, pink: pinkMid && c === 0, quiet: c !== offs[0] }); };
  switch (kind) {
    // tutorial moves (all pink)
    case 'single': at(0, () => fire({ pink: true })); break;
    case 'wave': at(0, () => fire({ pink: true, wob: 42 })); break;
    case 'burst': for (let i = 0; i < 3; i++) at(i ? 18 : 0, () => fire({ pink: true })); break;
    // long stream of small aimed pellets, then one pink shot
    case 'gatling':
      for (let i = 0; i < 7 + T * 3; i++) at(i ? 5 : 0, () => fire({ sp: pel + 0.6, r: 5, off: rand(-0.07, 0.07) }));
      at(24, () => fire({ pink: true }));
      break;
    // pink shot, short pellet burst, pink shot, short pellet burst
    case 'chain':
      for (let k = 0; k < 2; k++) {
        at(k ? 18 : 0, () => fire({ pink: true }));
        for (let i = 0; i < 3 + T; i++) at(i ? 5 : 16, () => fire({ sp: pel + 0.8, r: 5 }));
      }
      break;
    // fast pellets either side of a pink shot, then a scattered pellet burst
    case 'zap':
      at(0, () => { fan([-1, 1], false); fire({ pink: true }); });
      for (let i = 0; i < 4 + T * 2; i++) at(i ? 6 : 22, () => fire({ sp: pel + 1, r: 5, off: rand(-0.12, 0.12) }));
      break;
    // fan with the pink shot in the middle
    case 'fan': at(0, () => fan(T ? [0, -1, 1, -2, 2, -3, 3] : [0, -1, 1, -2, 2], true)); break;
    // even fan the bird sits between, then a full fan
    case 'fan2':
      at(0, () => fan(T ? [-0.5, 0.5, -1.5, 1.5, -2.5, 2.5] : [-0.5, 0.5, -1.5, 1.5], false));
      at(30, () => fan([0, -1, 1, -2, 2], true));
      break;
    // slow ring with the shot aimed at the bird pink, then a re-aimed hostile ring
    case 'ring': {
      const n = 14 + T * 4;
      for (let k = 0; k < 2; k++) at(k ? 34 : 0, () => {
        const a0 = aimAt(bossMouth());
        for (let i = 0; i < n; i++) fire({ a: a0 + i * Math.PI * 2 / n, sp: 2.4 + T * 0.3, pink: !k && !i, quiet: i > 0 });
      });
      break;
    }
    // a column of shots crossing the screen with one gap near the bird, then a pink shot through the gap
    case 'wall':
      at(0, () => {
        const gap = Math.max(72, 100 - T * 8), gy = clamp(bird.y + rand(-90, 90), 70, GY - 70);
        for (let y = 14; y < GY - 4; y += 24) if (Math.abs(y - gy) > gap / 2) fire({ from: { x: boss.x - 10, y }, vx: -(2.4 + T * 0.3), vy: 0, quiet: true });
        sfx('pew'); shake = Math.max(shake, 3);
      });
      at(34, () => fire({ pink: true }));
      break;
    // lobbed shots raining down around the bird, then a lobbed pink one right at it
    case 'rain':
      at(0, () => { for (const o of [-90, -40, 40, 90]) lob(o + rand(-12, 12), false); sfx('pew'); });
      if (T) at(22, () => { for (const o of [-60, 0, 60]) lob(o, false); sfx('pew'); });
      at(28, () => { lob(0, true); sfx('shoot'); });
      break;
  }
  return st;
}

function updateBoss() {
  const b = boss; b.t++;
  b.flash = Math.max(0, b.flash - 1);
  b.hpLag += (b.hp - b.hpLag) * 0.05;
  const tx = LW - (wide ? 120 : 14 + 12 * b.def.S);
  if (b.phase === 'warn') {
    if (b.t > 50) b.x += (tx - b.x) * 0.05;
    b.y = 190 + Math.sin(b.t * 0.05) * 20;
    if (b.t >= 140) { b.phase = 'fight'; b.cd = 50; b.t = 0; }
  } else if (b.phase === 'fight') {
    b.x += (tx - b.x) * 0.08;
    b.y = 195 + Math.sin(b.t * 0.022) * (70 + Math.min(b.lv, 3) * 8) + Math.sin(b.t * 0.09) * 8;
    if (state !== 'play') return;
    const hpRatio = b.hp / b.maxHp;
    if (b.charge > 0) {
      if (--b.charge === 0) { b.steps = attack(b.pending); b.wait = b.steps[0].t; }
    } else if (b.steps.length) {
      if (--b.wait <= 0) {
        do b.steps.shift().f(); while (b.steps.length && b.steps[0].t === 0);
        if (b.steps.length) b.wait = b.steps[0].t;
        else b.cd = b.lv ? Math.max(36, 84 - b.tier * 12 - (1 - hpRatio) * 26) : 100 - (1 - hpRatio) * 30;
      }
    } else if (--b.cd <= 0) {
      let pool = b.def.moves;
      if (!pool) { pool = ['single', 'single', 'wave']; if (hpRatio <= 0.5) pool.push('burst'); }
      let m = pool[Math.random() * pool.length | 0];
      if (m === b.last && b.def.moves) m = pool[Math.random() * pool.length | 0];
      b.pending = b.last = m;
      b.chargeLen = b.charge = Math.max(18, 30 - b.lv * 3);
      sfx('charge');
    }
  } else if (b.phase === 'dying') {
    b.vy += 0.04; b.y += b.vy; b.rot += 0.012; b.x += 0.3;
    if (b.t % 7 === 0) {
      const ex = b.x + rand(-40, 40), ey = b.y + rand(-30, 30);
      booms.push({ x: ex, y: ey, t: 0, life: 20, r: rand(14, 24) });
      burst(ex, ey, 10, ['#fff', '#ffe14d', '#ff8030', b.def.pal.b], 3.5, 24, 4);
      sfx('explode', false); shake = Math.max(shake, 5);
    }
    if (b.t > 105) {
      booms.push({ x: b.x, y: b.y, t: 0, life: 30, r: 60 });
      burst(b.x, b.y, 48, ['#fff', '#ffe14d', '#ff8030', b.def.pal.B, b.def.pal.b], 6, 40, 4);
      rings.push({ x: b.x, y: b.y, r: 10, dr: 7, life: 24, col: '#fff' });
      sfx('explode', true); flash = 1; shake = 16;
      score += 10; popup('+10', b.x, b.y - 30, { sc: 4, fill: '#fff', ol: '#543847', life: 70, vy: -0.6 });
      setBanner('BOSS DEFEATED!', 'BONUS +10', 'victory', 130);
      setTimeout(() => sfx('victory'), 250);
      bossesBeaten++; nextBossAt = spawned + BOSS_EVERY; boss = null;
    }
  }
}

function parry(s, d) {
  const perfect = d < 34;
  s.refl = true; s.r = 9; combo++; parries++;
  const bx = boss ? boss.x : LW + 50, by = boss ? boss.y : s.y;
  const a = Math.atan2(by - s.y, bx - s.x); s.vx = Math.cos(a) * 9; s.vy = Math.sin(a) * 9;
  hitstop = perfect ? 8 : 5; shake = Math.max(shake, perfect ? 9 : 6);
  burst(s.x, s.y, perfect ? 22 : 14, ['#fff', '#ffe14d', '#fff8c0'], perfect ? 5 : 4, 20);
  rings.push({ x: s.x, y: s.y, r: 6, dr: 4, life: 14, col: perfect ? '#fff' : '#ffe14d' });
  const label = (perfect ? 'PERFECT!' : 'PARRY!') + (combo > 1 ? ' X' + combo : '');
  popup(label, BIRD_X + 10, bird.y - 34, { sc: perfect ? 3 : 2, fill: perfect ? '#fff' : '#ffe14d', ol: perfect ? '#e04010' : '#543847', life: 42 });
  sfx('parry', combo);
}

function hitBoss(s) {
  const b = boss;
  b.hp--; b.flash = 14; b.x += 28; hitstop = 9; shake = Math.max(shake, 12);
  burst(s.x, s.y, 26, ['#fff', '#ffe14d', '#ff8030', b.def.pal.B], 5.5, 26, 4);
  rings.push({ x: s.x, y: s.y, r: 8, dr: 5, life: 16, col: '#ffe14d' });
  score++;
  const words = ['CRUNCH!', 'BONK!', 'POW!', 'KRAK!'];
  popup(b.hp > 0 ? words[Math.random() * words.length | 0] : 'K.O.!', b.x, b.y - 52, { sc: b.hp > 0 ? 3 : 5, fill: '#fff', ol: '#c2310c', life: 50 });
  sfx('bossHit');
  if (b.hp <= 0) {
    b.phase = 'dying'; b.t = 0; b.vy = -2.2; slowmo = 54; hitstop = 14; flash = 0.7;
    for (const o of shots) if (!o.refl) { o.dead = true; burst(o.x, o.y, 8, ['#ffb040', '#ff4020'], 2.5, 16); }
  }
}

function hurtBird() {
  if (bird.inv > 0) return;
  hearts--; combo = 0; bird.inv = 90; shake = Math.max(shake, 9); hurtFlash = 0.55;
  burst(BIRD_X, bird.y, 14, ['#f83850', '#fff', '#f8d81c'], 3.5, 20);
  if (hearts <= 0) crash(false); else sfx('hurt');
}

function updateShots() {
  for (const s of shots) {
    s.t++;
    if (!s.refl) {
      const d = Math.hypot(s.x - BIRD_X, s.y - bird.y);
      s.inRange = s.pink && d < PARRY_R && s.x > BIRD_X - 12;
      const k = s.inRange ? 0.42 : 1;           // bullet-time while it's parryable
      s.vy += s.g * k;
      s.x += s.vx * k; s.y += (s.vy + (s.wob ? Math.cos(s.t * 0.12) * s.wob * 0.12 : 0)) * k;
      if (state === 'play' && d < BIRD_R + s.r - 3) { s.dead = true; hurtBird(); }
    } else {
      if (boss && boss.phase === 'fight') {
        const dx = boss.x - s.x, dy = boss.y - s.y, d = Math.hypot(dx, dy) || 1;
        s.vx += (dx / d * 11 - s.vx) * 0.25; s.vy += (dy / d * 11 - s.vy) * 0.25;
        if (d < 10.5 * boss.def.S) { s.dead = true; hitBoss(s); }
      }
      s.x += s.vx; s.y += s.vy;
    }
    const big = s.pink || s.refl;
    if ((s.t & (big ? 1 : 3)) === 0) sparks.push({ x: s.x, y: s.y, vx: -s.vx * 0.15 + rand(-.4, .4), vy: rand(-.4, .4), life: 12, col: s.refl ? '#ffe14d' : SHOT_COLS[s.col][1], sz: big ? 4 : 2 });
    if (s.y > GY - s.r) { s.dead = true; burst(s.x, GY - 4, 10, ['#ff8030', '#ded895', '#fff'], 3, 18); }
    if (s.x < -40 || s.x > LW + 80 || s.y < (s.g ? -400 : -80)) s.dead = true;
  }
  shots = shots.filter(s => !s.dead);
}

function updateFX() {
  for (const p of popups) { p.y += p.vy; p.life--; }
  popups = popups.filter(p => p.life > 0);
  for (const f of feathers) { f.x += f.vx; f.y += f.vy; f.vy += 0.05; f.life--; }
  feathers = feathers.filter(f => f.life > 0);
  for (const p of sparks) { p.x += p.vx; p.y += p.vy; p.vx *= 0.93; p.vy = p.vy * 0.93 + 0.06; p.life--; }
  sparks = sparks.filter(p => p.life > 0);
  for (const r of rings) { r.r += r.dr; r.life--; }
  rings = rings.filter(r => r.life > 0);
  for (const b of booms) b.t++;
  booms = booms.filter(b => b.t < b.life);
  if (banner && ++banner.t >= banner.life) banner = null;
  flash = Math.max(0, flash - 0.08); hurtFlash = Math.max(0, hurtFlash - 0.04); fade = Math.max(0, fade - 0.07);
  shake = shake > 0.3 ? shake * 0.82 : 0;
}

function update() {
  tick++;
  if (hitstop > 0) { hitstop--; updateFX(); return; }                       // impact freeze
  if (slowmo > 0) { slowmo--; if (slowmo % 3) { updateFX(); return; } }      // final-blow slow motion
  const sp = speed();
  if (state === 'ready' || state === 'play') { groundX = (groundX + sp) % 24; bgX = (bgX + sp * 0.15) % 288; }

  if (state === 'ready') {
    bird.y = 240 + Math.sin(tick * 0.12) * 4; bird.rot = 0;
  } else if (state === 'play' || state === 'dying') {
    bird.vy = Math.min(MAXV, bird.vy + GRAV); bird.y += bird.vy;
    bird.rot = bird.vy < 2 ? Math.max(-0.4, bird.rot - 0.2) : Math.min(Math.PI / 2, bird.rot + 0.07);
    if (bird.inv > 0) bird.inv--;
    if (bird.y < -BIRD_R && state === 'play') crash(false);                  // flew off the top of the screen
    if (bird.y < -20) { bird.y = -20; bird.vy = 0; }
    if (bird.y + 12 >= GY) { bird.y = GY - 12; if (state === 'play') crash(true); else downed(); }
  }
  if (tick === dieSoundAt) sfx('die');

  if (state === 'play') {
    if (!boss) {
      spawnPipes();
      if (bossPending && !pipes.some(p => p.x > BIRD_X - 70)) startBoss();
    }
    for (const p of pipes) {
      p.x -= sp; p.intro++; p.t++; pipeShape(p);
      if (p.intro < INTRO) continue;
      if (!p.passed && p.x + 24 < BIRD_X) { p.passed = true; score++; passedPipes++; sfx('point'); }
      if (circRect(BIRD_X, bird.y, BIRD_R, p.x - 2, -200, 52, p.y0 + 200) ||
          circRect(BIRD_X, bird.y, BIRD_R, p.x - 2, p.y1, 52, GY)) { crash(false); break; }
    }
    pipes = pipes.filter(p => p.x > -60);
  }
  updateCoins(sp);
  if (state === 'slot') updateSlot();
  if (state === 'revive') updateRevive();
  if (halo > 0 && state === 'play') halo--;
  if (boss) updateBoss();
  updateShots();

  if (state === 'over') {
    overT++;
    if (overT === 18) sfx('swoosh');
    if (overT === 48 && newBest) sfx('fanfare');
  }
  updateFX();
}

// ============================================================ accelerometer input
// The native app calls onAccel(g) ~100x/s with the peak gravity-removed acceleration (in g).
let level = 0, baseline = 0.01, lastSlap = 0, lastAccel = -1e9;
const threshold = () => 0.8 * Math.pow(0.04, sensLevel / 10);   // level 1..10 -> ~0.58g .. 0.032g
window.onAccel = gv => {
  const now = performance.now(); lastAccel = now;
  level = Math.max(level, gv);
  if (gv > threshold() && gv > baseline * 3 && now - lastSlap > 250) { lastSlap = now; flap('slap'); }
  baseline = baseline * 0.98 + Math.min(gv, 0.2) * 0.02;
};
const sensorLive = () => performance.now() - lastAccel < 1000;

// ============================================================ rendering
function drawPanel(x, y, w, h) {
  g.fillStyle = '#543847'; g.fillRect(x - 4, y - 4, w + 8, h + 8);
  g.fillStyle = '#fff8d8'; g.fillRect(x - 2, y - 2, w + 4, h + 4);
  g.fillStyle = '#ded895'; g.fillRect(x, y, w, h);
  g.fillStyle = '#c9b968'; g.fillRect(x, y + h - 2, w, 2); g.fillRect(x + w - 2, y, 2, h);
}

function drawMedal(cx, cy) {
  const m = score >= 40 ? ['#d8e4ee', '#ffffff', '#9fb4c8'] : score >= 30 ? ['#e0a818', '#fde68a', '#a8740c']
          : score >= 20 ? ['#a8a8b8', '#ececf4', '#787888'] : score >= 10 ? ['#c07030', '#eaa868', '#8a4818'] : null;
  pcircle(cx, cy, 24, '#543847');
  if (!m) { pcircle(cx, cy, 22, '#e8e2b0'); pcircle(cx, cy, 18, '#d6cf94'); return; }
  pcircle(cx, cy, 22, m[2]); pcircle(cx, cy, 20, m[0]); pcircle(cx, cy, 14, m[1]); pcircle(cx + 2, cy + 2, 10, m[0]);
  g.drawImage(birdFrames[1], cx - 9, cy - 6, 18, 12);
  const sp = [[-14, -14], [12, -12], [14, 10], [-12, 12]][(tick / 10 | 0) % 4], tw = (tick % 10) < 5 ? 2 : 4;
  g.fillStyle = '#fff'; g.fillRect(cx + sp[0] - tw, cy + sp[1], tw * 2 + 2, 2); g.fillRect(cx + sp[0], cy + sp[1] - tw, 2, tw * 2 + 2);
}

function meterBar(mx, my, mw) {
  const sc = v => Math.min(mw, Math.round(Math.sqrt(v / 0.8) * mw / 2) * 2);
  g.fillStyle = '#543847'; g.fillRect(mx - 2, my - 2, mw + 4, 12);
  g.fillStyle = '#2c2030'; g.fillRect(mx, my, mw, 8);
  g.fillStyle = level > threshold() ? '#f85a1c' : '#9ce659'; g.fillRect(mx, my, sc(level), 8);
  g.fillStyle = '#fff'; g.fillRect(mx + sc(threshold()) - 1, my - 2, 2, 12);
}

function drawMeter(y) {   // compact (portrait) layout
  if (!sensorLive()) { text('NO SENSOR: USE SPACE', LW / 2, y + 2, 2, '#fff', '#543847'); return; }
  text('SENSITIVITY < ' + sensLevel + ' >', LW / 2, y, 2, '#fff', '#543847');
  meterBar(LW / 2 - 80, y + 22, 160);
}

const tw = (s, sc = 2) => s.length * 6 * sc - sc;           // text width
function chip(x, y, w, h) {
  g.fillStyle = '#543847'; g.fillRect(x, y, w, h);
  g.fillStyle = '#fff8d8'; g.fillRect(x + 2, y + 2, w - 4, h - 4);
  g.fillStyle = '#3e2a36'; g.fillRect(x + 4, y + 4, w - 8, h - 8);
}
function keycap(x, y, label) {
  const w = Math.max(18, tw(label) + 8);
  g.fillStyle = '#543847'; g.fillRect(x, y, w, 22);
  g.fillStyle = '#c9b968'; g.fillRect(x + 2, y + 2, w - 4, 18);
  g.fillStyle = '#fff8d8'; g.fillRect(x + 2, y + 2, w - 4, 15);
  text(label, x + w / 2, y + 3, 2, '#543847', '#000', 0);
  return w;
}
const keycapW = label => Math.max(18, tw(label) + 8);
function hintsWidth(h) { return h.reduce((a, [k, l]) => a + keycapW(k) + 6 + tw(l) + 18, -18); }
function drawHints(x, y, h) {
  for (const [k, l, act] of h) {
    const x0 = x; x += keycap(x, y, k) + 6; text(l, x, y + 4, 2, '#543847', '#000', 0, 'l'); x += tw(l) + 18;
    if (act) buttons.push({ x: x0 - 6, y: y - 6, w: x - x0 - 6, h: 34, act });
  }
}

// Wide layout: chips in the top corners, a control strip on the ground.
function wideTopBar() {
  if (TOUCH) { if (state === 'play') pauseButton(28, 22); else { const b = 'BEST ' + best, bw = tw(b) + 24; chip(28, 22, bw, 30); text(b, 28 + bw / 2, 30, 2, '#ffd23f', '#000', 0); } return; }
  const b = 'BEST ' + best, bw = tw(b) + 24;
  chip(28, 22, bw, 30); text(b, 28 + bw / 2, 30, 2, '#ffd23f', '#000', 0);
  const live = sensorLive(), s = live ? 'SENSOR' : 'NO SENSOR', sw = tw(s) + 40, sx = LW - 28 - sw;
  chip(sx, 22, sw, 30);
  g.fillStyle = !live ? '#f8a030' : level > threshold() ? '#f85a1c' : '#7fe05a';
  g.fillRect(sx + 12, 32, 10, 10);
  text(s, sx + 30, 30, 2, '#fff', '#000', 0, 'l');
}
function wideControls() {
  if (TOUCH) return settingsButton(436);
  const y = 438;
  const left = sensorLive() ? 'SENSITIVITY ' + sensLevel : 'NO SENSOR: SPACE OR CLICK TO FLAP';
  const leftW = sensorLive() ? 18 + 4 + 18 + 10 + tw(left) + 14 + 120 : tw(left);
  const right = [['S', 'SETTINGS', openSettings], ['P', 'PAUSE'], fullscreen ? ['ESC', 'EXIT'] : ['F', 'FULLSCREEN']];
  const rightW = hintsWidth(right), margin = 40, stacked = leftW + rightW + margin * 2 + 40 > LW;
  let lx = stacked ? (LW - leftW) / 2 : margin;
  if (sensorLive()) {
    lx += keycap(lx, y, '←') + 4; lx += keycap(lx, y, '→') + 10;
    text(left, lx, y + 4, 2, '#543847', '#000', 0, 'l'); lx += tw(left) + 14;
    meterBar(lx, y + 7, 120);
  } else text(left, lx, y + 4, 2, '#543847', '#000', 0, 'l');
  drawHints(stacked ? (LW - rightW) / 2 : LW - margin - rightW, stacked ? y + 34 : y, right);
}

// Touch buttons are drawn into the game canvas; taps are hit-tested against the rects collected each frame.
let buttons = [];
// Orange button with a white rim (greyed out when off).
function button(x, y, w, h, label, act, on = true) {
  const R = (rx, ry, rw, rh, c) => { g.fillStyle = c; g.fillRect(rx, ry, rw, rh); };
  R(x, y, w, h, '#543847'); R(x + 2, y + 2, w - 4, h - 4, '#fff');
  R(x + 4, y + 4, w - 8, h - 8, on ? '#e86a17' : '#b4a88c');
  R(x + 4, y + 4, w - 8, 2, on ? '#f8a050' : '#cdc3aa');            // top highlight
  R(x + 4, y + h - 8, w - 8, 4, on ? '#c24e0a' : '#968a70');        // bottom shade
  if (label) {
    const ly = Math.round(y + (h - 14) / 2) - 1;
    text(label, x + w / 2, ly + 2, 2, on ? '#8a3006' : '#706650', '#000', 0);
    text(label, x + w / 2, ly, 2, on ? '#fff' : '#ece4d0', '#000', 0);
  }

  const mx = Math.round((LW - MW) / 4) * 2, my = hy0 + 34 + gap;
  const R = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(mx + x, my + y, w, h); };

  });
  g.drawImage(SYM.heart, mx + 16, my + 17, 12, 12); g.drawImage(SYM.heart, mx + MW - 28, my + 17, 12, 12);
  text('LUCKY SLOTS', mx + MW / 2, my + 15, 2, party && (tick >> 2) & 1 ? '#fff' : '#ffe14d', '#c2310c', 2);

    }
    [0.5, 0.32, 0.18, 0.08].forEach((a, k) => {   // curved-drum shading
      g.fillStyle = `rgba(40,10,20,${a})`; g.fillRect(mx + rx, my + RY + k * 6, 54, 6); g.fillRect(mx + rx, my + RY + RH - 6 - k * 6, 54, 6);
    });
    R(rx + 6, RY + 10, 2, 30, 'rgba(255,255,255,0.45)');
    if (s.suspense && i === 2 && !r.done && s.reels[1].done && (tick >> 2) & 1) { g.fillStyle = 'rgba(248,56,80,0.25)'; g.fillRect(mx + rx, my + RY, 54, RH); }
    g.restore();
  });
  for (const [dy, w] of [[-4, 2], [-2, 4], [0, 4], [2, 2]]) { R(12, cy + dy, w + 2, 2, '#f83850'); R(MW - 14 - w, cy + dy, w + 2, 2, '#f83850'); }
  if (s.res && (tick >> 3) & 1) R(18, cy - 1, MW - 36, 2, 'rgba(248,56,80,0.7)');

  // pay table: all four prizes at once, the one just won blinks
  const pw = Math.min(LW - 24, 256), px = Math.round((LW - pw) / 2), py = my + 196 + gap;
  drawPanel(px, py, pw, 50);
  const rows = [['heart', 'REVIVE', null], ['seven', '+3', tokenSmall], ['bell', '+100', coinSmall], ['coin', '+50', coinSmall]];
  rows.forEach(([sym, label, icon], i) => {
    const cx0 = px + 8 + (i % 2) * Math.round(pw / 2), cy0 = py + 6 + (i >> 1) * 22;
    const hit = s.res && s.out && s.out.every(o => o === sym);
    if (hit && (tick >> 3) & 1) { g.fillStyle = '#fff8d8'; g.fillRect(cx0 - 4, cy0 - 2, Math.round(pw / 2) - 12, 20); }
    for (let k = 0; k < 3; k++) g.drawImage(SYM[sym], cx0 + k * 12, cy0, 13, 13);
    text(label, cx0 + 42, cy0 + 1, 2, sym === 'heart' ? '#c2310c' : '#543847', '#000', 0, 'l');
    if (icon) g.drawImage(icon, cx0 + 42 + tw(label) + 3, cy0, 13, 13);
  });

  // credits
  const crY = py + 50 + gap, crS = String(Math.min(tokens, 99)), coS = String(Math.min(bank, 9999));
  const crW = 20 + tw(crS) + 20 + 20 + tw(coS), crX = Math.round((LW - crW) / 2);
  chip(crX - 12, crY - 8, crW + 24, 30);
  counter(tokenSmall, crS, tokenBump, crX, crY, 'l', true);
  counter(coinSmall, coS, coinBump, crX + 20 + tw(crS) + 20, crY, 'l', true);

  // big SPIN button: the close-up of the cabinet's button, and the thing to tap
  const bw = 156, bh = 48, bx = Math.round((LW - bw) / 2), by = crY + 22 + gap, can = canSpin() && idle;
  const pressed = s.phase === 'spin' || (s.pull >= 0 && s.pull < 10);
  if (!party) {
    const dy = pressed ? 4 : 0, BR = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(bx + x, by + y, w, h); };
    const rrB = (x, y, w, h, c, cut) => { BR(x + cut, y, w - cut * 2, h, c); BR(x, y + cut, w, h - cut * 2, c); BR(x + cut / 2, y + cut / 2, w - cut, h - cut, c); };
    rrB(0, 0, bw, bh + 6, '#543847', 10);                                   // bezel
    rrB(2, 2, bw - 4, bh + 2, '#d8dce8', 9); rrB(4, 4 + bh - 4, bw - 8, 6, '#8890a8', 4);
    rrB(6, 6 + dy, bw - 12, bh - 8 - dy, '#2a1018', 8);                     // button cap
    const face = can || pressed ? '#f83850' : '#a89098', shade = can || pressed ? '#b01830' : '#806870';
    rrB(8, 8 + dy, bw - 16, bh - 12 - dy, shade, 7);
    rrB(8, 8 + dy, bw - 16, bh - 18 - dy, face, 7);
    BR(18, 12 + dy, bw - 36, 4, can || pressed ? '#ff9aa8' : '#c8b8c0');   // shine
    const label = !idle && !pressed ? '' : can || pressed ? 'SPIN' : 'NO TOKENS';
    text(label, bx + bw / 2, by + 13 + dy, label === 'SPIN' ? 3 : 2, '#fff', '#7a0c20', 2);
    if (can) buttons.push({ x: bx - 6, y: by - 6, w: bw + 12, h: bh + 18, act: () => { if (slot.t > 30) spin(); } });
    if (can && s.t > 30) {                                                  // pointing hand taps the button
      const tap = (tick / 20 | 0) % 2 === 0, hx = bx + bw - 4, hy = by + bh - 14 + (tap ? 0 : 5);
      if (tap) { g.fillStyle = '#fff'; g.fillRect(hx - 6, hy - 6, 2, 6); g.fillRect(hx + 4, hy - 10, 2, 6); g.fillRect(hx + 14, hy - 6, 2, 6); }
      g.drawImage(HAND, hx - 4, hy, 24, 24);
    }
  }

  // status line + give up
  const ty = by + bh + 8 + gap / 2;
  if (s.phase === 'idle') text(tokens > 0 ? 'COSTS 1 TOKEN' : 'COSTS 50 COINS', LW / 2, ty, 2, '#c8bcd0', '#000', 0);
  else if (s.phase === 'result') bigText(s.msg, LW / 2, ty - 6, 3, s.res === 'win' ? '#ffe14d' : '#fca048', s.res === 'win' ? '#f0a020' : '#e06010');
  else if (party) {
    const cols = ['#ffe14d', '#fff', '#ff8a9a'];
    bigText(s.msg, LW / 2, by - 4, 5, cols[(tick >> 2) % 3], '#f0a020');
  }
  if (idle && s.t > 30)
    button(Math.round((LW - 140) / 2), ty + 26 + gap, 140, 30, TOUCH ? 'GIVE UP' : 'X: GIVE UP', giveUp, false);
}

function drawBoss() {
  const b = boss, f = bossFrames(b.def);
  const open = b.charge > 0 || b.steps.length || b.phase === 'dying' ? 1 : 0, up = (b.t >> 3) & 1;
  const fr = f[open][up], S = b.def.S, w = 24 * S, h = 20 * S;
  g.save(); g.translate(Math.round(b.x / 2) * 2, Math.round(b.y / 2) * 2); g.rotate(b.rot);
  g.drawImage(b.flash > 0 && (b.flash >> 1) & 1 ? fr.white : fr.img, -w / 2, -h / 2, w, h);
  g.restore();
  if (b.charge > 0 && b.phase === 'fight') {      // charging glow at the beak
    const m = bossMouth(), k = 1 - b.charge / b.chargeLen, r = Math.round((4 + k * 10) / 2) * 2;
    pcircle(m.x | 0, m.y | 0, r + 4, (tick >> 1) & 1 ? '#ff3a1a' : '#ffb040');
    pcircle(m.x | 0, m.y | 0, r, '#fff');
    if ((tick & 3) === 0) sparks.push({ x: m.x + rand(-24, 24), y: m.y + rand(-24, 24), vx: 0, vy: 0, life: 8, col: '#ffb040', sz: 2 });
  }
}

function drawBossHUD() {
  if (boss && !(boss.phase === 'warn' && boss.t < 60)) {
    const w = wide ? 360 : 220, x = Math.round((LW - w) / 2), y = 440;   // on the ground strip
    const jx = boss.flash > 0 ? Math.round((Math.random() - .5) * 6) : 0;
    text(boss.name, LW / 2 + jx, y - 22, 2, '#fff', '#1a1020');
    g.fillStyle = '#1a1020'; g.fillRect(x - 4 + jx, y - 4, w + 8, 18);
    g.fillStyle = '#fff8d8'; g.fillRect(x - 2 + jx, y - 2, w + 4, 14);
    g.fillStyle = '#2c2030'; g.fillRect(x + jx, y, w, 10);
    g.fillStyle = '#fff'; g.fillRect(x + jx, y, Math.round(w * boss.hpLag / boss.maxHp), 10);
    const hw = Math.round(w * Math.max(0, boss.hp) / boss.maxHp);
    g.fillStyle = '#f83850'; g.fillRect(x + jx, y, hw, 10);
    g.fillStyle = '#ff9aa8'; g.fillRect(x + jx, y, hw, 2);
    g.fillStyle = '#1a1020'; for (let i = 1; i < boss.maxHp; i++) g.fillRect(x + jx + Math.round(w * i / boss.maxHp) - 1, y, 2, 10);

  if (boss || shots.length) {
    const hy = 462, total = 3 * 18 - 4;
    for (let i = 0; i < 3; i++) g.drawImage(i < hearts ? heartFull : heartEmpty, Math.round((LW - total) / 2) + i * 18, hy, 14, 14);
  }
}

function drawBanner() {
  const b = banner; if (!b) return;
  const k = Math.min(1, b.t / 8, (b.life - b.t) / 10), cy = 200;
  const h = Math.round((b.kind === 'warning' ? 92 : 68) * k / 2) * 2;
  g.fillStyle = b.kind === 'warning' ? 'rgba(150,0,24,0.78)' : b.kind === 'victory' ? 'rgba(40,24,70,0.78)' : 'rgba(30,20,44,0.62)';
  g.fillRect(0, cy - h / 2, LW, h);
  if (b.kind === 'warning' && h > 20) {      // scrolling hazard stripes
    for (const ey of [cy - h / 2, cy + h / 2 - 8]) {
      g.fillStyle = '#1a1020'; g.fillRect(0, ey, LW, 8);
      g.fillStyle = '#ffd23f';
      for (let x = -24 + (b.t * 2) % 24; x < LW; x += 24) for (let r = 0; r < 4; r++) g.fillRect(x + r * 2, ey + r * 2, 10, 2);
    }
  }

  const big = b.kind === 'warning' ? (wide ? 6 : 5) : (wide ? 5 : 4);
  const sc = Math.min(big, Math.floor((LW - 24) / (b.text.length * 6)));
  if (b.kind !== 'warning' || (b.t >> 3) % 4 !== 3)
    text(b.text, LW / 2, cy - (b.sub ? 10 : 0) - sc * 3.5, sc, b.kind === 'warning' ? '#fff' : '#ffd23f', '#1a1020', 2);
  if (b.sub) text(b.sub, LW / 2, cy + sc * 3.5 - 4, 2, '#fff', '#1a1020');
  if (b.kind === 'warning' && bossesBeaten === 0 && b.t > 40) text(TOUCH ? 'TAP TO HIT THEM BACK!' : 'SLAP ITS FIREBALLS BACK!', LW / 2, cy + h / 2 + 10, 2, '#fff', '#c2310c');
  if (b.kind === 'warning' && bossesBeaten === 1 && b.t > 40) text('ONLY PINK ONES BOUNCE!', LW / 2, cy + h / 2 + 10, 2, '#fff', '#c0208a');
}

function draw() {
  buttons = [];
  g.save();
  if (shake) g.translate(Math.round((Math.random() - .5) * shake), Math.round((Math.random() - .5) * shake));

  // background (tiled, slow parallax)
  const bx = -Math.round(bgX / 2) * 2;
  for (let x = bx; x < LW; x += 288) g.drawImage(bg, x, 0, 288, 400);
  g.fillStyle = '#4ec0ca'; g.fillRect(-10, -TOP - 10, LW + 20, TOP + 10);

  for (const p of pipes) {
    const x = Math.round(p.x / 2) * 2;
    const t = Math.max(0, Math.min(1, p.intro / INTRO)), e = 1 - (1 - t) ** 3;   // ease-out grow-in
    if (t <= 0) continue;
    const up = Math.round((1 - e) * (p.y0 + 40) / 2) * 2, dn = Math.round((1 - e) * (GY - p.y1 + 40) / 2) * 2;
    const pal = PIPE_PALS[p.kind], teeth = p.kind === 'chomp';
    drawPipe(x, -10 - up, Math.round(p.y0 / 2) * 2 - up, true, pal, teeth);
    drawPipe(x, Math.round(p.y1 / 2) * 2 + dn, GY + dn, false, pal, teeth);
  }

  for (const c of coins) if (c.token) drawToken(c); else if (!c.pipe || c.pipe.intro >= INTRO) drawCoin(c);
  if (state === 'revive') drawBeam();
  if (boss) drawBoss();
  for (const s of shots) drawShot(s);

  // ground
  const gx = -Math.round(groundX / 2) * 2;
  for (let x = gx; x < LW; x += 312) g.drawImage(ground, x, GY, 312, 112);
  if (LH > 512) { g.fillStyle = '#ded895'; g.fillRect(-10, 512, LW + 20, LH - 502); }

  for (const p of sparks) { g.fillStyle = p.col; const z = p.sz * (p.life > 6 ? 1 : 0.5); g.fillRect(Math.round(p.x / 2) * 2, Math.round(p.y / 2) * 2, Math.max(2, z), Math.max(2, z)); }
  for (const b of booms) drawBoom(b);
  for (const r of rings) pring(r.x, r.y, r.r, r.col);
  if (shots.some(s => s.inRange && !s.refl) && state === 'play') {
    pring(BIRD_X, bird.y, 22 + Math.sin(tick * 0.6) * 3, (tick >> 2) & 1 ? '#ffe14d' : '#fff');
    if (bossesBeaten === 0 && parries < 3) text(ACT + ' NOW!', BIRD_X, bird.y - 44, 2, '#fff', '#c2310c');
  }

  // feathers + bird
  g.fillStyle = '#fdf6c4';
  for (const f of feathers) g.fillRect(Math.round(f.x / 2) * 2, Math.round(f.y / 2) * 2, 4, 2);
  const frame = state === 'over' || (state !== 'ready' && bird.rot > 1.2) ? 1 : [0, 1, 2, 1][(tick / 5 | 0) % 4];
  if (!(bird.inv > 0 && (tick >> 2) & 1)) {
    g.save(); g.translate(BIRD_X, Math.round(bird.y)); g.rotate(bird.rot);
    g.drawImage(birdFrames[frame], -18, -12, 36, 24);
    if (state === 'revive' && rev.t > 20) { g.globalAlpha = 0.3 + 0.25 * Math.sin(tick * 0.3); g.drawImage(birdWhite, -18, -12, 36, 24); g.globalAlpha = 1; }
    g.restore();
  }
  if ((state === 'revive' && rev.t > 30) || (halo > 0 && (halo > 40 || (tick >> 2) & 1))) drawHalo(BIRD_X, Math.round(bird.y) - 22);

  for (const p of popups) { g.globalAlpha = Math.min(1, p.life / 12); const hw = tw(p.s, p.sc) / 2 + 6; text(p.s, clamp(p.x, hw, LW - hw), p.y, p.sc, p.fill, p.ol); }
  g.globalAlpha = 1;

  // HUD
  if (wide) drawWideHUD(); else drawCompactHUD();
  if (state === 'play' || state === 'dying') drawBossHUD();
  if (state === 'slot' || (state === 'revive' && rev.t < 30)) drawSlot();
  drawBanner();
  if (notesPage >= 0 && state === 'ready') drawNotes();
  if (settingsOpen) drawSettings();
  if (paused && resumeT) {
    const n = Math.ceil(resumeT / COUNT_STEP), t = COUNT_STEP - 1 - (resumeT - 1) % COUNT_STEP;   // t: 0..44 within each number
    const big = wide ? 14 : 12, sc = t < 6 ? big + 6 - t : big;                                  // pops in, then settles
    g.fillStyle = `rgba(20,12,24,${0.15 + 0.1 * n})`; cover();
    g.globalAlpha = t > COUNT_STEP - 10 ? (COUNT_STEP - t) / 10 : 1;
    bigText(n, LW / 2, 200 - sc * 3.5, sc);
    g.globalAlpha = 1;
    bigText('GET READY!', LW / 2, 274, 3);
  } else if (paused) {
    g.fillStyle = 'rgba(20,12,24,0.45)'; cover();
    bigText('PAUSED', LW / 2, 190, wide ? 6 : 5);
    if ((performance.now() / 400 | 0) % 2 === 0) text(TOUCH ? 'TAP TO RESUME' : 'SLAP OR SPACE TO RESUME', LW / 2, 260, 2, '#fff', '#543847');
  }
  g.restore();

  if (flash) { g.fillStyle = `rgba(255,255,255,${flash})`; cover(); }
  if (hurtFlash) { g.fillStyle = `rgba(255,40,60,${hurtFlash * 0.5})`; cover(); }
  if (fade) { g.fillStyle = `rgba(0,0,0,${fade})`; cover(); }
}

// ============================================================ CRT post-processing (WebGL)
const screen = document.getElementById('screen');
const gl = screen.getContext('webgl', { antialias: false, alpha: false });
let uCrt, uSize, uCurv, uLp, uLc, uLn, uAmb;
const MAX_LIGHTS = 16;
if (gl) {
  const vs = `attribute vec2 p; varying vec2 uv; void main(){ uv = vec2(p.x*.5+.5, .5-p.y*.5); gl_Position = vec4(p,0.,1.); }`;
  const fs = `precision mediump float;
    uniform sampler2D t; uniform float crt; uniform vec2 lsize; uniform float curv; varying vec2 uv;
    uniform vec4 lp[${MAX_LIGHTS}]; uniform vec3 lc[${MAX_LIGHTS}]; uniform float ln; uniform float amb;
    vec2 curve(vec2 p){ p = p*2.-1.; vec2 o = abs(p.yx)/vec2(5.5,4.2); p += p*o*o*curv; return p*.5+.5; }
    vec3 s(vec2 q){ return texture2D(t,q).rgb; }
    // Dynamic point lights (lp: x, y, radius in logical px, intensity). Surfaces in range are
    // tinted and brightened by the light colour, and a soft additive halo blooms around the source.
    vec3 lit(vec2 q, vec3 c){
      vec2 P = q*lsize; vec3 tint = vec3(0.), glow = vec3(0.);
      for (int i=0;i<${MAX_LIGHTS};i++){
        if (float(i) >= ln) break;
        vec2 d = P - lp[i].xy; float f = max(0., 1. - length(d)/lp[i].z);
        float f2 = f*f;
        tint += lc[i]*f2*lp[i].w;
        glow += lc[i]*f2*f2*lp[i].w;
      }
      float luma = dot(c, vec3(.299,.587,.114));
      return c*amb + c*tint*1.25 + glow*(.5 + .25*luma);
    }
    void main(){
      if (crt < .5) { gl_FragColor = vec4(lit(uv, s(uv)),1.); return; }
      vec2 q = curve(uv);
      if (q.x<0.||q.x>1.||q.y<0.||q.y>1.) { gl_FragColor = vec4(0.,0.,0.,1.); return; }
      float ca = .0018;
      vec3 c = vec3(s(q+vec2(ca,0.)).r, s(q).g, s(q-vec2(ca,0.)).b);
      vec3 b = vec3(0.); vec2 px = 2.4/lsize;
      for (int i=-1;i<=1;i++) for (int j=-1;j<=1;j++) b += s(q+vec2(float(i),float(j))*px);
      c = c*.88 + (b/9.)*.32;
      c = lit(q, c);
      float sl = .5+.5*cos((q.y*lsize.y*.5-.5)*6.2831853);
      c *= mix(.68, 1.1, sl);
      float m = mod(gl_FragCoord.x, 3.);
      c *= m<1. ? vec3(1.,.82,.82) : m<2. ? vec3(.82,1.,.82) : vec3(.82,.82,1.);
      float v = 16.*q.x*q.y*(1.-q.x)*(1.-q.y);
      if (curv > 0.) {
        c *= pow(v, .25);
        vec2 e = min(q, 1.-q)*lsize;
        c *= smoothstep(0., 3., e.x) * smoothstep(0., 3., e.y);
      } else c *= pow(v, .08);   // flat glass (phones): light vignette, picture reaches the edges
      gl_FragColor = vec4(c*1.18, 1.);
    }`;
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) log('shader: ' + gl.getShaderInfoLog(s)); return s; };
  const prog = gl.createProgram();
  gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
  gl.linkProgram(prog); gl.useProgram(prog);
  gl.bindBuffer(gl.ARRAY_BUFFER, gl.createBuffer());
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.bindTexture(gl.TEXTURE_2D, gl.createTexture());
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  uCrt = gl.getUniformLocation(prog, 'crt');
  uSize = gl.getUniformLocation(prog, 'lsize'); uCurv = gl.getUniformLocation(prog, 'curv');
  uLp = gl.getUniformLocation(prog, 'lp'); uLc = gl.getUniformLocation(prog, 'lc');
  uLn = gl.getUniformLocation(prog, 'ln'); uAmb = gl.getUniformLocation(prog, 'amb');
}
const ctx2d = gl ? null : screen.getContext('2d');

// ============================================================ dynamic lighting
// Light sources are gathered from the game state every frame and handed to the shader.
const lightP = new Float32Array(MAX_LIGHTS * 4), lightC = new Float32Array(MAX_LIGHTS * 3);
const hexRGB = h => [parseInt(h.slice(1, 3), 16) / 255, parseInt(h.slice(3, 5), 16) / 255, parseInt(h.slice(5, 7), 16) / 255];
const LIGHT_COLS = {}; for (const k in SHOT_COLS) LIGHT_COLS[k] = hexRGB(SHOT_COLS[k][1]);
let lightN = 0, ambient = 1;
function addLight(x, y, r, k, rgb) {
  if (lightN >= MAX_LIGHTS || k <= 0.01) return;
  lightP.set([x, y + TOP, r, k], lightN * 4); lightC.set(rgb, lightN * 3); lightN++;
}
function gatherLights() {
  lightN = 0;
  const pulse = 0.85 + 0.15 * Math.sin(performance.now() / 90);
  for (const b of booms) if (b.t >= 0) {                                  // explosions flare hot, then fade
    const k = 1 - b.t / b.life;
    addLight(b.x, b.y, b.r * 3.2, 1.3 * k, k > 0.6 ? [1, 0.9, 0.7] : [1, 0.55, 0.2]);
  }
  if (boss && boss.charge > 0 && boss.phase === 'fight') {               // the boss winding up
    const m = bossMouth(), k = 1 - boss.charge / boss.chargeLen;
    addLight(m.x, m.y, 50 + 110 * k, (0.4 + 0.9 * k) * pulse, [1, 0.45, 0.15]);
  }
  if (state === 'revive' && rev) {                                       // heavenly beam
    const t = rev.t, k = t < 20 ? t / 20 : t > 96 ? Math.max(0, 1 - (t - 96) / 16) : 1;
    addLight(BIRD_X, bird.y, 170, 0.8 * k, [1, 0.92, 0.6]);
  }
  if (halo > 0) addLight(BIRD_X, bird.y - 22, 46, 0.35, [1, 0.88, 0.3]);
  for (const sh of shots) {                                              // glowing projectiles
    if (sh.refl) addLight(sh.x, sh.y, 80, 0.75 * pulse, [1, 0.88, 0.3]);
    else addLight(sh.x, sh.y, sh.pink ? 64 : 56, (sh.pink ? 0.6 : 0.5) * pulse, LIGHT_COLS[sh.col] || [1, 0.5, 0.2]);
  }
  for (const c of coins) {
    if (c.token) addLight(c.x, c.y, 58, 0.55 * pulse, [0.8, 0.4, 1]);
    else if (c.big && (!c.pipe || c.pipe.intro >= INTRO)) addLight(c.x, c.y, 40, 0.3 * pulse, [1, 0.85, 0.35]);
  }
  for (const r of rings) addLight(r.x, r.y, r.r + 30, 0.25, [1, 0.95, 0.75]);
  // during a boss fight the world dims a touch, so the fireworks read
  const target = boss && boss.phase !== 'warn' && (state === 'play' || state === 'dying') ? 0.86 : 1;
  ambient += (target - ambient) * 0.04;
}

function present() {
  if (gl) {
    gatherLights();
    gl.uniform4fv(uLp, lightP); gl.uniform3fv(uLc, lightC);
    gl.uniform1f(uLn, lightN); gl.uniform1f(uAmb, ambient);
    gl.viewport(0, 0, screen.width, screen.height);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, game);
    gl.uniform1f(uCrt, crtOn ? 1 : 0);
    gl.uniform2f(uSize, LW, LH + TOP); gl.uniform1f(uCurv, TOUCH ? 0 : wide ? 0.55 : 1);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  } else {
    ctx2d.imageSmoothingEnabled = false; ctx2d.drawImage(game, 0, 0, screen.width, screen.height);
  }
}

function layout() {
  if (TOUCH) {                             // fill the whole screen; the HUD stays below the status bar
    fitStandalone();
    const r = document.getElementById('monitor').getBoundingClientRect();
    const inset = parseFloat(getComputedStyle(document.getElementById('safe')).paddingTop) || 0;
    let w = Math.ceil(r.width), h = Math.ceil(r.height);
    const ph = Math.max(1, h - inset);     // play area height in CSS px
    let lw = LH_BASE * w / ph, lh = LH_BASE;
    if (lw < LW_MIN) { lw = LW_MIN; lh = Math.min(720, LW_MIN * ph / w); }
    if (lw > 1200) { lw = 1200; w = Math.floor(lw * ph / lh); }   // ultra-wide: pillarbox
    const top = inset * lw / w;
    lh = Math.max(lh, h * lw / w - top);   // taller than the cap: the ground just runs further down
    screen.style.width = w + 'px'; screen.style.height = h + 'px';
    const k = Math.min(devicePixelRatio, Math.sqrt(3.2e6 / (w * h)));
    screen.width = Math.round(w * k); screen.height = Math.round(h * k);
    resizeGame(lw, lh, top);
    return;
  }
  let w = innerWidth, h = innerHeight;
  if (!fullscreen) {                       // leave room for the monitor bezel
    w -= 44 + 24; h -= 68 + 24;
    if (w / h < LW_MIN / LH_BASE) h = w * LH_BASE / LW_MIN;
    if (w / h > 2.4) w = h * 2.4;
  }
  w = Math.floor(w); h = Math.floor(h);
  screen.style.width = w + 'px'; screen.style.height = h + 'px';
  const k = Math.min(devicePixelRatio, 2600 / w);   // cap backing size for the CRT pass
  screen.width = Math.round(w * k); screen.height = Math.round(h * k);
  resizeGame(LH_BASE * w / h);
}
const LW_MIN = 288, LH_BASE = 512;
// iOS Home Screen apps can report a viewport shorter than the physical screen, leaving a black
// "chin" at the bottom. When that happens, size the page to the real screen and let it overflow there.
const STANDALONE = navigator.standalone === true || matchMedia('(display-mode: standalone), (display-mode: fullscreen)').matches;
let fitKey = '';
function fitStandalone() {   // measured once per orientation: enlarging the page changes what the viewport reports
  if (!STANDALONE) return;
  const portrait = matchMedia('(orientation: portrait)').matches, key = portrait ? 'p' : 'l';
  if (key === fitKey) return;
  fitKey = key;
  const de = document.documentElement, mon = document.getElementById('monitor'), els = [de, document.body, mon];
  for (const el of els) el.style.height = el.style.overflow = '';
  mon.style.bottom = '';
  const sw = window.screen.width, sh = window.screen.height, full = portrait ? Math.max(sw, sh) : Math.min(sw, sh);
  if (full <= innerHeight + 1) return;
  for (const el of els) el.style.height = full + 'px';
  de.style.overflow = document.body.style.overflow = 'visible';
  mon.style.bottom = 'auto'; scrollTo(0, 0);
}
window.setFullscreen = on => { fullscreen = on; document.body.classList.toggle('fs', on); layout(); };
addEventListener('resize', layout); layout();
if (TOUCH) {   // iOS reports the final size late after launch / rotation
  addEventListener('orientationchange', () => setTimeout(layout, 300));
  if (window.visualViewport) visualViewport.addEventListener('resize', layout);
  addEventListener('pageshow', layout); setTimeout(layout, 300);
}

// ============================================================ input
addEventListener('keydown', e => {
  audioInit();
  const k = e.code;
  if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(k)) { e.preventDefault(); if (!e.repeat) flap('key'); }
  else if (k === 'ArrowLeft' || k === 'Minus' || k === 'BracketLeft') { e.preventDefault(); setSens(-1); }
  else if (k === 'ArrowRight' || k === 'Equal' || k === 'BracketRight') { e.preventDefault(); setSens(1); }
  else if (k === 'KeyM') toggleMute();
  else if (k === 'KeyC') toggleCrt();
  else if (k === 'KeyS') { if (settingsOpen) closeSettings(); else openSettings(); }
  else if (k === 'KeyF' && !e.metaKey) { native('fullscreen'); }
  else if (k === 'Escape') { if (settingsOpen) closeSettings(); else if (fullscreen) native('exitFullscreen'); else setPaused(true); }
  else if (k === 'KeyP') { setPaused(!paused || resumeT > 0); }
  else if (k === 'KeyX' && state === 'slot' && slot.phase !== 'spin' && slot.phase !== 'jackpot') giveUp();
  else if (k === 'KeyN' && state === 'ready' && !settingsOpen) { if (notesPage >= 0) nextNotesPage(); else { notesPage = 0; sfx('blip', true); } }
});
screen.addEventListener('pointerdown', e => {
  audioInit();
  const r = screen.getBoundingClientRect(), x = (e.clientX - r.left) / r.width * LW, y = (e.clientY - r.top) / r.height * (LH + TOP) - TOP;
  if (TOUCH && paused) return setPaused(false);
  const b = buttons.find(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h);
  if (b) return b.act();
  if (settingsOpen) { const q = settingsRect; if (!q || x < q.x || x >= q.x + q.w || y < q.y || y >= q.y + q.h) closeSettings(); return; }
  flap('click');
});
if (TOUCH) {
  // no scrolling, rubber-banding, double-tap zoom or pinch; unlock audio on the first touch
  for (const t of ['touchstart', 'touchmove', 'gesturestart', 'dblclick']) addEventListener(t, e => e.preventDefault(), { passive: false });
  addEventListener('touchend', () => audioInit());
  document.addEventListener('visibilitychange', () => { if (document.hidden) setPaused(true); else audioInit(); });
  // Check for a new version whenever the app comes back to the foreground; once it's installed,
  // reload at the next calm moment (title or game over screen) so a run is never interrupted.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    const hadSW = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg => {
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
      setInterval(() => reg.update().catch(() => {}), 5 * 60 * 1000);
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW) updateReady = true; });
  }
}
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', () => setPaused(true));

// ============================================================ main loop (fixed 60Hz simulation)
const STEP = 1000 / 60, led = document.getElementById('led');
let acc = 0, prev = performance.now();
let updateReady = false;
function loop(now) {
  if (updateReady && (state === 'ready' || (state === 'over' && overT > 50))) { updateReady = false; location.reload(); }
  acc = Math.min(acc + now - prev, 250); prev = now;
  while (acc >= STEP) { if (resumeT) countdownStep(); else if (!paused) update(); acc -= STEP; }
  level *= 0.9;
  draw(); present();
  led.className = sensorLive() ? 'on' : '';
  requestAnimationFrame(loop);
}
reset(); fade = 0;
requestAnimationFrame(loop);
</script>
</body>
