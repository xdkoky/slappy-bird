WN TO DIVE. SWIPE AGAIN AND AGAIN TO GO FASTER. LET GO AND YOU FALL. ON A KEYBOARD: THE UP AND DOWN ARROWS.":"CHEGA DE TOCAR: DESLIZE PARA CIMA PARA SUBIR E PARA BAIXO PARA MERGULHAR. DESLIZE DE NOVO E DE NOVO PARA IR MAIS RÁPIDO. SOLTE E VOCÊ CAI. NO TECLADO: AS SETAS PARA CIMA E PARA BAIXO.","CAUGHT AGAIN":"PESCADO DE NOVO","SPLASH!":"TCHIBUM!","THE GROUND IS WATER NOW. FALL IN AND YOU SPLASH, LIKE A REAL FISH.":"O CHÃO AGORA É ÁGUA. SE CAIR, É TCHIBUM, COMO UM PEIXE DE VERDADE.","TAP RETRY AND A FISHING ROD CASTS OUT, REELS YOU IN AND CARRIES YOU BACK TO THE START. IN A HURRY? TAP TO SKIP IT.":"TOQUE PARA TENTAR DE NOVO E UMA VARA DE PESCA JOGA A LINHA, TE PUXA DA ÁGUA E TE LEVA DE VOLTA AO INÍCIO. COM PRESSA? TOQUE PARA PULAR.","DO A FLIP!":"DÁ UM MORTAL!","SWIPES SPIN YOUR FISH: UP FOR A BACKFLIP, DOWN FOR A FRONT FLIP. A QUICK, LONG SWIPE FLIPS IT, A BIG ONE TWICE, A WEAK ONE JUST WOBBLES. NO TWO FLIPS ARE THE SAME. JUST FOR STYLE: IT DOES NOT CHANGE WHAT YOU HIT.":"DESLIZAR FAZ SEU PEIXE GIRAR: PARA CIMA UM MORTAL PARA TRÁS, PARA BAIXO PARA FRENTE. UM DESLIZE RÁPIDO E LONGO VIRA ELE, UM GRANDE DUAS VEZES, UM FRACO SÓ BALANÇA. NENHUM MORTAL É IGUAL. SÓ PELO ESTILO: NÃO MUDA NO QUE VOCÊ BATE.","CARTOON CITY":"CIDADE DE DESENHO","A NEW BACKGROUND: WONKY CARTOON SKYSCRAPERS WITH ANTENNAS, AND BIG PUFFY CLOUDS AND BUSHES. AT NIGHT THE WINDOWS LIGHT UP.":"UM FUNDO NOVO: ARRANHA-CÉUS DE DESENHO TORTOS COM ANTENAS, E NUVENS E ARBUSTOS GRANDES E FOFOS. À NOITE AS JANELAS ACENDEM.","RUSTY PIPES":"CANOS ENFERRUJADOS","WHERE THE PIPES COME OUT OF THE WATER THEY ARE RUSTY NOW, WITH BARNACLES STUCK ON. AND THE ANGLED PIPES ARE NO LONGER SEE-THROUGH.":"ONDE OS CANOS SAEM DA ÁGUA AGORA ESTÃO ENFERRUJADOS, COM CRACAS GRUDADAS. E OS CANOS INCLINADOS NÃO SÃO MAIS TRANSPARENTES.","SWIPE NOW TO PARRY!":"DESLIZE AGORA PARA REBATER!","PRESS SPACE TO PARRY!":"APERTE ESPAÇO PARA REBATER!","PINK FIREBALLS CAN BE HIT BACK":"BOLAS DE FOGO ROSA PODEM SER REBATIDAS","HIT THE BOSS WITH THEM TO BEAT IT":"ACERTE O CHEFE COM ELAS PARA VENCÊ-LO","NICE!":"BOA!","EVERY PARRY HITS THE BOSS":"CADA REBATIDA ACERTA O CHEFE","KEEP IT UP TO WIN!":"CONTINUE ASSIM PARA VENCER!","SWIPE NOW!":"DESLIZE AGORA!","BOSS SCHOOL":"ESCOLA DE CHEFES","NEW TO BOSSES? WHEN KING CROW'S FIRST PINK FIREBALL GETS CLOSE, THE CAMERA ZOOMS IN AND WAITS FOR YOUR SWIPE TO PARRY IT. IT SHOWS UP EVERY RUN UNTIL YOU BEAT YOUR FIRST BOSS.":"NOVO COM CHEFES? QUANDO A PRIMEIRA BOLA DE FOGO ROSA DO KING CROW CHEGA PERTO, A CÂMERA DÁ ZOOM E ESPERA VOCÊ DESLIZAR PARA REBATER. APARECE EM TODA PARTIDA ATÉ VOCÊ VENCER SEU PRIMEIRO CHEFE.","TURN YOUR PHONE UPRIGHT":"COLOQUE O CELULAR NA VERTICAL","BENDY FISH":"PEIXE FLEXÍVEL","YOUR FISH NOW BENDS WITH YOUR SWIPES: IT ARCHES WHEN YOU PUSH IT UP AND CURLS WHEN YOU PUSH IT DOWN, THEN WOBBLES BACK. THE HARDER THE SWIPE, THE BIGGER THE BEND.":"SEU PEIXE AGORA SE DOBRA COM OS SEUS DESLIZES: ARQUEIA QUANDO VOCÊ EMPURRA PARA CIMA E SE CURVA PARA BAIXO, DEPOIS VOLTA BALANÇANDO. QUANTO MAIS FORTE O DESLIZE, MAIOR A CURVA.","EYE SPY":"OLHO VIVO","EVERY FISH HAS A CLEARER EYE NOW, IN COLOURS THAT MATCH ITS SKIN. AND JACKPOT IS NOW A LUCKY GOLD FISH WITH A LEVER FOR A FIN AND SPINNING REELS ON ITS SIDE.":"AGORA CADA PEIXE TEM UM OLHO MAIS NÍTIDO, EM CORES QUE COMBINAM COM A SKIN. E O JACKPOT AGORA É UM PEIXE DOURADO DA SORTE COM UMA ALAVANCA NO LUGAR DA NADADEIRA E ROLOS GIRANDO NO LADO.","MAKING WAVES":"FAZENDO ONDAS","THE WATER IS ALIVE: WAVES ROLL AND BOUNCE OFF THE PIPES, MOVING PIPES PUSH THE WATER, SPLASHES POP UP NOW AND THEN AND DROPS RUN DOWN THE PIPES. AND YOU CAN SEE THE PIPES UNDER THE WATER.":"A ÁGUA ESTÁ VIVA: AS ONDAS ROLAM E BATEM NOS CANOS, CANOS QUE SE MEXEM EMPURRAM A ÁGUA, DE VEZ EM QUANDO ESPIRRA ÁGUA E GOTAS ESCORREM PELOS CANOS. E DÁ PARA VER OS CANOS DEBAIXO D'ÁGUA.","SPLASH ZONE":"ZONA DE RESPINGOS","FLY LOW AND PUSH OFF THE WATER TO KICK UP WAVES AND SPRAY, SKIMMING LEAVES A WAKE, AND A FISH THAT DIES IN THE WATER MAKES A BIG SPLASH.":"VOE BAIXO E IMPULSIONE-SE NA ÁGUA PARA LEVANTAR ONDAS E RESPINGOS, RASPANDO NELA VOCÊ DEIXA UM RASTRO, E UM PEIXE QUE CAI NA ÁGUA FAZ UM GRANDE SPLASH.","DRIP DRIP":"PINGA PINGA","WAVES AND SPLASHES THAT HIT A PIPE NOW LEAVE DROPS ON IT. THEY RUN DOWN, STOP AND SWELL NOW AND THEN, AND LEAVE A WET STREAK BEHIND.":"ONDAS E RESPINGOS QUE BATEM NUM CANO AGORA DEIXAM GOTAS NELE. ELAS ESCORREM, DE VEZ EM QUANDO PARAM E INCHAM, E DEIXAM UM RASTRO MOLHADO.","ALL ABOARD":"TODOS A BORDO","THE TV AND THE SIGN ON THE TITLE SCREEN NOW FLOAT ON THE WATER IN LIFE RINGS. THEY BOB WITH THE WAVES, AND A TAP DUNKS THEM WITH A SPLASH.":"A TV E A PLACA DA TELA INICIAL AGORA FLUTUAM NA ÁGUA EM BOIAS SALVA-VIDAS. ELAS BALANÇAM COM AS ONDAS, E UM TOQUE AS AFUNDA COM UM SPLASH."}};</script>
