<style>
  html, body { margin:0; height:100%; background:#141210; overflow:hidden;

  #bezel { position:relative; padding:22px 22px 46px; border-radius:28px;
    background:linear-gradient(160deg,#4d4943 0%,#2d2a26 55%,#221f1c 100%);

  #screen { display:block; border-radius:16px; background:#000;

    letter-spacing:3px; color:#8f897e; text-shadow:0 1px 0 #000; }
  #led { position:absolute; bottom:17px; right:30px; width:8px; height:8px; border-radius:50%;
    background:#f93; box-shadow:0 0 8px #f93; }
  #led.on { background:#4f4; box-shadow:0 0 8px #4f4; }
  body.fs { background:#000; cursor:none; }
  body.fs #bezel { padding:0; border-radius:0; background:none; box-shadow:none; }
  body.fs #screen { border-radius:0; box-shadow:none; }
  body.fs #label, body.fs #led { display:none; }
  /* iPhone / touch: edge-to-edge (the sky runs up under the status bar), no browser gestures */
  html.touch, html.touch body { background:var(--sky, #4ec0ca);   /* sky colour: iOS tints the status bar area from it */
    touch-action:none; overscroll-behavior:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  /* The canvas starts at the very top (sky under the status bar) and runs past the bottom edge, so
     no page background can ever show above or below the game; the overhang is simply off-screen. */
  html.touch #monitor { position:fixed; left:0; right:0; top:0; bottom:auto; height:calc(100vh + 120px);
    align-items:flex-start; overflow:visible; }
  #statusbar { display:none; }
  #safe { position:fixed; top:0; left:0; width:0; height:0; visibility:hidden; pointer-events:none;

  html.touch #bezel { padding:0; border-radius:0; background:none; box-shadow:none; }
  html.touch #screen { border-radius:0; box-shadow:none; }
  html.touch #label, html.touch #led { display:none; }
  /* The name / room-code window is drawn in the game canvas; this invisible input sits exactly over the
     drawn text field so tapping it opens the phone keyboard. */
  #namebox, #chatbox { display:none; position:fixed; inset:0; z-index:20; pointer-events:none; }
  #namebox input, #chatbox input { position:absolute; pointer-events:auto; box-sizing:border-box; margin:0; padding:0 8px; border:0;

RESSA? TOQUE PARA PULAR.","WANT AN OLD SCHOOL LOOK?":"QUER UM VISUAL RETRÔ?","TOO MUCH? TAP ME AGAIN":"DEMAIS? TOQUE DE NOVO","OLD SCHOOL TV":"TV ANTIGA","THE SCREEN EFFECT IS NOW OFF AND MUCH SOFTER. WANT IT? TAP THE LITTLE TV ON THE TITLE SCREEN.":"O EFEITO DE TELA AGORA ESTÁ DESLIGADO E MUITO MAIS SUAVE. QUER? TOQUE NA TV PEQUENA NA TELA INICIAL.","COIN RUSH!":"CHUVA DE MOEDAS!","GRAB THEM ALL":"PEGUE TODAS","BEWARE THE SKULLS":"CUIDADO COM AS CAVEIRAS","THREE SKULLS ON THE LUCKY SLOTS NOW BLOW THE MACHINE UP. NO MORE SPINS FOR THAT RUN!":"TRÊS CAVEIRAS NO CAÇA-NÍQUEL AGORA EXPLODEM A MÁQUINA. SEM MAIS GIROS NAQUELA PARTIDA!","NO MORE SPINS THIS RUN":"SEM MAIS GIROS NESTA PARTIDA","NEW NAME":"NOVO NOME","SAME COINS EVERYWHERE":"AS MESMAS MOEDAS EM TODO LUGAR","YOUR COINS AND TOKENS NOW STAY THE SAME ON EVERY DEVICE YOU PLAY ON.":"SUAS MOEDAS E FICHAS AGORA SÃO AS MESMAS EM TODOS OS SEUS APARELHOS.","YOUR LOOK EVERYWHERE":"SEU VISUAL EM TODO LUGAR","YOUR SKINS, TRAILS AND HAT NOW MATCH ON EVERY DEVICE. UNLOCK A SKIN ON ONE AND THE OTHERS GET IT TOO.":"SUAS SKINS, RASTROS E BONÉ AGORA SÃO IGUAIS EM TODOS OS APARELHOS. DESBLOQUEIE UMA SKIN EM UM E OS OUTROS TAMBÉM GANHAM.","FAIRER CHOMPERS":"MORDEDORES MAIS JUSTOS","THE CHOMPER PIPES BITE SLOWER NOW, AND THEY ARE ALWAYS OPEN ENOUGH TO FLY THROUGH WHEN YOU REACH THEM.":"OS CANOS MORDEDORES AGORA MORDEM MAIS DEVAGAR E SEMPRE ESTÃO ABERTOS O BASTANTE QUANDO VOCÊ CHEGA.","{} SAYS: NO FISH ALLOWED!":"{} DIZ: PROIBIDO PEIXES!",FISH:"PEIXES","A FISH WITH A DREAM":"UM PEIXE COM UM SONHO","OUR HERO IS NOW A LITTLE FISH WHO WANTS TO BE A BIRD. THE REAL BIRDS ARE NOT HAPPY ABOUT IT. SHOW THEM!":"NOSSO HERÓI AGORA É UM PEIXINHO QUE QUER SER UM PÁSSARO. OS PÁSSAROS DE VERDADE NÃO GOSTARAM NADA. MOSTRE A ELES!","MEET SLAPPY FIH":"CONHEÇA SLAPPY FIH","THE GAME IS NOW CALLED SLAPPY FIH! SAME GAME. YOUR PROGRESS, SKINS AND FRIENDS ARE ALL SAFE.":"O JOGO AGORA SE CHAMA SLAPPY FIH! MESMO JOGO. SEU PROGRESSO, SKINS E AMIGOS ESTÃO SEGUROS.","WORK IN PROGRESS":"EM DESENVOLVIMENTO","THE NEW LOOK IS STILL BEING BUILT. MORE FISHY THINGS ARE ON THE WAY!":"O NOVO VISUAL AINDA ESTÁ SENDO FEITO. MAIS COISAS DE PEIXE ESTÃO A CAMINHO!","MEET THE PIKE":"CONHEÇA O LÚCIO","OUR FISH IS NOW A PIKE WITH A PAIR OF (SLIGHTLY TOO SMALL) BIRD WINGS. IT FLAPS FASTER WHEN YOU DO, TUCKS ITS WINGS IN A DIVE AND FLAILS WHEN IT FALLS. SAME SIZE AS BEFORE, SO THE GAME IS JUST AS HARD.":"NOSSO PEIXE AGORA É UM LÚCIO COM UM PAR DE ASAS DE PÁSSARO (UM POUCO PEQUENAS DEMAIS). ELE BATE AS ASAS MAIS RÁPIDO QUANDO VOCÊ TOCA, RECOLHE AS ASAS NO MERGULHO E SE DEBATE AO CAIR. MESMO TAMANHO DE ANTES, ENTÃO É TÃO DIFÍCIL QUANTO.","GONE FISHING":"PESCARIA","AFTER A CRASH, THE HAND NOW FISHES YOU BACK UP ON A LINE AND HOOK.":"DEPOIS DE UMA BATIDA, A MÃO AGORA TE PESCA DE VOLTA COM LINHA E ANZOL.","THE JACKPOT, RACER AND ZEBRA FISH GOT A NEW LOOK. JACKPOT IS NOW A REAL SLOT MACHINE: WATCH ITS REELS SPIN AND LAND ON HEARTS!":"OS PEIXES JACKPOT, RACER E ZEBRA GANHARAM UM VISUAL NOVO. JACKPOT AGORA É UMA MÁQUINA CAÇA-NÍQUEIS DE VERDADE: VEJA OS ROLOS GIRAREM E PARAREM EM CORAÇÕES!",SWIPE:"DESLIZE","SWIPE TO FLY":"DESLIZE PARA VOAR","NO SENSOR: SPACE OR UP/DOWN KEYS TO FLY":"SEM SENSOR: ESPAÇO OU SETAS CIMA/BAIXO","SWIPE TO FLY!":"DESLIZE PARA VOAR!","NO MORE TAPPING: SWIPE UP TO GO UP, SWIPE DOWN TO DIVE. SWIPE AGAIN AND AGAIN TO GO FASTER. LET GO AND YOU FALL. ON A KEYBOARD: THE UP AND DOWN ARROWS.":"CHEGA DE TOCAR: DESLIZE PARA CIMA PARA SUBIR E PARA BAIXO PARA MERGULHAR. DESLIZE DE NOVO E DE NOVO PARA IR MAIS RÁPIDO. SOLTE E VOCÊ CAI. NO TECLADO: AS SETAS PARA CIMA E PARA BAIXO.","CAUGHT AGAIN":"PESCADO DE NOVO","SPLASH!":"TCHIBUM!","THE GROUND IS WATER NOW. FALL IN AND YOU SPLASH, LIKE A REAL FISH.":"O CHÃO AGORA É ÁGUA. SE CAIR, É TCHIBUM, COMO UM PEIXE DE VERDADE.","TAP RETRY AND A FISHING ROD CASTS OUT, REELS YOU IN AND CARRIES YOU BACK TO THE START. IN A HURRY? TAP TO SKIP IT.":"TOQUE PARA TENTAR DE NOVO E UMA VARA DE PESCA JOGA A LI
