  html, body { margin:0; height:100%; background:#141210; overflow:hidden;

  #bezel { position:relative; padding:22px 22px 46px; border-radius:28px;
    background:linear-gradient(160deg,#4d4943 0%,#2d2a26 55%,#221f1c 100%);

  #screen { display:block; border-radius:16px; background:#000;

    letter-spacing:3px; color:#8f897e; text-shadow:0 1px 0 #000; }
  #led { position:absolute; bottom:17px; right:30px; width:8px; height:8px; border-radius:50%;
    background:#f93; box-shadow:0 0 8px #f93; }
  #led.on { background:#4f4; box-shadow:0 0 8px #4f4; }
  body.fs { background:#000; cursor:none; }
  body.fs #bezel { padding:0; border-radius:0; background:none; box-shadow:none; }
  body.fs #screen { border-radius:0; box-shadow:none; }
  body.fs #label, body.fs #led { display:none; }
  /* iPhone / touch: edge-to-edge (the sky runs up under the status bar), no browser gestures */
  html.touch, html.touch body { background:var(--sky, #4ec0ca);   /* sky colour: iOS tints the status bar area from it */
    touch-action:none; overscroll-behavior:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  /* The canvas starts at the very top (sky under the status bar) and runs past the bottom edge, so
     no page background can ever show above or below the game; the overhang is simply off-screen. */
  html.touch #monitor { position:fixed; left:0; right:0; top:0; bottom:auto; height:calc(100vh + 120px);
    align-items:flex-start; overflow:visible; }
  #statusbar { display:none; }
  #safe { position:fixed; top:0; left:0; width:0; height:0; visibility:hidden; pointer-events:none;

  html.touch #bezel { padding:0; border-radius:0; background:none; box-shadow:none; }
  html.touch #screen { border-radius:0; box-shadow:none; }
  html.touch #label, html.touch #led { display:none; }
  /* The name / room-code window is drawn in the game canvas; this invisible input sits exactly over the
     drawn text field so tapping it opens the phone keyboard. */
  #namebox, #chatbox { display:none; position:fixed; inset:0; z-index:20; pointer-events:none; }
  #namebox input, #chatbox input { position:absolute; pointer-events:auto; box-sizing:border-box; margin:0; padding:0 8px; border:0;

N YOU DO, TUCKS ITS WINGS IN A DIVE AND FLAILS WHEN IT FALLS. SAME SIZE AS BEFORE, SO THE GAME IS JUST AS HARD.":"NOSSO PEIXE AGORA É UM LÚCIO COM UM PAR DE ASAS DE PÁSSARO (UM POUCO PEQUENAS DEMAIS). ELE BATE AS ASAS MAIS RÁPIDO QUANDO VOCÊ TOCA, RECOLHE AS ASAS NO MERGULHO E SE DEBATE AO CAIR. MESMO TAMANHO DE ANTES, ENTÃO É TÃO DIFÍCIL QUANTO.","GONE FISHING":"PESCARIA","AFTER A CRASH, THE HAND NOW FISHES YOU BACK UP ON A LINE AND HOOK.":"DEPOIS DE UMA BATIDA, A MÃO AGORA TE PESCA DE VOLTA COM LINHA E ANZOL.","THE JACKPOT, RACER AND ZEBRA FISH GOT A NEW LOOK. JACKPOT IS NOW A REAL SLOT MACHINE: WATCH ITS REELS SPIN AND LAND ON HEARTS!":"OS PEIXES JACKPOT, RACER E ZEBRA GANHARAM UM VISUAL NOVO. JACKPOT AGORA É UMA MÁQUINA CAÇA-NÍQUEIS DE VERDADE: VEJA OS ROLOS GIRAREM E PARAREM EM CORAÇÕES!",SWIPE:"DESLIZE","SWIPE TO FLY":"DESLIZE PARA VOAR","NO SENSOR: SPACE OR UP/DOWN KEYS TO FLY":"SEM SENSOR: ESPAÇO OU SETAS CIMA/BAIXO","SWIPE TO FLY!":"DESLIZE PARA VOAR!","NO MORE TAPPING: SWIPE UP TO GO UP, SWIPE DOWN TO DIVE. SWIPE AGAIN AND AGAIN TO GO FASTER. LET GO AND YOU FALL. ON A KEYBOARD: THE UP AND DOWN ARROWS.":"CHEGA DE TOCAR: DESLIZE PARA CIMA PARA SUBIR E PARA BAIXO PARA MERGULHAR. DESLIZE DE NOVO E DE NOVO PARA IR MAIS RÁPIDO. SOLTE E VOCÊ CAI. NO TECLADO: AS SETAS PARA CIMA E PARA BAIXO.","CAUGHT AGAIN":"PESCADO DE NOVO","SPLASH!":"TCHIBUM!","THE GROUND IS WATER NOW. FALL IN AND YOU SPLASH, LIKE A REAL FISH.":"O CHÃO AGORA É ÁGUA. SE CAIR, É TCHIBUM, COMO UM PEIXE DE VERDADE.","TAP RETRY AND A FISHING ROD CASTS OUT, REELS YOU IN AND CARRIES YOU BACK TO THE START. IN A HURRY? TAP TO SKIP IT.":"TOQUE PARA TENTAR DE NOVO E UMA VARA DE PESCA JOGA A LINHA, TE PUXA DA ÁGUA E TE LEVA DE VOLTA AO INÍCIO. COM PRESSA? TOQUE PARA PULAR.","DO A FLIP!":"DÁ UM MORTAL!","SWIPES SPIN YOUR FISH: UP FOR A BACKFLIP, DOWN FOR A FRONT FLIP. A QUICK, LONG SWIPE FLIPS IT, A BIG ONE TWICE, A WEAK ONE JUST WOBBLES. NO TWO FLIPS ARE THE SAME. JUST FOR STYLE: IT DOES NOT CHANGE WHAT YOU HIT.":"DESLIZAR FAZ SEU PEIXE GIRAR: PARA CIMA UM MORTAL PARA TRÁS, PARA BAIXO PARA FRENTE. UM DESLIZE RÁPIDO E LONGO VIRA ELE, UM GRANDE DUAS VEZES, UM FRACO SÓ BALANÇA. NENHUM MORTAL É IGUAL. SÓ PELO ESTILO: NÃO MUDA NO QUE VOCÊ BATE.","CARTOON CITY":"CIDADE DE DESENHO","A NEW BACKGROUND: WONKY CARTOON SKYSCRAPERS WITH ANTENNAS, AND BIG PUFFY CLOUDS AND BUSHES. AT NIGHT THE WINDOWS LIGHT UP.":"UM FUNDO NOVO: ARRANHA-CÉUS DE DESENHO TORTOS COM ANTENAS, E NUVENS E ARBUSTOS GRANDES E FOFOS. À NOITE AS JANELAS ACENDEM.","RUSTY PIPES":"CANOS ENFERRUJADOS","WHERE THE PIPES COME OUT OF THE WATER THEY ARE RUSTY NOW, WITH BARNACLES STUCK ON. AND THE ANGLED PIPES ARE NO LONGER SEE-THROUGH.":"ONDE OS CANOS SAEM DA ÁGUA AGORA ESTÃO ENFERRUJADOS, COM CRACAS GRUDADAS. E OS CANOS INCLINADOS NÃO SÃO MAIS TRANSPARENTES.","SWIPE NOW TO PARRY!":"DESLIZE AGORA PARA REBATER!","PRESS SPACE TO PARRY!":"APERTE ESPAÇO PARA REBATER!","PINK FIREBALLS CAN BE HIT BACK":"BOLAS DE FOGO ROSA PODEM SER REBATIDAS","HIT THE BOSS WITH THEM TO BEAT IT":"ACERTE O CHEFE COM ELAS PARA VENCÊ-LO","NICE!":"BOA!","EVERY PARRY HITS THE BOSS":"CADA REBATIDA ACERTA O CHEFE","KEEP IT UP TO WIN!":"CONTINUE ASSIM PARA VENCER!","SWIPE NOW!":"DESLIZE AGORA!","BOSS SCHOOL":"ESCOLA DE CHEFES","NEW TO BOSSES? WHEN KING CROW'S FIRST PINK FIREBALL GETS CLOSE, THE CAMERA ZOOMS IN AND WAITS FOR YOUR SWIPE TO PARRY IT. IT SHOWS UP EVERY RUN UNTIL YOU BEAT YOUR FIRST BOSS.":"NOVO COM CHEFES? QUANDO A PRIMEIRA BOLA DE FOGO ROSA DO KING CROW CHEGA PERTO, A CÂMERA DÁ ZOOM E ESPERA VOCÊ DESLIZAR PARA REBATER. APARECE EM TODA PARTIDA ATÉ VOCÊ VENCER SEU PRIMEIRO CHEFE."}};</script>
