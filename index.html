<style>
  html, body { margin:0; height:100%; background:#141210; overflow:hidden;
    user-select:none; -webkit-user-select:none; cursor:default; }
  #monitor { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  #bezel { position:relative; padding:22px 22px 46px; border-radius:28px;
    background:linear-gradient(160deg,#4d4943 0%,#2d2a26 55%,#221f1c 100%);
    box-shadow: inset 0 2px 0 rgba(255,255,255,.14), inset 0 -3px 0 rgba(0,0,0,.45), 0 24px 60px rgba(0,0,0,.65); }
  #screen { display:block; border-radius:16px; background:#000;
    box-shadow: 0 0 0 3px #0c0b0a, 0 0 0 5px #3a3631; }
  #label { position:absolute; bottom:15px; left:28px; font:700 11px/1 Menlo, monospace;
    letter-spacing:3px; color:#8f897e; text-shadow:0 1px 0 #000; }
  #led { position:absolute; bottom:17px; right:30px; width:8px; height:8px; border-radius:50%;
    background:#f93; box-shadow:0 0 8px #f93; }
  #led.on { background:#4f4; box-shadow:0 0 8px #4f4; }
  body.fs { background:#000; cursor:none; }
  body.fs #bezel { padding:0; border-radius:0; background:none; box-shadow:none; }
  body.fs #screen { border-radius:0; box-shadow:none; }
  body.fs #label, body.fs #led { display:none; }
  /* iPhone / touch: edge-to-edge (the sky runs up under the status bar), no browser gestures */
  html.touch, html.touch body { background:#4ec0ca;   /* sky colour: iOS tints the status bar area from it */
    touch-action:none; overscroll-behavior:none;
    -webkit-touch-callout:none; -webkit-tap-highlight-color:transparent; }
  /* The canvas starts at the very top (sky under the status bar) and runs past the bottom edge, so
     no page background can ever show above or below the game; the overhang is simply off-screen. */
  html.touch #monitor { position:fixed; left:0; right:0; top:0; bottom:auto; height:calc(100vh + 120px);
    align-items:flex-start; overflow:visible; }
  #statusbar { display:none; }
  #safe { position:fixed; top:0; left:0; width:0; height:0; visibility:hidden; pointer-events:none;
    padding-top:env(safe-area-inset-top); }
  html.touch #bezel { padding:0; border-radius:0; background:none; box-shadow:none; }
  html.touch #screen { border-radius:0; box-shadow:none; }
  html.touch #label, html.touch #led { display:none; }
  /* The name / room-code window is drawn in the game canvas; this invisible input sits exactly over the
     drawn text field so tapping it opens the phone keyboard. */
  #namebox { display:none; position:fixed; inset:0; z-index:20; pointer-events:none; }
  #namebox input { position:absolute; pointer-events:auto; box-sizing:border-box; margin:0; padding:0 8px; border:0;
    border-radius:0; outline:none; background:transparent; color:transparent; caret-color:transparent;
    font-size:16px; text-transform:uppercase; -webkit-appearance:none; appearance:none; touch-action:auto; }
  #namebox input::selection { background:transparent; }
</style>

function crash(onGround) {

// ------------------------------------------------------------ difficulty

function difficulty(k) {

  return {
    e,
    gap: Math.max(112, 140 - Math.max(0, e - 6) * 0.9),
    spacing: Math.max(165, 190 - Math.max(0, e - 20)),
    vary: Math.min(150, 110 + Math.max(0, e - 10) * 2),
    move: e < 10 ? 0 : Math.min(0.55, 0.22 + (e - 10) * 0.02),
    moveAmp: Math.min(56, 24 + (e - 10) * 1.2),
    chomp: e < 25 ? 0 : Math.min(0.32, 0.14 + (e - 25) * 0.01),
    chompAmp: Math.min(34, 20 + (e - 25) * 0.7),

}

function pipeShape(p) {
  let h = p.gap / 2, c = p.top + h;
  if (p.kind === 'move') c += p.amp * Math.sin(p.phase + p.t * p.freq);
  if (p.kind === 'chomp') h -= p.amp * (0.5 + 0.5 * Math.sin(p.phase + p.t * p.freq));
  c = clamp(c, 50 + h, GY - 50 - h);
  p.y0 = c - h; p.y1 = c + h;
  if (p.kind === 'rock') p.ang = p.amp * Math.sin(p.phase + p.t * p.freq);
  if (p.kind === 'split') { p.b0 = c - p.bh / 2; p.b1 = c + p.bh / 2; }
}

// Special pipes: plain green until the first boss, then each boss beaten unlocks the next type,

const SPECIAL_KINDS = [

    shownNew[intro.kind] = true;

    if (raceOn()) race.fx.push(show); else show();

}
// Collision against a pipe pair, rotated for angled pipes (the bird is moved into the pipe's frame).

    const cx = p.x + 24, cy = (p.y0 + p.y1) / 2, dx = bx - cx, dy = by - cy, c = Math.cos(p.ang), s = Math.sin(p.ang);
    bx = cx + dx * c + dy * s; by = cy - dx * s + dy * c;

function spawnPipes() {                     // races: the course comes from the shared seed
  if (!raceOn()) return spawnPipesInner();
  const mr = Math.random; Math.random = race.rng;
  try { spawnPipesInner(); } finally { Math.random = mr; }
  for (const f of race.fx.splice(0)) f();   // banners/sounds deferred so they can't consume the seed
}

  let last = pipes[pipes.length - 1], n = 0;
  while (!bossPending && (!last || last.x < LW + 20)) {

    const k = spawned++, d = difficulty(k);
    const x = last ? last.x + d.spacing : BIRD_X + 260;
    let top = 60 + Math.random() * (GY - d.gap - 120);

    const prev = last;

      amp: kind === 'move' ? Math.max(24, d.moveAmp) : kind === 'chomp' ? Math.max(20, d.chompAmp) : 0,
      freq: kind === 'move' ? rand(0.022, 0.04) : rand(0.045, 0.065), phase: rand(0, 6.28), ang: 0 };

// ------------------------------------------------------------ coins
// Coins ride along with a pipe (dx from its left edge). Small ones sit on the safe line through the gap;
// big ones (worth 3) hug a cap or float far off the path between two pipes: go for it or play it safe.
function addCoins(p, prev, d) {

  const dl = stats.daily;                   // the next letter of the daily word, every 8-12 pipes
  if (rs && state === 'play' && dl && dl.day === dayKey() && dl.got < dl.word.length && spawned >= rs.letterAt && !coins.some(c => c.letter)) {
    rs.letterAt = spawned + 8 + (Math.random() * 5 | 0);

    return;
  }
  const add = o => coins.push(Object.assign({ pipe: p, dx: 24, dy: 0, mode: 'mid', big: false, ph: rand(0, 6), x: p.x + 24, y: 0 }, o));
  // rare token: drifts toward the bird between pipes, bobbing up and down
  if (prev && spawned >= 6 && Math.random() < 0.045 && !coins.some(c => c.token)) {
    const mid = clamp(((prev.y0 + prev.y1) / 2 + (p.y0 + p.y1) / 2) / 2, 120, GY - 120);
    coins.push({ token: true, pipe: null, x: (prev.x + 50 + p.x) / 2, y: mid, base: mid, amp: rand(55, 80), t: rand(0, 6) / 0.045, trail: [], ph: 0 });

  else if (r < 0.7 && d.e >= 3 && p.kind !== 'chomp') add({ mode: Math.random() < 0.5 ? 'top' : 'bot', big: true });
  else if (r < 0.92 && d.e >= 3 && prev) {

}
function updateCoins(sp) {
  for (const c of coins) {
    const p = c.pipe;
    if (c.token) {

      c.y = c.base + Math.sin(c.t * 0.045) * c.amp;
      c.trail.push({ x: c.x, y: c.y }); if (c.trail.length > 28) c.trail.shift();
    } else if (!p) { if (state === 'play') c.x -= sp; }
    else {
      c.x = p.x + c.dx;
      if (c.mode === 'mid') c.y = (p.kind === 'split' ? (p.lane ? (p.b1 + p.y1) / 2 : (p.y0 + p.b0) / 2) : (p.y0 + p.y1) / 2) + c.dy;

    if (state !== 'play' || (p && p.intro < INTRO)) continue;
    if (c.token && Math.hypot(c.x - BIRD_X, c.y - bird.y) < BIRD_R + 12) {
      c.dead = true; tokens++; tokenBump = 8; statAdd('tokens'); dq('token'); save();
      popup('+1 TOKEN', c.x, c.y - 20, { sc: 3, fill: '#f0a0ff', ol: '#2a0838', life: 50, vy: -0.6 });
      burst(c.x, c.y, 24, ['#f0a0ff', '#c040e0', '#fff'], 4.5, 24, 4);
      rings.push({ x: c.x, y: c.y, r: 8, dr: 4, life: 16, col: '#f0a0ff' });

    }
    if (c.letter) { if (Math.hypot(c.x - BIRD_X, c.y - bird.y) < BIRD_R + 13) { c.dead = true; letterGot(c); } continue; }
    if (!c.token && Math.hypot(c.x - BIRD_X, c.y - bird.y) < BIRD_R + (c.big ? 10 : 7)) {
      const v = c.big ? 5 : 1; c.dead = true; bank += v; coinBump = 8; statAdd('coins', v);
      dq('coin', v); if (c.big) dq('bigcoin'); if (rs) rs.coins += v;

// ------------------------------------------------------------ death slot machine

  if (r < 0.50) return three('skull');

}

      reels: [0, 1, 2].map(() => ({ pos: Math.random() * STRIP.length | 0, from: 0, to: 0, v: 0, t: 0, T1: 0, Td: 0, done: true, bounce: 0 })) };

}

  const s = slot;

  s.paid = tokens > 0 ? 'token' : 'coins'; dq('spin');
  if (tokens > 0) tokens--; else bank -= COINS_PER_SPIN;
  save(); s.spins++;
  s.out = rollOutcome(); s.phase = 'spin'; s.msg = ''; s.res = ''; s.pull = 0;
  s.suspense = s.out[0] === 'heart' && s.out[1] === 'heart';

    let to = Math.ceil(r.from + 0.75 * (r.T1 + r.Td / 2)); while (symAt(i, to) !== s.out[i]) to++;
    r.to = to; r.v = (to - r.from) / (r.T1 + r.Td / 2);

}

  const c = SHOT_COLS[pink ? 'pink' : b.def.shot];
  burst(m.x, m.y, pink ? 8 : 4, [c[1], c[2], '#fff'], 2.5, 14);
  sfx(pink ? 'shoot' : 'pew');
}

// lobbed shot that arcs up and drops through (BIRD_X, bird.y + dy)
function lob(dy, pink) {
  const m = bossMouth(), dx = BIRD_X - m.x, T = clamp(-dx / 3, 45, 90), g = 0.14;
  const ty = clamp(bird.y + dy, 20, GY - 10);
  fire({ pink, quiet: true, vx: dx / T, vy: (ty - m.y - 0.5 * g * T * T) / T, g });
}

// An attack is a list of steps: { t: frames to wait before it, f: what to fire }.
function attack(kind) {
  const b = boss, T = b.tier, pel = 3.4 + T * 0.4 + b.lv * 0.1, st = [];
  const at = (t, f) => st.push({ t, f });
  const gapAng = () => { const m = bossMouth(); return 54 / Math.max(120, Math.hypot(BIRD_X - m.x, bird.y - m.y)); };
  const fan = (offs, pinkMid) => { const s = gapAng(); for (const c of offs) fire({ off: c * s, sp: pel + 0.4, pink: pinkMid && c === 0, quiet: c !== offs[0] }); };
  switch (kind) {
    // tutorial moves (all pink)
    case 'single': at(0, () => fire({ pink: true })); break;
    case 'wave': at(0, () => fire({ pink: true, wob: 42 })); break;
    case 'burst': for (let i = 0; i < 3; i++) at(i ? 18 : 0, () => fire({ pink: true })); break;
    // long stream of small aimed pellets, then one pink shot
    case 'gatling':
      for (let i = 0; i < 7 + T * 3; i++) at(i ? 5 : 0, () => fire({ sp: pel + 0.6, r: 5, off: rand(-0.07, 0.07) }));
      at(24, () => fire({ pink: true }));
      break;
    // pink shot, short pellet burst, pink shot, short pellet burst
    case 'chain':
      for (let k = 0; k < 2; k++) {
        at(k ? 18 : 0, () => fire({ pink: true }));
        for (let i = 0; i < 3 + T; i++) at(i ? 5 : 16, () => fire({ sp: pel + 0.8, r: 5 }));
      }
      break;
    // fast pellets either side of a pink shot, then a scattered pellet burst
    case 'zap':
      at(0, () => { fan([-1, 1], false); fire({ pink: true }); });
      for (let i = 0; i < 4 + T * 2; i++) at(i ? 6 : 22, () => fire({ sp: pel + 1, r: 5, off: rand(-0.12, 0.12) }));
      break;
    // fan with the pink shot in the middle
    case 'fan': at(0, () => fan(T ? [0, -1, 1, -2, 2, -3, 3] : [0, -1, 1, -2, 2], true)); break;
    // even fan the bird sits between, then a full fan
    case 'fan2':
      at(0, () => fan(T ? [-0.5, 0.5, -1.5, 1.5, -2.5, 2.5] : [-0.5, 0.5, -1.5, 1.5], false));
      at(30, () => fan([0, -1, 1, -2, 2], true));
      break;
    // slow ring with the shot aimed at the bird pink, then a re-aimed hostile ring
    case 'ring': {
      const n = 14 + T * 4;
      for (let k = 0; k < 2; k++) at(k ? 34 : 0, () => {
        const a0 = aimAt(bossMouth());
        for (let i = 0; i < n; i++) fire({ a: a0 + i * Math.PI * 2 / n, sp: 2.4 + T * 0.3, pink: !k && !i, quiet: i > 0 });
      });
      break;
    }
    // a column of shots crossing the screen with one gap near the bird, then a pink shot through the gap
    case 'wall':
      at(0, () => {
        const gap = Math.max(72, 100 - T * 8), gy = clamp(bird.y + rand(-90, 90), 70, GY - 70);
        for (let y = 14; y < GY - 4; y += 24) if (Math.abs(y - gy) > gap / 2) fire({ from: { x: boss.x - 10, y }, vx: -(2.4 + T * 0.3), vy: 0, quiet: true });
        sfx('pew'); shake = Math.max(shake, 3);
      });
      at(34, () => fire({ pink: true }));
      break;
    // lobbed shots raining down around the bird, then a lobbed pink one right at it
    case 'rain':
      at(0, () => { for (const o of [-90, -40, 40, 90]) lob(o + rand(-12, 12), false); sfx('pew'); });
      if (T) at(22, () => { for (const o of [-60, 0, 60]) lob(o, false); sfx('pew'); });
      at(28, () => { lob(0, true); sfx('shoot'); });
      break;
  }
  return st;
}

function updateBoss() {
  const b = boss; b.t++;
  b.flash = Math.max(0, b.flash - 1);
  b.hpLag += (b.hp - b.hpLag) * 0.05;
  const tx = LW - (wide ? 120 : 14 + 12 * b.def.S);
  if (b.phase === 'warn') {
    if (b.t > 50) b.x += (tx - b.x) * 0.05;
    b.y = 190 + Math.sin(b.t * 0.05) * 20;
    if (b.t >= 140) { b.phase = 'fight'; b.cd = 50; b.t = 0; }
  } else if (b.phase === 'fight') {
    b.x += (tx - b.x) * 0.08;
    b.y = 195 + Math.sin(b.t * 0.022) * (70 + Math.min(b.lv, 3) * 8) + Math.sin(b.t * 0.09) * 8;
    if (state !== 'play') return;
    const hpRatio = b.hp / b.maxHp;
    if (b.charge > 0) {
      if (--b.charge === 0) { b.steps = attack(b.pending); b.wait = b.steps[0].t; }
    } else if (b.steps.length) {
      if (--b.wait <= 0) {
        do b.steps.shift().f(); while (b.steps.length && b.steps[0].t === 0);
        if (b.steps.length) b.wait = b.steps[0].t;
        else b.cd = b.lv ? Math.max(36, 84 - b.tier * 12 - (1 - hpRatio) * 26) : 100 - (1 - hpRatio) * 30;
      }
    } else if (--b.cd <= 0) {
      let pool = b.def.moves;
      if (!pool) { pool = ['single', 'single', 'wave']; if (hpRatio <= 0.5) pool.push('burst'); }
      let m = pool[Math.random() * pool.length | 0];
      if (m === b.last && b.def.moves) m = pool[Math.random() * pool.length | 0];
      b.pending = b.last = m;
      b.chargeLen = b.charge = Math.max(18, 30 - b.lv * 3);
      sfx('charge');
    }
  } else if (b.phase === 'dying') {
    b.vy += 0.04; b.y += b.vy; b.rot += 0.012; b.x += 0.3;
    if (b.t % 7 === 0) {
      const ex = b.x + rand(-40, 40), ey = b.y + rand(-30, 30);
      booms.push({ x: ex, y: ey, t: 0, life: 20, r: rand(14, 24) });
      burst(ex, ey, 10, ['#fff', '#ffe14d', '#ff8030', b.def.pal.b], 3.5, 24, 4);
      sfx('explode', false); shake = Math.max(shake, 5);
    }
    if (b.t > 105) {
      booms.push({ x: b.x, y: b.y, t: 0, life: 30, r: 60 });
      burst(b.x, b.y, 48, ['#fff', '#ffe14d', '#ff8030', b.def.pal.B, b.def.pal.b], 6, 40, 4);
      rings.push({ x: b.x, y: b.y, r: 10, dr: 7, life: 24, col: '#fff' });
      sfx('explode', true); flash = 1; shake = 16;
      score += 10; popup('+10', b.x, b.y - 30, { sc: 4, fill: '#fff', ol: '#543847', life: 70, vy: -0.6 });
      setBanner('BOSS DEFEATED!', 'BONUS +10', 'victory', 130);
      setTimeout(() => sfx('victory'), 250);
      if (!raceOn() && !(stats.bossTypes || []).includes(b.def.name)) { stats.bossTypes = [...(stats.bossTypes || []), b.def.name]; statsDirty = true; }
      bossesBeaten++; nextBossAt = spawned + BOSS_EVERY; boss = null;
      dq('boss'); if (rs && !b.hurt) rs.flawless++;
      statAdd('bosses'); if (bossesBeaten > (stats.maxBossRun || 0) && !raceOn()) { stats.maxBossRun = bossesBeaten; statsDirty = true; }
    }
  }
}

function parry(s, d) {
  const perfect = d < 34;
  s.refl = true; s.r = 9; combo++; parries++; statAdd('parries'); dq('parry'); if (rs) rs.combo = Math.max(rs.combo, combo);
  const bx = boss ? boss.x : LW + 50, by = boss ? boss.y : s.y;
  const a = Math.atan2(by - s.y, bx - s.x); s.vx = Math.cos(a) * 9; s.vy = Math.sin(a) * 9;
  hitstop = perfect ? 8 : 5; shake = Math.max(shake, perfect ? 9 : 6);
  burst(s.x, s.y, perfect ? 22 : 14, ['#fff', '#ffe14d', '#fff8c0'], perfect ? 5 : 4, 20);
  rings.push({ x: s.x, y: s.y, r: 6, dr: 4, life: 14, col: perfect ? '#fff' : '#ffe14d' });
  const label = (perfect ? 'PERFECT!' : 'PARRY!') + (combo > 1 ? ' X' + combo : '');
  popup(label, BIRD_X + 10, bird.y - 34, { sc: perfect ? 3 : 2, fill: perfect ? '#fff' : '#ffe14d', ol: perfect ? '#e04010' : '#543847', life: 42 });
  sfx('parry', combo);
}

function hitBoss(s) {
  const b = boss;
  b.hp--; b.flash = 14; b.x += 28; hitstop = 9; shake = Math.max(shake, 12);
  burst(s.x, s.y, 26, ['#fff', '#ffe14d', '#ff8030', b.def.pal.B], 5.5, 26, 4);
  rings.push({ x: s.x, y: s.y, r: 8, dr: 5, life: 16, col: '#ffe14d' });
  score++;
  const words = ['CRUNCH!', 'BONK!', 'POW!', 'KRAK!'];
  popup(b.hp > 0 ? words[Math.random() * words.length | 0] : 'K.O.!', b.x, b.y - 52, { sc: b.hp > 0 ? 3 : 5, fill: '#fff', ol: '#c2310c', life: 50 });
  sfx('bossHit');
  if (b.hp <= 0) {
    b.phase = 'dying'; b.t = 0; b.vy = -2.2; slowmo = 54; hitstop = 14; flash = 0.7;
    for (const o of shots) if (!o.refl) { o.dead = true; burst(o.x, o.y, 8, ['#ffb040', '#ff4020'], 2.5, 16); }
  }
}

function hurtBird() {
  if (bird.inv > 0) return;
  if (boss) boss.hurt = true;
  hearts--; combo = 0; bird.inv = 90; shake = Math.max(shake, 9); hurtFlash = 0.55;
  burst(BIRD_X, bird.y, 14, ['#f83850', '#fff', '#f8d81c'], 3.5, 20);
  if (hearts <= 0) crash(false); else sfx('hurt');
}

function updateShots() {
  for (const s of shots) {
    s.t++;
    if (!s.refl) {
      const d = Math.hypot(s.x - BIRD_X, s.y - bird.y);
      s.inRange = s.pink && d < PARRY_R && s.x > BIRD_X - 12;
      const k = s.inRange ? 0.42 : 1;           // bullet-time while it's parryable
      s.vy += s.g * k;
      s.x += s.vx * k; s.y += (s.vy + (s.wob ? Math.cos(s.t * 0.12) * s.wob * 0.12 : 0)) * k;
      if (state === 'play' && d < BIRD_R + s.r - 3) { s.dead = true; hurtBird(); }
    } else {
      if (boss && boss.phase === 'fight') {
        const dx = boss.x - s.x, dy = boss.y - s.y, d = Math.hypot(dx, dy) || 1;
        s.vx += (dx / d * 11 - s.vx) * 0.25; s.vy += (dy / d * 11 - s.vy) * 0.25;
        if (d < 10.5 * boss.def.S) { s.dead = true; hitBoss(s); }
      }
      s.x += s.vx; s.y += s.vy;
    }
    const big = s.pink || s.refl;
    if ((s.t & (big ? 1 : 3)) === 0) sparks.push({ x: s.x, y: s.y, vx: -s.vx * 0.15 + rand(-.4, .4), vy: rand(-.4, .4), life: 12, col: s.refl ? '#ffe14d' : SHOT_COLS[s.col][1], sz: big ? 4 : 2 });
    if (s.y > GY - s.r) { s.dead = true; burst(s.x, GY - 4, 10, ['#ff8030', '#ded895', '#fff'], 3, 18); }
    if (s.x < -40 || s.x > LW + 80 || s.y < (s.g ? -400 : -80)) s.dead = true;
  }
  shots = shots.filter(s => !s.dead);
}

function updateFX() {
  updateConfetti();
  updateTrail(hover > 0 || hitstop > 0 ? 0 : speed());
  checkGoals();
  for (const p of popups) { p.y += p.vy; p.life--; }
  popups = popups.filter(p => p.life > 0);
  for (const f of feathers) { f.x += f.vx; f.y += f.vy; f.vy += 0.05; f.life--; }
  feathers = feathers.filter(f => f.life > 0);
  for (const p of sparks) { p.x += p.vx; p.y += p.vy; p.vx *= 0.93; p.vy = p.vy * 0.93 + 0.06; p.life--; }
  sparks = sparks.filter(p => p.life > 0);
  for (const r of rings) { r.r += r.dr; r.life--; }
  rings = rings.filter(r => r.life > 0);
  for (const b of booms) b.t++;
  booms = booms.filter(b => b.t < b.life);
  if (banner && ++banner.t >= banner.life) banner = null;
  flash = Math.max(0, flash - 0.08); hurtFlash = Math.max(0, hurtFlash - 0.04); fade = Math.max(0, fade - 0.07);
  shake = shake > 0.3 ? shake * 0.82 : 0;
}

function update() {
  tick++;
  if (tick % 30 === 0) checkSkins();
  for (const t of toasts) t.t++; toasts = toasts.filter(t => t.t < 170);
  if (state === 'play' && tick % 6 === 0) dqRun();
  if (state === 'over' && overT === 60 && LB_ON && !player.picked && !raceOn() && !nameBoxOpen) editName(true);
  if (race.phase !== 'off' || race.panel) raceTick();
  if (hitstop > 0) { hitstop--; updateFX(); return; }                       // impact freeze
  if (slowmo > 0) { slowmo--; if (slowmo % 3) { updateFX(); return; } }      // final-blow slow motion
  if (hover > 0 && state === 'play') {          // post-revive hover: the bird bobs, nothing else moves
    if (--hover === 0) sfx('blip', false);
    bird.y = hoverY + Math.sin(tick * 0.12) * 4; bird.vy = 0; bird.rot = 0;
    if (hover % 30 === 0) rings.push({ x: BIRD_X, y: bird.y, r: 10, dr: 2, life: 20, col: '#fff4a0' });
    if (banner && ++banner.t >= banner.life) banner = null;   // let the REVIVED! banner finish
    if (halo > 0) halo--;
    updateFX(); return;
  }
  const sp = speed();
  if (race.phase === 'run' && state === 'play') race.myDist += sp;
  if (state === 'ready' || state === 'play') { groundX = (groundX + sp) % 24; bgX = (bgX + sp * 0.15) % 288; }

  if (state === 'ready') {
    bird.y = 240 + Math.sin(tick * 0.12) * 4; bird.rot = 0;
  } else if (state === 'play' || state === 'dying') {
    bird.vy = Math.min(MAXV, bird.vy + GRAV); bird.y += bird.vy;
    bird.rot = bird.vy < 2 ? Math.max(-0.4, bird.rot - 0.2) : Math.min(Math.PI / 2, bird.rot + 0.07);
    if (bird.inv > 0) bird.inv--;
    if (bird.y < -BIRD_R && state === 'play') crash(false);                  // flew off the top of the screen
    if (bird.y < -20) { bird.y = -20; bird.vy = 0; }
    if (bird.y + 12 >= GY) { bird.y = GY - 12; if (state === 'play') crash(true); else downed(); }
  }
  if (tick === dieSoundAt) sfx('die');

  if (state === 'play') {
    if (!boss) {
      spawnPipes();
      if (bossPending && !pipes.some(p => p.x > BIRD_X - 70)) startBoss();
    }
    for (const p of pipes) {
      p.x -= sp; p.intro++; p.t++; pipeShape(p);
      if (p.intro < INTRO) continue;
      if (!p.passed && p.x + 24 < BIRD_X) {
        p.passed = true; score++; passedPipes++; statAdd('pipes'); sfx('point'); dq('pipe');
        if (p.kind !== 'static') { dq('special'); if (rs) { rs.special++; if (p.kind === 'chomp') rs.chomp++; } }
      }
      if (hitPipe(p)) { crash(false); break; }
    }
    pipes = pipes.filter(p => p.x > -60);
  }
  updateCoins(sp);
  if (state === 'slot') updateSlot();
  if (state === 'revive') updateRevive();
  if (halo > 0 && state === 'play') halo--;
  if (boss) updateBoss();
  updateShots();

  if (state === 'over') {
    overT++;
    if (overT === 18) sfx('swoosh');
    if (overT === 48 && newBest) sfx('fanfare');
  }
  updateFX();
}

// ============================================================ accelerometer input
// The native app calls onAccel(g) ~100x/s with the peak gravity-removed acceleration (in g).
let level = 0, baseline = 0.01, lastSlap = 0, lastAccel = -1e9;
const threshold = () => 0.8 * Math.pow(0.04, sensLevel / 10);   // level 1..10 -> ~0.58g .. 0.032g
window.onAccel = gv => {
  const now = performance.now(); lastAccel = now;
  level = Math.max(level, gv);
  if (gv > threshold() && gv > baseline * 3 && now - lastSlap > 250) { lastSlap = now; flap('slap'); }
  baseline = baseline * 0.98 + Math.min(gv, 0.2) * 0.02;
};
const sensorLive = () => performance.now() - lastAccel < 1000;

function meterBar(mx, my, mw) {

  if (e < PRESS_UP) { const k = (e - PRESS_HOLD) / (PRESS_UP - PRESS_HOLD); return Math.max(0, 1 - k * k * (3 - 2 * k)); }

  pendingAct = b.act;

// ============================================================ 1v1 race (two phones, live)
// Rooms run over Supabase Realtime broadcast (same project as the leaderboard). Both phones build
// the same course from a shared seed; each sends its bird 10x a second and draws the other one as a
// blue ghost. Pipes only: no bosses, coins or slots, special pipes unlock every 8 pipes. Last bird
// flying wins. Races don't touch your best score or the leaderboard.
const RACE_ON = LB_ON && typeof WebSocket !== 'undefined';
const RACE_UNLOCK_EVERY = 8;
const race = { phase: 'off', panel: null, role: null, code: '', ws: null, joined: false, err: '', opp: null,

}
const GHOST_PAL = { k:'#1a3050', y:'#7ad0ff', Y:'#d8f4ff', o:'#3a90d8', w:'#ffffff', v:'#e8f6ff', r:'#ff5a8a', R:'#e0306a' };

// --- connection
function raceSend(event, payload = {}) {
  const ws = race.ws; if (!ws || ws.readyState !== 1 || !race.joined) return;
  ws.send(JSON.stringify({ topic: race.topic, event: 'broadcast', ref: null,
    payload: { type: 'broadcast', event, payload: Object.assign({ id: player.id }, payload) } }));
}
function raceConnect(code, role) {
  raceDisconnect();
  Object.assign(race, { code, role, joined: false, err: '', opp: null, topic: 'realtime:slappy-race-' + code, helloT: 0 });
  let ws;
  try { ws = new WebSocket(LB_URL.replace(/^http/, 'ws').replace(/\/$/, '') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(LB_KEY) + '&vsn=1.0.0'); }
  catch { race.err = 'CANNOT CONNECT'; return; }
  race.ws = ws; let ref = 1;
  ws.onopen = () => {
    ws.send(JSON.stringify({ topic: race.topic, event: 'phx_join', ref: String(ref++), join_ref: '1',
      payload: { config: { broadcast: { self: false, ack: false }, presence: { key: '' }, private: false } } }));
    race.hb = setInterval(() => { if (ws.readyState === 1) ws.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(ref++) })); }, 25000);
  };
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.topic !== race.topic) return;
    if (m.event === 'phx_reply' && !race.joined) {
      if (m.payload && m.payload.status === 'ok') { race.joined = true; raceHello(); }
      else race.err = 'CANNOT JOIN ROOM';
    } else if (m.event === 'phx_error' || m.event === 'phx_close') race.err = 'CONNECTION LOST';
    else if (m.event === 'broadcast' && m.payload) raceMsg(m.payload.event, m.payload.payload || {});
  };
  ws.onerror = () => { if (!race.err) race.err = 'CANNOT CONNECT'; };
  ws.onclose = () => { if (race.ws === ws) { race.joined = false; if (!race.err) race.err = 'CONNECTION LOST'; raceCheckEnd(); } };
}

  const ws = race.ws; race.ws = null; race.joined = false; clearInterval(race.hb);
  if (ws) { try { if (ws.readyState === 1) ws.send(JSON.stringify({ topic: race.topic, event: 'broadcast', ref: null, payload: { type: 'broadcast', event: 'leave', payload: { id: player.id } } })); ws.close(); } catch {} }

function raceHello() { race.helloT = performance.now(); raceSend('hello', { name: player.name, role: race.role, skin: equipped().id }); }
function raceMsg(ev, d) {
  const o = race.opp;
  if (o && d.id && d.id !== o.id) return;                       // a third phone in the room: ignore it
  if (ev === 'hello' || ev === 'hi') {
    if (!o) race.opp = { id: d.id, name: cleanName(d.name) || 'PLAYER', d: 0, y: 240, r: 0, s: 0, done: false, left: false, ready: false, recvAt: performance.now(), dy: 240 };
    else { o.name = cleanName(d.name) || o.name; o.left = false; }
    race.opp.skin = SKINS.some(k => k.id === d.skin) ? d.skin : null;
    if (ev === 'hello') raceSend('hi', { name: player.name, role: race.role, skin: equipped().id });
    if (!o) { sfx('blip', true); if (race.auto && race.role === 'host' && race.phase === 'off') setTimeout(raceHostStart, 900); }   // challenge: go
  } else if (!o) return;
  else if (ev === 'start' && race.role === 'guest') raceStart(d.seed);
  else if (ev === 'pos') { Object.assign(o, { d: d.d, y: d.y, r: d.r, s: d.s, recvAt: performance.now() }); }
  else if (ev === 'dead') { if (!o.done) { o.done = true; o.d = d.d; o.s = d.s; o.y = d.y ?? o.y; raceCheckEnd(); } }
  else if (ev === 'rematch') { o.ready = true; if (race.role === 'host' && race.readyMe) raceHostStart(); }
  else if (ev === 'leave') {

// --- flow
function openRace() { if (!RACE_ON || !settingsAllowed()) return; race.panel = 'lobby'; race.role = null; race.err = ''; race.auto = false; race.invitee = null; notesPage = -1; sfx('blip', true); }
function raceCreate() {
  const A = 'ABCDEFGHJKMNPQRSTUVWXYZ'; let c = ''; for (let i = 0; i < 4; i++) c += A[Math.random() * A.length | 0];

  } else if (race.phase === 'run' && !race.myDone && tick % 6 === 0)
    raceSend('pos', { d: Math.round(race.myDist), y: Math.round(bird.y), r: +bird.rot.toFixed(2), s: score });
  if (race.panel === 'lobby' && race.joined && !race.opp && performance.now() - race.helloT > 1500) raceHello();

// --- the shared channel: who's online, friend pings and race challenges
const SOCIAL_TOPIC = 'realtime:slappy-social';
function socialSend(event, payload = {}) {
  const ws = fr.ws; if (!ws || ws.readyState !== 1 || !fr.joined) return;
  ws.send(JSON.stringify({ topic: SOCIAL_TOPIC, event: 'broadcast', ref: null,
    payload: { type: 'broadcast', event, payload: Object.assign({ from: player.id }, payload) } }));
}
function socialConnect() {
  if (!RACE_ON || fr.ws || document.hidden) return;
  let ws;
  try { ws = new WebSocket(LB_URL.replace(/^http/, 'ws').replace(/\/$/, '') + '/realtime/v1/websocket?apikey=' + encodeURIComponent(LB_KEY) + '&vsn=1.0.0'); }
  catch { return; }
  fr.ws = ws; let ref = 1;
  ws.onopen = () => {
    ws.send(JSON.stringify({ topic: SOCIAL_TOPIC, event: 'phx_join', ref: String(ref++), join_ref: '1',
      payload: { config: { broadcast: { self: false, ack: false }, presence: { key: player.id }, private: false } } }));
    fr.hb = setInterval(() => { if (ws.readyState === 1) ws.send(JSON.stringify({ topic: 'phoenix', event: 'heartbeat', payload: {}, ref: String(ref++) })); }, 25000);
  };
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch { return; }
    if (m.topic !== SOCIAL_TOPIC) return;
    if (m.event === 'phx_reply' && !fr.joined && m.payload && m.payload.status === 'ok') {
      fr.joined = true;
      ws.send(JSON.stringify({ topic: SOCIAL_TOPIC, event: 'presence', ref: String(ref++), payload: { type: 'presence', event: 'track', payload: { name: player.name } } }));
    } else if (m.event === 'presence_state') fr.online = new Set(Object.keys(m.payload || {}));
    else if (m.event === 'presence_diff') {
      for (const k in (m.payload && m.payload.joins) || {}) fr.online.add(k);
      for (const k in (m.payload && m.payload.leaves) || {}) fr.online.delete(k);
    } else if (m.event === 'broadcast' && m.payload) socialMsg(m.payload.event, m.payload.payload || {});
  };
  ws.onclose = () => { if (fr.ws === ws) { fr.ws = null; fr.joined = false; clearInterval(fr.hb); fr.online = new Set(); setTimeout(socialConnect, 5000); } };
}
function socialDisconnect() { const ws = fr.ws; fr.ws = null; fr.joined = false; clearInterval(fr.hb); fr.online = new Set(); try { ws && ws.close(); } catch {} }
function socialMsg(ev, d) {
  if (d.to !== player.id) return;                   // everything here is addressed to one player
  if (ev === 'freq') frLoad();
  else if (ev === 'invite' && isFriend(d.from) && /^[A-Z]{4}$/.test(d.code || '')) {
    fr.invite = { from: d.from, name: cleanName(d.name) || 'A FRIEND', skin: SKINS.some(k => k.id === d.skin) ? d.skin : 'rookie', code: d.code, t: performance.now() };
    sfx('token');
  } else if (ev === 'uninvite' && fr.invite && fr.invite.from === d.from) fr.invite = null;
  else if (ev === 'decline' && race.invitee && race.invitee.id === d.from && !race.opp) race.err = race.invitee.name + ' SAID NO';
}

function ensureDaily() {  // today's challenges (rolled the first time they're needed each day)

  // names are unique: ask the server first, so a taken name can be refused right here

}

function drawBoom(b) {

// Slot machine screen. Stacked top to bottom: CONTINUE? header with a countdown badge, the cabinet,

function drawSlot() {

  const top = Math.min(ky, 120), bot = Math.max(ky, 120);

  pcircle(mx + lx + 2, my + ky, 12, ol); pcircle(mx + lx + 2, my + ky, 10, '#e0203a'); pcircle(mx + lx, my + ky - 2, 4, '#ff8a9a');

  if (!party) {
    const dy = Math.round(s.btnD * 5), BR = (x, y, w, h, c) => { g.fillStyle = c; g.fillRect(bx + x, by + y, w, h); };
    const rrB = (x, y, w, h, c, cut) => { BR(x + cut, y, w - cut * 2, h, c); BR(x, y + cut, w, h - cut * 2, c); BR(x + cut / 2, y + cut / 2, w - cut, h - cut, c); };

    if (can && s.t > 30) {                                                  // pointing hand taps the button

      if (tap) { g.fillStyle = '#fff'; g.fillRect(hx - 6, hy - 6, 2, 6); g.fillRect(hx + 4, hy - 10, 2, 6); g.fillRect(hx + 14, hy - 6, 2, 6); }
      g.drawImage(HAND, hx - 4, hy, 24, 24);

  if (s.phase === 'idle') text(tokens > 0 ? 'COSTS 1 TOKEN' : 'COSTS 50 COINS', LW / 2, ty, 2, '#c8bcd0', '#000', 0);
  else if (s.phase === 'result') bigText(s.msg, LW / 2, ty - 6, 3, s.res === 'win' ? '#ffe14d' : '#fca048', s.res === 'win' ? '#f0a020' : '#e06010');
  else if (party) {
    const cols = ['#ffe14d', '#fff', '#ff8a9a'];

  }
  if (idle && s.t > 30)

  for (const b of buttons.slice(nb)) { b.x = fx + (b.x - fx) * z; b.y = fy + (b.y - fy) * z; b.w *= z; b.h *= z; }

function drawBoss() {
  const b = boss, f = bossFrames(b.def);
  const open = b.charge > 0 || b.steps.length || b.phase === 'dying' ? 1 : 0, up = (b.t >> 3) & 1;
  const fr = f[open][up], S = b.def.S, w = 24 * S, h = 20 * S;

  g.drawImage(b.flash > 0 && (b.flash >> 1) & 1 ? fr.white : fr.img, -w / 2, -h / 2, w, h);
  g.restore();

    const m = bossMouth(), k = 1 - b.charge / b.chargeLen, r = Math.round((4 + k * 10) / 2) * 2;
    pcircle(m.x | 0, m.y | 0, r + 4, (tick >> 1) & 1 ? '#ff3a1a' : '#ffb040');

}

function drawBossHUD() {
  if (boss && !(boss.phase === 'warn' && boss.t < 60)) {
    const w = wide ? 360 : 220, x = Math.round((LW - w) / 2), y = 440;   // on the ground strip
    const jx = boss.flash > 0 ? Math.round((Math.random() - .5) * 6) : 0;
    text(boss.name, LW / 2 + jx, y - 22, 2, '#fff', '#1a1020');

    const hw = Math.round(w * Math.max(0, boss.hp) / boss.maxHp);

    g.fillStyle = '#ff9aa8'; g.fillRect(x + jx, y, hw, 2);

function drawBanner() {   // a compact pill under the score: says what's new without hiding the pipes
  const b = banner; if (!b) return;
  const k = Math.min(1, b.t / 8, (b.life - b.t) / 12), e = 1 - (1 - k) ** 3, warn = b.kind === 'warning';
  const sc = Math.max(1, Math.min(3, Math.floor((LW - 48) / (tr(b.text).length * 6))));
  const w = Math.max(tw(b.text, sc), b.sub ? tw(b.sub) : 0) + 28, h = b.sub ? 50 : 34;
  let y = (wide ? 86 : 72) + (raceOn() && race.opp ? (wide ? 30 : 36) : 0) + (toasts.length ? 62 : 0);
  y = Math.round((y - (1 - e) * 14) / 2) * 2;
  const x = Math.round((LW - w) / 2 / 2) * 2;
  const near = state === 'play' && bird.y > y - 30 && bird.y < y + h + 30;   // never hide the bird's path
  g.globalAlpha = e * (near ? 0.35 : 1);
  g.fillStyle = 'rgba(28,16,40,0.22)'; g.fillRect(x + 3, y + 4, w, h);
  g.fillStyle = warn ? 'rgba(120,0,20,0.72)' : b.kind === 'victory' ? 'rgba(40,24,70,0.66)' : 'rgba(30,20,44,0.55)';
  g.fillRect(x, y, w, h);
  g.fillStyle = warn ? '#ff5a4a' : b.kind === 'victory' ? '#ffd23f' : 'rgba(255,248,216,0.7)';
  g.fillRect(x, y, w, 2); g.fillRect(x, y + h - 2, w, 2);
  if (warn) {                                   // thin scrolling hazard stripes on both ends
    g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
    for (const ex of [x, x + w - 10]) {
      g.fillStyle = '#1a1020'; g.fillRect(ex, y, 10, h);
      g.fillStyle = '#ffd23f';
      for (let yy = y - 12 + (b.t % 12); yy < y + h; yy += 12) for (let r = 0; r < 5; r++) g.fillRect(ex + r * 2, yy + r * 2, 2, 4);
    }
    g.restore();
  }
  if (!warn || (b.t >> 3) % 4 !== 3) text(b.text, LW / 2, y + 7, sc, warn ? '#fff' : '#ffd23f', '#1a1020', 2);
  if (b.sub) text(b.sub, LW / 2, y + 7 + sc * 7 + 6, 2, '#fff', '#1a1020');
  if (warn && b.t > 40 && bossesBeaten < 2) {
    const hint = bossesBeaten === 0 ? (TOUCH ? 'TAP TO HIT THEM BACK!' : 'SLAP ITS FIREBALLS BACK!') : 'ONLY PINK ONES BOUNCE!';
    text(hint, LW / 2, y + h + 8, 2, '#fff', bossesBeaten === 0 ? '#c2310c' : '#c0208a');
  }
  g.globalAlpha = 1;
}

// Everything drawn between beginForeground() and endForeground() casts a soft drop shadow onto the
// background: the layer is tinted dark, drawn twice slightly offset (a cheap soft edge), then the layer itself.
function beginForeground(sx, sy) {
  g = fgx;
  fgx.setTransform(1, 0, 0, 1, 0, 0); fgx.clearRect(0, 0, fgLayer.width, fgLayer.height);
  fgx.setTransform(2, 0, 0, 2, sx * 2, (TOP + sy) * 2);
}
function endForeground() {
  g = gMain;
  shx.globalCompositeOperation = 'copy'; shx.drawImage(fgLayer, 0, 0);
  shx.globalCompositeOperation = 'source-in'; shx.fillStyle = '#1c1028'; shx.fillRect(0, 0, shLayer.width, shLayer.height);
  shx.globalCompositeOperation = 'source-over';
  g.save(); g.setTransform(1, 0, 0, 1, 0, 0);
  g.globalAlpha = 0.13; g.drawImage(shLayer, 10, 12);
  g.globalAlpha = 0.17; g.drawImage(shLayer, 6, 7);
  g.globalAlpha = 1; g.drawImage(fgLayer, 0, 0);

}
const uiShadow = (x, y, w, h) => { g.fillStyle = 'rgba(28,16,40,0.28)'; g.fillRect(x + 3, y + 4, w, h); };

function draw() {
  buttons = []; topCol = SKY_RGB.slice();
  g.save();
  const sx = shake ? Math.round((Math.random() - .5) * shake) : 0, sy = shake ? Math.round((Math.random() - .5) * shake) : 0;
  if (shake) g.translate(sx, sy);

  // background (tiled, slow parallax)
  const bx = -Math.round(bgX / 2) * 2;
  for (let x = bx; x < LW; x += 288) g.drawImage(bg, x, 0, 288, 400);
  g.fillStyle = '#4ec0ca'; g.fillRect(-10, -TOP - 10, LW + 20, TOP + 10);

  // ground (drawn before the foreground so shadows fall onto it)
  const gx = -Math.round(groundX / 2) * 2;
  for (let x = gx; x < LW; x += 312) g.drawImage(ground, x, GY, 312, 112);
  if (LH + OVER > 512) { g.fillStyle = '#ded895'; g.fillRect(-10, 512, LW + 20, LH + OVER - 502); }
  if (state === 'revive') drawBeam();

  beginForeground(sx, sy);
  g.save(); g.beginPath(); g.rect(-20, -TOP - 20, LW + 40, GY + TOP + 20); g.clip();   // pipes tuck behind the ground
  for (const p of pipes) {
    const x = Math.round(p.x / 2) * 2;
    const t = Math.max(0, Math.min(1, p.intro / INTRO)), e = 1 - (1 - t) ** 3;   // ease-out grow-in
    if (t <= 0) continue;
    const up = Math.round((1 - e) * (p.y0 + 40) / 2) * 2, dn = Math.round((1 - e) * (GY - p.y1 + 40) / 2) * 2;
    const pal = PIPE_PALS[p.kind], teeth = p.kind === 'chomp';
    if (p.ang) {                                   // angled pipes lean around the middle of their gap
      const cx = x + 24, cy = (p.y0 + p.y1) / 2;
      g.save(); g.translate(cx, cy); g.rotate(p.ang); g.translate(-cx, -cy);
    }
    drawPipe(x, (p.ang ? -420 : -10) - up, Math.round(p.y0 / 2) * 2 - up, true, pal, teeth);
    drawPipe(x, Math.round(p.y1 / 2) * 2 + dn, GY + (p.ang ? 300 : 0) + dn, false, pal, teeth);
    if (p.kind === 'split' && e > 0.5) {           // the floating block between the two lanes

      drawPipe(x, b0, b1, true, pal); drawPipe(x, b0, b0 + 24, false, pal);
      g.globalAlpha = 1;

    if (p.ang) g.restore();
  }
  drawGoals();
  g.restore();

  for (const c of coins) if (c.token) drawToken(c); else if (!c.pipe || c.pipe.intro >= INTRO) drawCoin(c);
  if (boss) drawBoss();
  for (const s of shots) drawShot(s);

  for (const p of sparks) { g.fillStyle = p.col; const z = p.sz * (p.life > 6 ? 1 : 0.5); g.fillRect(Math.round(p.x / 2) * 2, Math.round(p.y / 2) * 2, Math.max(2, z), Math.max(2, z)); }
  for (const b of booms) drawBoom(b);
  for (const r of rings) pring(r.x, r.y, r.r, r.col);
  if (shots.some(s => s.inRange && !s.refl) && state === 'play') {
    pring(BIRD_X, bird.y, 22 + Math.sin(tick * 0.6) * 3, (tick >> 2) & 1 ? '#ffe14d' : '#fff');
    if (bossesBeaten === 0 && parries < 3) text(ACT + ' NOW!', BIRD_X, bird.y - 44, 2, '#fff', '#c2310c');
  }

  if (trail.length) drawTrailParts(equippedTrail(), trail);
  // feathers + bird
  g.fillStyle = '#fdf6c4';
  for (const f of feathers) g.fillRect(Math.round(f.x / 2) * 2, Math.round(f.y / 2) * 2, 4, 2);
  const frame = state === 'over' || (state !== 'ready' && bird.rot > 1.2) ? 1 : [0, 1, 2, 1][(tick / 5 | 0) % 4];
  if (!(bird.inv > 0 && (tick >> 2) & 1)) {
    g.save(); g.translate(BIRD_X, Math.round(bird.y)); g.rotate(bird.rot);
    g.drawImage(skinFrame(equipped().id, frame), -18, -12, 36, 24);
    if (state === 'revive' && rev.t > 20) { g.globalAlpha = 0.3 + 0.25 * Math.sin(tick * 0.3); g.drawImage(birdWhite, -18, -12, 36, 24); g.globalAlpha = 1; }
    g.restore();
  }
  if ((state === 'revive' && rev.t > 30) || (halo > 0 && (halo > 40 || (tick >> 2) & 1))) drawHalo(BIRD_X, Math.round(bird.y) - 22);
  skinFX(equipped(), BIRD_X, bird.y);
  if (raceOn()) drawRaceGhost();
  endForeground();
  drawConfetti();
  if (hover > 0 && state === 'play') {
    const k = hover / HOVER_MAX, bw = 80, bx = BIRD_X - bw / 2, by = Math.round(bird.y) + 24;
    if ((tick / 20 | 0) % 2 === 0) text(TOUCH ? 'TAP TO FLY' : 'FLAP TO FLY', clamp(BIRD_X, 70, LW - 70), Math.round(bird.y) - 46, 2, '#fff', '#543847');
    g.fillStyle = '#543847'; g.fillRect(bx - 2, by - 2, bw + 4, 8);                    // time left before falling
    g.fillStyle = '#fff4a0'; g.fillRect(bx, by, Math.round(bw * k), 4);
  }

  for (const p of popups) { g.globalAlpha = Math.min(1, p.life / 12); const hw = tw(p.s, p.sc) / 2 + 6; text(p.s, clamp(p.x, hw, LW - hw), p.y, p.sc, p.fill, p.ol); }
  g.globalAlpha = 1;

  if (TOP > 0) {                       // under the status bar: the world dissolves into plain sky
    const fg = g.createLinearGradient(0, -TOP, 0, 8);
    fg.addColorStop(0, '#4ec0ca'); fg.addColorStop(0.6, '#4ec0ca'); fg.addColorStop(1, 'rgba(78,192,202,0)');
    g.fillStyle = fg; g.fillRect(-10, -TOP - 10, LW + 20, TOP + 18);
  }

  // HUD
  if (wide) drawWideHUD(); else drawCompactHUD();
  if (state === 'play' || state === 'dying') drawBossHUD();
  if (state === 'slot' || (state === 'revive' && rev.t < 30)) drawSlot();
  drawBanner();
  if (toasts.length) drawToasts();   // above the HUD so the score never covers it
  if (notesPage >= 0 && state === 'ready') drawNotes();
  if (settingsOpen) drawSettings();
  if (settingsOpen && langOpen) drawLangPicker();
  if (lb.open) drawLB();
  if (race.panel) drawRacePanel();
  if (skinsUI.open) drawSkins();
  if (dailyUI.open) drawDaily();
  if (fr.open) drawFriends();
  if (inviteShown()) drawInvite();
  if (a2hs.open) drawA2HS();
  if (nameBoxOpen) drawNameBox();
  if (paused && resumeT) {
    const n = Math.ceil(resumeT / COUNT_STEP), t = COUNT_STEP - 1 - (resumeT - 1) % COUNT_STEP;   // t: 0..44 within each number
    const big = wide ? 14 : 12, sc = t < 6 ? big + 6 - t : big;                                  // pops in, then settles
    g.fillStyle = `rgba(20,12,24,${0.15 + 0.1 * n})`; cover();
    g.globalAlpha = t > COUNT_STEP - 10 ? (COUNT_STEP - t) / 10 : 1;
    bigText(n, LW / 2, 200 - sc * 3.5, sc);
    g.globalAlpha = 1;
    bigText('GET READY!', LW / 2, 274, 3);
  } else if (paused) {
    g.fillStyle = 'rgba(20,12,24,0.45)'; cover();
    bigText('PAUSED', LW / 2, 190, wide ? 6 : 5);
    if ((performance.now() / 400 | 0) % 2 === 0) text(TOUCH ? 'TAP TO RESUME' : 'SLAP OR SPACE TO RESUME', LW / 2, 260, 2, '#fff', '#543847');
  }
  g.restore();

  if (flash) { g.fillStyle = `rgba(255,255,255,${flash})`; cover(); }
  if (hurtFlash) { g.fillStyle = `rgba(255,40,60,${hurtFlash * 0.5})`; cover(); }
  if (fade) { g.fillStyle = `rgba(0,0,0,${fade})`; cover(); }
}

// ============================================================ CRT post-processing (WebGL)
const screen = document.getElementById('screen');

    uniform sampler2D t; uniform float crt; uniform vec2 lsize; varying vec2 uv;
    uniform vec4 lp[${MAX_LIGHTS}]; uniform vec3 lc[${MAX_LIGHTS}]; uniform float ln; uniform float amb;
    vec3 s(vec2 q){ return texture2D(t,q).rgb; }
    // Dynamic point lights (lp: x, y, radius in logical px, intensity). Surfaces in range are
    // tinted and brightened by the light colour, and a soft additive halo blooms around the source.
    vec3 lit(vec2 q, vec3 c){
      vec2 P = q*lsize; vec3 tint = vec3(0.), glow = vec3(0.);
      for (int i=0;i<${MAX_LIGHTS};i++){
        if (float(i) >= ln) break;
        vec2 d = P - lp[i].xy; float f = max(0., 1. - length(d)/lp[i].z);
        float f2 = f*f;
        tint += lc[i]*f2*lp[i].w;

      }

    }
    void main(){

        float ca = .0018;
        vec3 b = vec3(0.); vec2 px = 2.4/lsize;
        for (int i=-1;i<=1;i++) for (int j=-1;j<=1;j++) b += s(uv+vec2(float(i),float(j))*px);
        c = vec3(s(uv+vec2(ca,0.)).r, c.g, s(uv-vec2(ca,0.)).b)*.88 + (b/9.)*.32;
      }

    uniform sampler2D f; uniform float crt; uniform vec2 lsize; uniform float curv; varying vec2 uv;
    vec2 curve(vec2 p){ p = p*2.-1.; vec2 o = abs(p.yx)/vec2(5.5,4.2); p += p*o*o*curv; return p*.5+.5; }
    vec3 P(vec2 q){ return texture2D(f, vec2(q.x, 1.-q.y)).rgb * ${HDR.toFixed(2)}; }
    void main(){
      if (crt < .5) { gl_FragColor = vec4(P(uv),1.); return; }
      vec2 q = curve(uv);
      if (q.x<0.||q.x>1.||q.y<0.||q.y>1.) { gl_FragColor = vec4(0.,0.,0.,1.); return; }
      vec3 c = P(q);

function gatherLights() {

    addLight(b.x, b.y, b.r * 3.2, 1.3 * k, k > 0.6 ? [1, 0.9, 0.7] : [1, 0.55, 0.2]);
  }
  if (boss && boss.charge > 0 && boss.phase === 'fight') {               // the boss winding up
    const m = bossMouth(), k = 1 - boss.charge / boss.chargeLen;
    addLight(m.x, m.y, 50 + 110 * k, (0.4 + 0.9 * k) * pulse, [1, 0.45, 0.15]);
  }
  if (state === 'revive' && rev) {                                       // heavenly beam
    const t = rev.t, k = t < 20 ? t / 20 : t > 96 ? Math.max(0, 1 - (t - 96) / 16) : 1;
    addLight(BIRD_X, bird.y, 170, 0.8 * k, [1, 0.92, 0.6]);
  }
  if (halo > 0) addLight(BIRD_X, bird.y - 22, 46, 0.35, [1, 0.88, 0.3]);
  for (const sh of shots) {                                              // glowing projectiles
    if (sh.refl) addLight(sh.x, sh.y, 80, 0.75 * pulse, [1, 0.88, 0.3]);
    else addLight(sh.x, sh.y, sh.pink ? 64 : 56, (sh.pink ? 0.6 : 0.5) * pulse, LIGHT_COLS[sh.col] || [1, 0.5, 0.2]);
  }
  for (const c of coins) {
    if (c.token) addLight(c.x, c.y, 58, 0.55 * pulse, [0.8, 0.4, 1]);
    else if (c.letter) addLight(c.x, c.y, 54, 0.5 * pulse, [0.6, 0.5, 1]);
    else if (c.big && (!c.pipe || c.pipe.intro >= INTRO)) addLight(c.x, c.y, 40, 0.3 * pulse, [1, 0.85, 0.35]);
  }
  for (const r of rings) addLight(r.x, r.y, r.r + 30, 0.25, [1, 0.95, 0.75]);
  if (slot && slot.cx != null && (state === 'slot' || state === 'revive')) {   // slot machine: the jackpot goes off
    const s = slot, z = s.z || 1, X = x => s.cx + (x - s.cx) * z, reelX = i => X(s.cx - 106 + 47 + i * 59), ry = s.cy;
    if (s.phase === 'spin' && s.suspense && s.reels[1].done) {        // a red glow building on the last reel
      const r = s.reels[2], k = Math.min(1, (r.t - r.T1 + 40) / (r.Td + 40));
      addLight(reelX(2), ry, 50 + 40 * k, (0.2 + 0.5 * k) * pulse, [1, 0.3, 0.35]);
    }
    if (s.phase === 'jackpot' || (state === 'revive' && s.res === 'jackpot')) {
      const t = s.jt, k = Math.max(0, 1 - t / 40), fade = state === 'revive' ? Math.max(0, 1 - rev.t / 30) : 1;
      if (k > 0) addLight(s.cx, ry, 140 + 160 * k, 1.6 * k * k, k > 0.6 ? [1, 0.95, 0.85] : [1, 0.75, 0.45]);   // the blast
      for (let i = 0; i < 3; i++) addLight(reelX(i), ry, 60, (0.28 + 0.12 * Math.sin(tick * 0.4 + i * 2)) * fade, [1, 0.15, 0.25]);
      const on = (tick >> 2) & 1;                                       // marquee bulbs flashing
      addLight(s.cx - 80 * z, s.cy - 84 * z, 60, (on ? 0.6 : 0.2) * fade, [1, 0.85, 0.4]);
      addLight(s.cx + 80 * z, s.cy - 84 * z, 60, (on ? 0.2 : 0.6) * fade, [1, 0.85, 0.4]);

    }
  }
  const TL = TRAIL_LIGHT[equippedTrail()];                              // glowing trails: a few lights along the stream
  if (TL && trail.length && state !== 'over') {
    const pts = equippedTrail() === 'lightning' ? trail.filter(q => q.bolt) : trail;
    for (const f of [1, 0.6, 0.25]) {
      const q = pts[Math.min(pts.length - 1, Math.floor(pts.length * f))]; if (!q) continue;
      const fl = TL.flicker ? (Math.random() < 0.25 ? 0.3 : 1) : 1;
      addLight(q.x, q.y, TL.r * (0.7 + 0.3 * f), TL.k * f * fl * Math.min(1, (q.life - q.t) / 10), typeof TL.c === 'function' ? TL.c() : TL.c);
    }
  }
  const sk = equipped();                                                // glowing skins light up their surroundings
  if (sk.glow && state !== 'over') addLight(BIRD_X, bird.y, sk.tier === 'dev' ? 78 : 64, (sk.tier === 'dev' ? 0.6 : 0.42) + 0.12 * Math.sin(tick * 0.12), sk.glow);
  for (const f of flashes) {                                           // finish line burst: hot flash, warm fade
    const k = 1 - f.t / f.life, e = k * k;
    addLight(f.x, f.y, (f.big ? 175 : 140) * (0.6 + 0.4 * k), 0.95 * e, k > 0.7 ? [1, 0.95, 0.85] : [1, 0.8, 0.5]);
  }
  for (const c of confetti) if (c.glint) {                              // glinting confetti, brightest when face-on
    const face = Math.abs(Math.cos(c.rot)), fade = Math.min(1, c.life / 40);
    addLight(c.x, c.y, 30, 0.32 * face * face * fade, c.rgb);
  }
  // during a boss fight the world dims a touch, so the fireworks read
  const target = boss && boss.phase !== 'warn' && (state === 'play' || state === 'dying') ? 0.86 : 1;
  ambient += (target - ambient) * 0.04;
}

function present() {
  if (gl) {
    gatherLights();
    if (fboW !== game.width || fboH !== game.height) {   // (re)allocate the half-way buffer at game resolution
      fboW = game.width; fboH = game.height;
      gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, fboTex);
      gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, fboW, fboH, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex, 0);
    }
    // pass 1: game pixels -> glow + lights

    gl.useProgram(progA);
    gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, gameTex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, game);
    gl.uniform4fv(uA.lp, lightP); gl.uniform3fv(uA.lc, lightC);
    gl.uniform1f(uA.ln, lightN); gl.uniform1f(uA.amb, ambient);
    gl.uniform1f(uA.crt, crtOn ? 1 : 0); gl.uniform2f(uA.lsize, LW, LH + TOP + OVER);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    // pass 2: full resolution CRT finish
    gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, screen.width, screen.height);
    gl.useProgram(progB);
    gl.uniform1f(uB.crt, crtOn ? 1 : 0); gl.uniform2f(uB.lsize, LW, LH + TOP + OVER); gl.uniform1f(uB.curv, TOUCH ? 0 : wide ? 0.55 : 1);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  } else {
    ctx2d.imageSmoothingEnabled = false; ctx2d.drawImage(game, 0, 0, screen.width, screen.height);
  }
}

function layout() {
  if (TOUCH) {                             // fill the whole screen; the HUD stays below the status bar
    // The play area is sized from the visible screen below the status bar, exactly as before; the
    // canvas then grows upward (sky under the status bar) and downward (ground past the bottom edge).
    visH = screenHeight();
    const mon = document.getElementById('monitor');
    const inset = parseFloat(getComputedStyle(document.getElementById('safe')).paddingTop) || 0;
    let w = Math.ceil(mon.getBoundingClientRect().width);
    const ph = Math.max(1, visH - inset);  // play area height in CSS px
    let lw = LH_BASE * w / ph, lh = LH_BASE;
    if (lw < LW_MIN) { lw = LW_MIN; lh = Math.min(720, LW_MIN * ph / w); }
    if (lw > 1200) { lw = 1200; w = Math.floor(lw * ph / lh); }   // ultra-wide: pillarbox
    const s = lw / w, top = inset * s;      // logical px per CSS px
    lh = Math.max(lh, ph * s);              // taller than the cap: the ground just runs further down

    resizeGame(lw, lh, top, (ch - inset) * s - lh);

  }

    if (w / h < LW_MIN / LH_BASE) h = w * LH_BASE / LW_MIN;
    if (w / h > 2.4) w = h * 2.4;
  }
  w = Math.floor(w); h = Math.floor(h);
  screen.style.width = w + 'px'; screen.style.height = h + 'px';
  const k = Math.min(devicePixelRatio, 2600 / w);   // cap backing size for the CRT pass

const LW_MIN = 288, LH_BASE = 512, OVERHANG = 120;   // CSS px of canvas below the screen edge
let visH = innerHeight;
// iOS Home Screen apps can report a viewport shorter than the physical screen, leaving a black
// "chin" at the bottom. When that happens, size the page to the real screen and let it overflow there.
// The real screen height: Home Screen apps can report a viewport shorter than the screen.
function screenHeight() {

  if (STANDALONE) {
    const portrait = matchMedia('(orientation: portrait)').matches, sw = window.screen.width, sh = window.screen.height;
    h = Math.max(h, portrait ? Math.max(sw, sh) : Math.min(sw, sh));

}
window.setFullscreen = on => { fullscreen = on; document.body.classList.toggle('fs', on); layout(); };
addEventListener('resize', layout); layout();
if (TOUCH) {   // iOS reports the final size late after launch / rotation
  addEventListener('orientationchange', () => setTimeout(layout, 300));
  if (window.visualViewport) visualViewport.addEventListener('resize', layout);
  addEventListener('pageshow', layout); setTimeout(layout, 300);
}

// ============================================================ input
addEventListener('keydown', e => {
  if (nameBoxOpen) { if (e.code === 'Escape') closeNameBox(false); return; }   // typing a name
  audioInit();
  const k = e.code;
  if (lb.open && (k === 'ArrowUp' || k === 'ArrowDown')) { e.preventDefault(); lbScrollBy(k === 'ArrowUp' ? -LB_ROW * 2 : LB_ROW * 2); }
  else if (['Space', 'ArrowUp', 'KeyW', 'Enter'].includes(k)) { e.preventDefault(); if (!e.repeat) flap('key'); }
  else if (notesPage >= 0 && (k === 'ArrowLeft' || k === 'ArrowRight')) { e.preventDefault(); flipNotes(k === 'ArrowLeft' ? -1 : 1); }
  else if (k === 'ArrowLeft' || k === 'Minus' || k === 'BracketLeft') { e.preventDefault(); setSens(-1); }
  else if (k === 'ArrowRight' || k === 'Equal' || k === 'BracketRight') { e.preventDefault(); setSens(1); }
  else if (k === 'KeyM') toggleMute();
  else if (k === 'KeyC') toggleCrt();
  else if (k === 'KeyS') { if (settingsOpen) closeSettings(); else openSettings(); }
  else if (k === 'KeyL' && LB_ON) { if (lb.open) closeLB(); else openLB(); }
  else if (k === 'KeyR' && RACE_ON && !raceOn() && !race.panel) openRace();
  else if (k === 'KeyK') { if (skinsUI.open) closeSkins(); else openSkins(); }
  else if (k === 'KeyD') { if (dailyUI.open) closeDaily(); else openDaily(); }
  else if (k === 'KeyF' && !e.metaKey) { native('fullscreen'); }
  else if (k === 'Escape') { if (notesPage >= 0) closeNotes(); else if (race.panel === 'lobby') raceLeave(); else if (a2hs.open) closeA2HS(); else if (skinsUI.open) closeSkins(); else if (dailyUI.open) closeDaily(); else if (fr.open) closeFriends(); else if (settingsOpen) closeSettings(); else if (lb.open) closeLB(); else if (fullscreen) native('exitFullscreen'); else setPaused(true); }
  else if (k === 'KeyP') { setPaused(!paused || resumeT > 0); }
  else if (k === 'KeyX' && state === 'slot' && slot.phase !== 'spin' && slot.phase !== 'jackpot') giveUp();
  else if (k === 'KeyN' && state === 'ready' && !settingsOpen && !lb.open) { if (notesPage >= 0) closeNotes(); else openNotes(); }
});
// On phones a swipe from the bottom edge (home / app switcher gesture) starts as a touch on the game.
// So on menus, while paused, and for touches starting at the bottom edge, a touch only counts when the
// finger lifts without having slid away. Mid-run flaps elsewhere still fire instantly on touch-down.
let heldTap = null;
const EDGE_PX = 44;   // CSS px at the bottom of the screen where the system gestures start
screen.addEventListener('pointerdown', e => {
  audioInit();
  const r = screen.getBoundingClientRect();
  if (lb.open && lb.list) {                       // grabbing the leaderboard list to scroll it
    const L = lb.list, lx = (e.clientX - r.left) / r.width * LW, ly = (e.clientY - r.top) / r.height * (LH + TOP + OVER) - TOP;
    if (lx >= L.x && lx < L.x + L.w && ly >= L.y && ly < L.y + L.h) lbDrag = { id: e.pointerId, y: e.clientY, s0: lb.scroll[lb.tab] || 0, k: (LH + TOP + OVER) / r.height, last: e.clientY, t: performance.now() };
  }
  const atEdge = visH - e.clientY < EDGE_PX;
  if (TOUCH && e.pointerType !== 'mouse' && (atEdge || state !== 'play' || paused || race.panel || settingsOpen || lb.open || a2hs.open || nameBoxOpen || skinsUI.open || dailyUI.open || fr.open || inviteShown() || notesPage >= 0)) {
    heldTap = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now() };
    return;
  }
  handleTap(e.clientX, e.clientY);
});
screen.addEventListener('pointermove', e => {
  if (lbDrag && lbDrag.id === e.pointerId) {
    const now = performance.now(), dt = Math.max(1, now - lbDrag.t);
    lb.vel = -(e.clientY - lbDrag.last) * lbDrag.k * 16 / dt; lbDrag.last = e.clientY; lbDrag.t = now;
    lb.scroll[lb.tab] = lbDrag.s0 - (e.clientY - lbDrag.y) * lbDrag.k;
  }
  if (heldTap && heldTap.id === e.pointerId && Math.hypot(e.clientX - heldTap.x, e.clientY - heldTap.y) > 12) heldTap = null;   // a swipe, not a tap
});
screen.addEventListener('pointerup', e => {
  if (lbDrag && lbDrag.id === e.pointerId) { if (performance.now() - lbDrag.t > 80) lb.vel = 0; lbDrag = null; }   // a flick keeps gliding
  const h = heldTap; heldTap = null;
  if (!h || h.id !== e.pointerId || document.hidden || Math.hypot(e.clientX - h.x, e.clientY - h.y) > 12 || performance.now() - h.t > 600) return;
  handleTap(h.x, h.y);
});
screen.addEventListener('pointercancel', () => { heldTap = null; lbDrag = null; });
addEventListener('wheel', e => { if (lb.open) { e.preventDefault(); lbScrollBy(e.deltaY * (e.deltaMode ? 22 : 0.5)); } }, { passive: false });
document.addEventListener('visibilitychange', () => { heldTap = null; });
function handleTap(cx, cy) {
  const r = screen.getBoundingClientRect(), x = (cx - r.left) / r.width * LW, y = (cy - r.top) / r.height * (LH + TOP + OVER) - TOP;
  if (nameBoxOpen) {                  // the drawn window: its buttons, a tap outside cancels
    const b = buttons.find(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h);
    if (b) return pressButton(b);
    const q = nbox.rect; if (q && (x < q.x || x >= q.x + q.w || y < q.y || y >= q.y + q.h)) closeNameBox(false);
    return;
  }
  if (TOUCH && paused) return setPaused(false);
  const b = buttons.find(b => x >= b.x && x < b.x + b.w && y >= b.y && y < b.y + b.h);
  if (b) return pressButton(b);
  if (settingsOpen && langOpen) { const q = langRect; if (!q || x < q.x || x >= q.x + q.w || y < q.y || y >= q.y + q.h) { langOpen = false; sfx('blip', false); } return; }
  if (settingsOpen) { const q = settingsRect; if (!q || x < q.x || x >= q.x + q.w || y < q.y || y >= q.y + q.h) closeSettings(); return; }
  if (lb.open) { const q = lb.rect; if (!q || x < q.x || x >= q.x + q.w || y < q.y || y >= q.y + q.h) closeLB(); return; }
  if (race.panel) return;
  if (a2hs.open) { const q = a2hs.rect; if (!q || x < q.x || x >= q.x + q.w || y < q.y || y >= q.y + q.h) closeA2HS(); return; }
  if (notesPage >= 0 && state === 'ready') { const q = notesRect; if (!q || x < q.x || x >= q.x + q.w || y < q.y || y >= q.y + q.h) closeNotes(); return; }
  if (skinsUI.open) { const q = skinsUI.rect; if (!q || x < q.x || x >= q.x + q.w || y < q.y || y >= q.y + q.h) closeSkins(); return; }
  if (dailyUI.open) { const q = dailyUI.rect; if (!q || x < q.x || x >= q.x + q.w || y < q.y || y >= q.y + q.h) closeDaily(); return; }
  if (inviteShown()) return;
  if (fr.open) { const q = fr.rect; if (!q || x < q.x || x >= q.x + q.w || y < q.y || y >= q.y + q.h) closeFriends(); return; }
  flap('click');
}
if (TOUCH) {
  // no scrolling, rubber-banding, double-tap zoom or pinch; unlock audio on the first touch
  for (const t of ['touchstart', 'touchmove', 'gesturestart', 'dblclick'])
    addEventListener(t, e => { if (!(e.target.closest && e.target.closest('#namebox'))) e.preventDefault(); }, { passive: false });
  addEventListener('touchend', () => audioInit());
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { if (race.phase === 'run' && state === 'play') crash(false); }   // leaving mid-race forfeits
    else audioInit();
  });
  // Check for a new version whenever the app comes back to the foreground; once it's installed,
  // reload at the next calm moment (title or game over screen) so a run is never interrupted.
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    const hadSW = !!navigator.serviceWorker.controller;
    navigator.serviceWorker.register('sw.js').then(reg => {
      document.addEventListener('visibilitychange', () => { if (!document.hidden) reg.update().catch(() => {}); });
      setInterval(() => reg.update().catch(() => {}), 5 * 60 * 1000);
    }).catch(() => {});
    navigator.serviceWorker.addEventListener('controllerchange', () => { if (hadSW) updateReady = true; });
  }
}
addEventListener('contextmenu', e => e.preventDefault());
addEventListener('blur', autoPause);
document.addEventListener('visibilitychange', () => { if (document.hidden) autoPause(); });
addEventListener('pagehide', autoPause);
// Safari's Audio Session API reports a ringing call / Siri directly as 'interrupted'.
try { if (navigator.audioSession) navigator.audioSession.addEventListener('statechange', () => { if (navigator.audioSession.state === 'interrupted') autoPause(); }); } catch {}
document.addEventListener('freeze', autoPause);

// ============================================================ main loop (fixed 60Hz simulation)
const STEP = 1000 / 60, led = document.getElementById('led');
let acc = 0, prev = performance.now();
let updateReady = false;
// iOS blurs whatever sits under the status bar and tints it with the page's theme colour. Keep that
// colour matched to the top of the picture so the blurred strip blends in (sky, dark overlays, ...).
const themeMeta = document.querySelector('meta[name="theme-color"]'), statusBar = document.getElementById('statusbar');
let themeCol = '', themeT = 0;
function syncThemeColor() {
  if (!TOUCH || ++themeT % 10) return;
  try {
    const col = '#' + topCol.map(v => Math.round(v).toString(16).padStart(2, '0')).join('');
    if (col !== themeCol) {
      themeCol = col; themeMeta.content = col;
      document.documentElement.style.background = document.body.style.background = statusBar.style.background = col;
    }
  } catch {}
}
function loop(now) {
  if (updateReady && (state === 'ready' || (state === 'over' && overT > 50))) { updateReady = false; location.reload(); }
  if (now - prev > 400) autoPause();   // the page was frozen or starved for a moment (a call, the lock screen, ...)
  acc = Math.min(acc + now - prev, 250); prev = now;
  let stepped = false;
  while (acc >= STEP) { if (resumeT) countdownStep(); else if (!paused) update(); acc -= STEP; stepped = true; }
  if (stepped) {           // nothing moved since the last frame: skip drawing (halves the work on 120Hz screens)
    level *= 0.9;
    draw(); present(); syncThemeColor();
  }
  led.className = sensorLive() ? 'on' : '';
  requestAnimationFrame(loop);
}
{
  const form = document.querySelector('#namebox form');
  form.addEventListener('submit', e => { e.preventDefault(); closeNameBox(true); });   // keyboard Done / Enter
}
if (LB_ON) {
  // one-time: put the best score from before the leaderboard existed on the board
  if (!player.bestSynced) { player.bestSynced = true; if (best > 0) player.pending = Math.max(player.pending, best); save(); }
  lbFlush(); lbLoad(); addEventListener('online', () => { lbFlush(); lbLoad(); });
}
checkSkins(true);   // retroactive unlocks (e.g. from your best score), quietly; a NEW badge shows on SKINS
reset(); fade = 0;
ensureDaily();
if (RACE_ON) {
  frLoad(); socialConnect();
  document.addEventListener('visibilitychange', () => { if (document.hidden) socialDisconnect(); else { socialConnect(); frLoad(); } });
}
loadRun();          // a run that was interrupted by the app being closed
requestAnimationFrame(loop);
</script>
