M TO BEAT IT":"ACERTE O CHEFE COM ELAS PARA VENCÊ-LO","NICE!":"BOA!","EVERY PARRY HITS THE BOSS":"CADA REBATIDA ACERTA O CHEFE","KEEP IT UP TO WIN!":"CONTINUE ASSIM PARA VENCER!","SWIPE NOW!":"DESLIZE AGORA!","BOSS SCHOOL":"ESCOLA DE CHEFES","NEW TO BOSSES? WHEN KING CROW'S FIRST PINK FIREBALL GETS CLOSE, THE CAMERA ZOOMS IN AND WAITS FOR YOUR SWIPE TO PARRY IT. IT SHOWS UP EVERY RUN UNTIL YOU BEAT YOUR FIRST BOSS.":"NOVO COM CHEFES? QUANDO A PRIMEIRA BOLA DE FOGO ROSA DO KING CROW CHEGA PERTO, A CÂMERA DÁ ZOOM E ESPERA VOCÊ DESLIZAR PARA REBATER. APARECE EM TODA PARTIDA ATÉ VOCÊ VENCER SEU PRIMEIRO CHEFE.","TURN YOUR PHONE UPRIGHT":"COLOQUE O CELULAR NA VERTICAL","BENDY FISH":"PEIXE FLEXÍVEL","YOUR FISH NOW BENDS WITH YOUR SWIPES: IT ARCHES WHEN YOU PUSH IT UP AND CURLS WHEN YOU PUSH IT DOWN, THEN WOBBLES BACK. THE HARDER THE SWIPE, THE BIGGER THE BEND.":"SEU PEIXE AGORA SE DOBRA COM OS SEUS DESLIZES: ARQUEIA QUANDO VOCÊ EMPURRA PARA CIMA E SE CURVA PARA BAIXO, DEPOIS VOLTA BALANÇANDO. QUANTO MAIS FORTE O DESLIZE, MAIOR A CURVA.","EYE SPY":"OLHO VIVO","EVERY FISH HAS A CLEARER EYE NOW, IN COLOURS THAT MATCH ITS SKIN. AND JACKPOT IS NOW A LUCKY GOLD FISH WITH A LEVER FOR A FIN AND SPINNING REELS ON ITS SIDE.":"AGORA CADA PEIXE TEM UM OLHO MAIS NÍTIDO, EM CORES QUE COMBINAM COM A SKIN. E O JACKPOT AGORA É UM PEIXE DOURADO DA SORTE COM UMA ALAVANCA NO LUGAR DA NADADEIRA E ROLOS GIRANDO NO LADO.","MAKING WAVES":"FAZENDO ONDAS","THE WATER IS ALIVE: WAVES ROLL AND BOUNCE OFF THE PIPES, MOVING PIPES PUSH THE WATER, SPLASHES POP UP NOW AND THEN AND DROPS RUN DOWN THE PIPES. AND YOU CAN SEE THE PIPES UNDER THE WATER.":"A ÁGUA ESTÁ VIVA: AS ONDAS ROLAM E BATEM NOS CANOS, CANOS QUE SE MEXEM EMPURRAM A ÁGUA, DE VEZ EM QUANDO ESPIRRA ÁGUA E GOTAS ESCORREM PELOS CANOS. E DÁ PARA VER OS CANOS DEBAIXO D'ÁGUA.","SPLASH ZONE":"ZONA DE RESPINGOS","FLY LOW AND PUSH OFF THE WATER TO KICK UP WAVES AND SPRAY, SKIMMING LEAVES A WAKE, AND A FISH THAT DIES IN THE WATER MAKES A BIG SPLASH.":
