AZ SEU PEIXE GIRAR: PARA CIMA UM MORTAL PARA TRÁS, PARA BAIXO PARA FRENTE. UM DESLIZE RÁPIDO E LONGO VIRA ELE, UM GRANDE DUAS VEZES, UM FRACO SÓ BALANÇA. NENHUM MORTAL É IGUAL. SÓ PELO ESTILO: NÃO MUDA NO QUE VOCÊ BATE.","CARTOON CITY":"CIDADE DE DESENHO","A NEW BACKGROUND: WONKY CARTOON SKYSCRAPERS WITH ANTENNAS, AND BIG PUFFY CLOUDS AND BUSHES. AT NIGHT THE WINDOWS LIGHT UP.":"UM FUNDO NOVO: ARRANHA-CÉUS DE DESENHO TORTOS COM ANTENAS, E NUVENS E ARBUSTOS GRANDES E FOFOS. À NOITE AS JANELAS ACENDEM.","RUSTY PIPES":"CANOS ENFERRUJADOS","WHERE THE PIPES COME OUT OF THE WATER THEY ARE RUSTY NOW, WITH BARNACLES STUCK ON. AND THE ANGLED PIPES ARE NO LONGER SEE-THROUGH.":"ONDE OS CANOS SAEM DA ÁGUA AGORA ESTÃO ENFERRUJADOS, COM CRACAS GRUDADAS. E OS CANOS INCLINADOS NÃO SÃO MAIS TRANSPARENTES.","SWIPE NOW TO PARRY!":"DESLIZE AGORA PARA REBATER!","PRESS SPACE TO PARRY!":"APERTE ESPAÇO PARA REBATER!","PINK FIREBALLS CAN BE HIT BACK":"BOLAS DE FOGO ROSA PODEM SER REBATIDAS","HIT THE BOSS WITH THEM TO BEAT IT":"ACERTE O CHEFE COM ELAS PARA VENCÊ-LO","NICE!":"BOA!","EVERY PARRY HITS THE BOSS":"CADA REBATIDA ACERTA O CHEFE","KEEP IT UP TO WIN!":"CONTINUE ASSIM PARA VENCER!","SWIPE NOW!":"DESLIZE AGORA!","BOSS SCHOOL":"ESCOLA DE CHEFES","NEW TO BOSSES? WHEN KING CROW'S FIRST PINK FIREBALL GETS CLOSE, THE CAMERA ZOOMS IN AND WAITS FOR YOUR SWIPE TO PARRY IT. IT SHOWS UP EVERY RUN UNTIL YOU BEAT YOUR FIRST BOSS.":"NOVO COM CHEFES? QUANDO A PRIMEIRA BOLA DE FOGO ROSA DO KING CROW CHEGA PERTO, A CÂMERA DÁ ZOOM E ESPERA VOCÊ DESLIZAR PARA REBATER. APARECE EM TODA PARTIDA ATÉ VOCÊ VENCER SEU PRIMEIRO CHEFE.","TURN YOUR PHONE UPRIGHT":"COLOQUE O CELULAR NA VERTICAL","BENDY FISH":"PEIXE FLEXÍVEL","YOUR FISH NOW BENDS WITH YOUR SWIPES: IT ARCHES WHEN YOU PUSH IT UP AND CURLS WHEN YOU PUSH IT DOWN, THEN WOBBLES BACK. THE HARDER THE SWIPE, THE BIGGER THE BEND.":"SEU PEIXE AGORA SE DOBRA COM OS SEUS DESLIZES: ARQUEIA QUANDO VOCÊ EMPURRA PARA CIMA E SE CURVA PARA BAIXO, DEPOIS VOLTA BALANÇA
