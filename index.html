 NOW, IN COLOURS THAT MATCH ITS SKIN. AND JACKPOT IS NOW A LUCKY GOLD FISH WITH A LEVER FOR A FIN AND SPINNING REELS ON ITS SIDE.":"AGORA CADA PEIXE TEM UM OLHO MAIS NÍTIDO, EM CORES QUE COMBINAM COM A SKIN. E O JACKPOT AGORA É UM PEIXE DOURADO DA SORTE COM UMA ALAVANCA NO LUGAR DA NADADEIRA E ROLOS GIRANDO NO LADO.","MAKING WAVES":"FAZENDO ONDAS","THE WATER IS ALIVE: WAVES ROLL AND BOUNCE OFF THE PIPES, MOVING PIPES PUSH THE WATER, SPLASHES POP UP NOW AND THEN AND DROPS RUN DOWN THE PIPES. AND YOU CAN SEE THE PIPES UNDER THE WATER.":"A ÁGUA ESTÁ VIVA: AS ONDAS ROLAM E BATEM NOS CANOS, CANOS QUE SE MEXEM EMPURRAM A ÁGUA, DE VEZ EM QUANDO ESPIRRA ÁGUA E GOTAS ESCORREM PELOS CANOS. E DÁ PARA VER OS CANOS DEBAIXO D'ÁGUA.","SPLASH ZONE":"ZONA DE RESPINGOS","FLY LOW AND PUSH OFF THE WATER TO KICK UP WAVES AND SPRAY, SKIMMING LEAVES A WAKE, AND A FISH THAT DIES IN THE WATER MAKES A BIG SPLASH.":"VOE BAIXO E IMPULSIONE-SE NA ÁGUA PARA LEVANTAR ONDAS E RESPINGOS, RASPANDO NELA VOCÊ DEIXA UM RASTRO, E UM PEIXE QUE CAI NA ÁGUA FAZ UM GRANDE SPLASH.","DRIP DRIP":"PINGA PINGA","WAVES AND SPLASHES THAT HIT A PIPE NOW LEAVE DROPS ON IT. THEY RUN DOWN, STOP AND SWELL NOW AND THEN, AND LEAVE A WET STREAK BEHIND.":"ONDAS E RESPINGOS QUE BATEM NUM CANO AGORA DEIXAM GOTAS NELE. ELAS ESCORREM, DE VEZ EM QUANDO PARAM E INCHAM, E DEIXAM UM RASTRO MOLHADO.","ALL ABOARD":"TODOS A BORDO","THE TV AND THE SIGN ON THE TITLE SCREEN NOW FLOAT ON THE WATER IN LIFE RINGS. THEY BOB WITH THE WAVES, AND A TAP DUNKS THEM WITH A SPLASH.":"A TV E A PLACA DA TELA INICIAL AGORA FLUTUAM NA ÁGUA EM BOIAS SALVA-VIDAS. ELAS BALANÇAM COM AS ONDAS, E UM TOQUE AS AFUNDA COM UM SPLASH.",BLOCK:"BLOQUEAR",UNBLOCK:"DESBLOQUEAR",BLOCKED:"BLOQUEADO",UNBLOCKED:"DESBLOQUEADO",REPORT:"DENUNCIAR",REPORTED:"DENUNCIADO","REPORTED. THANK YOU!":"DENUNCIADO. OBRIGADO!","YOU BLOCKED THIS PLAYER":"VOCÊ BLOQUEOU ESTE JOGADOR","YOU CAN NOT MESSAGE THIS PLAYER":"VOCÊ NÃO PODE ESCREVER PARA ESTE JOGADOR","CHAT RULES":"REGRAS DO CHAT","NO BULLYING, HATE OR THREATS":"NADA DE BULLYING, ÓDIO OU AMEAÇAS","NO SEXUAL OR VIOLENT STUFF":"NADA SEXUAL OU VIOLENTO","NO SHARING PERSONAL INFO":"NÃO COMPARTILHE DADOS PESSOAIS","NO SPAM OR SCAMS":"NADA DE SPAM OU GOLPES","TAP A MESSAGE TO REPORT IT OR TO BLOCK ITS SENDER. BREAKING THE RULES GETS YOU MUTED OR REMOVED.":"TOQUE NUMA MENSAGEM PARA DENUNCIAR OU BLOQUEAR QUEM A ENVIOU. QUEM QUEBRAR AS REGRAS SERÁ SILENCIADO OU REMOVIDO.","PRIVACY AND TERMS":"PRIVACIDADE E TERMOS","I AGREE":"ACEITO",PRIVACY:"PRIVACIDADE",ACCOUNT:"CONTA",DELETE:"EXCLUIR","DELETE ACCOUNT":"EXCLUIR CONTA","THIS DELETES YOUR NAME, SCORES, FRIENDS, MESSAGES AND ALL YOUR PROGRESS FOR GOOD. TYPE DELETE TO CONFIRM.":"ISSO EXCLUI PARA SEMPRE SEU NOME, PONTOS, AMIGOS, MENSAGENS E TODO O SEU PROGRESSO. PARA CONFIRMAR, DIGITE: DELETE","TYPE DELETE TO CONFIRM":"DIGITE: DELETE","DELETING...":"EXCLUINDO...","ACCOUNT DELETED":"CONTA EXCLUÍDA","NOT IN TEST MODE":"NÃO NO MODO TESTE","SAFETY FIRST":"SEGURANÇA EM PRIMEIRO LUGAR","TAP A CHAT MESSAGE TO REPORT IT OR BLOCK ITS SENDER. THERE ARE NEW CHAT RULES AND A WORD FILTER, AND THE SETTINGS NOW HAVE THE PRIVACY POLICY AND A WAY TO DELETE YOUR ACCOUNT.":"TOQUE NUMA MENSAGEM PARA DENUNCIAR OU BLOQUEAR QUEM A ENVIOU. HÁ NOVAS REGRAS DO CHAT E UM FILTRO DE PALAVRAS, E NAS CONFIGURAÇÕES AGORA ESTÃO A POLÍTICA DE PRIVACIDADE E UM JEITO DE EXCLUIR SUA CONTA.","SWIPE UP TO RISE":"DESLIZE PARA CIMA PARA SUBIR","PRESS UP TO RISE":"APERTE PARA CIMA PARA SUBIR","SWIPE DOWN TO DIVE":"DESLIZE PARA BAIXO PARA MERGULHAR","PRESS DOWN TO DIVE":"APERTE PARA BAIXO PARA MERGULHAR","SWIPE HARD TO FLIP":"DESLIZE FORTE PARA DAR UM MORTAL","PRESS UP FAST TO FLIP":"APERTE PARA CIMA RÁPIDO PARA DAR UM MORTAL","FASTER SWIPES GO HIGHER":"QUANTO MAIS RÁPIDO, MAIS ALTO","PRESS AGAIN TO GO HIGHER":"APERTE DE NOVO PARA SUBIR MAIS","LET GO AND YOU FALL":"SOLTE E VOCÊ CAI","JUST FOR STYLE":"SÓ PARA ESTILO","HOW TO SWIM":"COMO NADAR","A QUICK 3-STEP TUTORIAL SHOWS HOW TO SWIPE UP, DIVE
